openapi: 3.0.4
info:
  title: Platform Config API Components
  version: 0.2.0
  description: >
    Shared schemas for the platform-config API. The API exposes service-instance
    configuration as typed resources and never exposes raw tenant configuration
    rows. Reads return effective values with a per-field source marker so clients
    can see whether a value is tenant-set or inherited from defaults.
paths: {}
components:
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      description: Identifier of the tenant whose service instance is configured.
      schema:
        type: string
      example: 7b3c2d9e-1f4a-4c8b-9e2d-5a6f7c8b9d01
    StatusListId:
      name: statusListId
      in: path
      required: true
      description: Business key or correlation id of the status list whose signer is authorized.
      schema:
        type: string
        minLength: 1
        maxLength: 200
      example: managed-wallet-wia
    AuthorizationServerId:
      name: authorizationServerId
      in: path
      required: true
      description: Stable UUID of a tenant authorization-server resource. Slugs and issuer URLs are never accepted as resource identifiers.
      schema:
        type: string
        format: uuid
      example: 996d5f68-8836-4af1-b6da-1330b42a2805
    FederationBindingId:
      name: federationBindingId
      in: path
      required: true
      description: Stable UUID of a federation binding owned by the addressed hosted authorization server.
      schema:
        type: string
        format: uuid
      example: fdd0d183-452b-4a55-92fd-94276709a9ca
    AuthorizationServerMigrationId:
      name: authorizationServerMigrationId
      in: path
      required: true
      description: Stable UUID of an authorization-server migration ledger entry owned by the acting tenant.
      schema:
        type: string
        format: uuid
      example: 7b6431bd-807c-4a11-8e17-e18a7793b74c
    KmsResourceHandle:
      name: kmsResourceHandle
      in: path
      required: true
      description: Opaque tenant-scoped typed KMS resource handle.
      schema:
        $ref: '#/components/schemas/KmsResourceHandle'
      example: krh_0123456789012345678901
    KmsProviderIdPath:
      name: providerId
      in: path
      required: true
      description: Identifier addressing a KMS on the KMS REST API.
      schema:
        $ref: '#/components/schemas/KmsProviderId'
      example: acme-azure-vault
    ClientId:
      name: clientId
      in: path
      required: true
      description: OAuth2 client identifier. URL-encode identifiers that contain reserved path characters.
      schema:
        type: string
      example: wallet-web
    InstanceId:
      name: instanceId
      in: path
      required: true
      description: Service instance id. For VDX-backed OID4VCI/OID4VP instances this is the software party id.
      schema:
        type: string
        format: uuid
      example: 4ca2a7cc-f5ef-4e13-8c0d-6a8bd7f6d211
    IdentityId:
      name: identityId
      in: path
      required: true
      description: Identifier of the authenticating identity registered against the AS.
      schema:
        type: string
        format: uuid
      example: 1d9f5c3a-2b7e-4f81-9c0d-6a8bd7f6d211
    ManagementModeQuery:
      name: managementMode
      in: query
      required: false
      description: Filter instances by who manages the service.
      schema:
        $ref: './software-manager-components.yml#/components/schemas/ManagementMode'
    LifecycleStatusQuery:
      name: lifecycleStatus
      in: query
      required: false
      description: Filter instances by lifecycle status.
      schema:
        $ref: './software-manager-components.yml#/components/schemas/LifecycleStatus'
    PageQuery:
      name: page
      in: query
      required: false
      description: Zero-based result page.
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeQuery:
      name: size
      in: query
      required: false
      description: Number of items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    AuthorizationServerMigrationStatusQuery:
      name: status
      in: query
      required: false
      description: Restrict migration ledger entries to one terminal status.
      schema:
        $ref: '#/components/schemas/AuthorizationServerMigrationStatus'
    AuthorizationServerMigrationSourceTypeQuery:
      name: sourceType
      in: query
      required: false
      description: Restrict migration ledger entries to hosted configuration or legacy tenant IdP sources.
      schema:
        $ref: '#/components/schemas/AuthorizationServerMigrationSourceType'

    BusinessWalletSlug:
      name: slug
      in: path
      required: true
      description: Business wallet slug. This is the `<slug>` segment in `wallets.<slug>.*` config keys and the last segment of the derived public route `/wallets/<slug>`.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]{0,62}$'
      example: partners
    BusinessWalletMemberIdentityId:
      name: identityId
      in: path
      required: true
      description: Tenant identity identifier. Targets outside the addressed tenant are reported as not found.
      schema:
        type: string
        format: uuid
    BusinessWalletBindingId:
      name: bindingId
      in: path
      required: true
      description: Identifier of a single business-wallet binding row.
      schema:
        type: string
        format: uuid
      example: 3f6a1c22-8a5b-4a0e-9a6c-2b1d4e7f8a90
    BoundIssuerIdQuery:
      name: boundIssuerId
      in: query
      required: false
      description: Restrict the result to business wallets that hold an issuer binding to this OID4VCI issuer instance id.
      schema:
        type: string
        format: uuid
      example: 4ca2a7cc-f5ef-4e13-8c0d-6a8bd7f6d211
    BoundVerifierIdQuery:
      name: boundVerifierId
      in: query
      required: false
      description: Restrict the result to business wallets that hold a verifier binding to this OID4VP verifier instance id.
      schema:
        type: string
        format: uuid
      example: b12f86b9-fab4-48c7-9e14-e0a930a64182
    BoundAuthorizationServerIdQuery:
      name: boundAuthorizationServerId
      in: query
      required: false
      description: Restrict the result to business wallets that hold a binding to this stable authorization-server resource UUID.
      schema:
        type: string
        format: uuid
      example: 996d5f68-8836-4af1-b6da-1330b42a2805
    BoundDefaultOnlyQuery:
      name: boundDefaultOnly
      in: query
      required: false
      description: >
        Narrows a `boundIssuerId`, `boundVerifierId`, or `boundAuthorizationServerId` filter to
        wallets for which the requested instance is the wallet default for its kind. Ignored when
        no bound-instance filter is supplied.
      schema:
        type: boolean
        default: false
    DetachBindingsQuery:
      name: detachBindings
      in: query
      required: false
      description: >
        Cascades the delete into business-wallet bindings that reference this instance instead of
        rejecting the request with `409`. It never overrides the authorization-server rules: an AS
        that is any wallet's default, or whose removal would leave a wallet with no
        authorization-server binding, is rejected regardless of this flag.
      schema:
        type: boolean
        default: false

  schemas:
    StatusListSigningKeyBindingRequest:
      type: object
      additionalProperties: false
      required: [kmsResourceHandle, kmsKeyAlias]
      properties:
        kmsResourceHandle:
          type: string
          minLength: 1
          description: Opaque tenant-scoped typed KMS resource handle.
          example: krh_01234567890123456789
        kmsKeyAlias:
          type: string
          minLength: 1
          description: Exact key alias within the selected typed KMS resource.
          example: status-list-signing
    StatusListSigningKeyBinding:
      type: object
      required: [kmsResourceHandle, kmsKeyAlias]
      properties:
        kmsResourceHandle:
          $ref: '#/components/schemas/StringConfigField'
        kmsKeyAlias:
          $ref: '#/components/schemas/StringConfigField'
    ValueSource:
      type: string
      description: >
        Origin of an effective configuration value. Possible origins across the configuration
        ladders: `configuration` (a per-credential-configuration setting), `issuer` (an issuer-level
        credential default), `tenant` (a tenant-level override), `design` (a value carried by a bound
        credential design), `license` (a value clamped by the license features granted to the
        tenant, which cannot be overridden by configuration), and `default` (the platform default).
      enum: [tenant, default, design, issuer, configuration, license]
      example: tenant
    StringConfigField:
      type: object
      required: [value, source]
      properties:
        value:
          type: string
          example: jwt
        source:
          $ref: '#/components/schemas/ValueSource'
    UuidConfigField:
      type: object
      required: [value, source]
      properties:
        value:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/ValueSource'
    BooleanConfigField:
      type: object
      required: [value, source]
      properties:
        value:
          type: boolean
        source:
          $ref: '#/components/schemas/ValueSource'
    IntegerConfigField:
      type: object
      required: [value, source]
      properties:
        value:
          type: integer
          format: int64
        source:
          $ref: '#/components/schemas/ValueSource'
    JsonObjectConfigField:
      type: object
      required: [value, source]
      properties:
        value:
          type: object
          additionalProperties: true
        source:
          $ref: '#/components/schemas/ValueSource'
    StringListConfigField:
      type: object
      required: [value, source]
      properties:
        value:
          type: array
          items:
            type: string
            example: openid
        source:
          $ref: '#/components/schemas/ValueSource'
    UuidListConfigField:
      type: object
      required: [value, source]
      properties:
        value:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        source:
          $ref: '#/components/schemas/ValueSource'
    FeatureMode:
      type: string
      description: Feature policy value. `required` means clients must use the feature when applicable.
      enum: [disabled, supported, required]
      example: supported
    FeatureConfigField:
      type: object
      required: [value, source]
      properties:
        value:
          $ref: '#/components/schemas/FeatureMode'
        source:
          $ref: '#/components/schemas/ValueSource'
    AuthorizationServerDeployment:
      type: string
      description: >
        Who runs the authorization server. A HOSTED server runs on this platform and is published at
        `<tenant origin>/as/<slug>`, so the platform mints its tokens and holds its clients. An
        EXTERNAL server is a provider the tenant already runs, reached over its own issuer URL and
        published nowhere here.
      enum: [HOSTED, EXTERNAL]
    AuthorizationServerLifecycle:
      type: string
      enum: [DRAFT, ACTIVE, SUSPENDED, DECOMMISSIONED]
    AuthorizationServerCapability:
      type: string
      enum: [OAUTH2, OIDC]
    AuthorizationServerPurpose:
      type: string
      description: >
        What the tenant intends a server for. GENERAL covers signing users and clients in to the
        platform itself, and the tenant default server always carries it. CREDENTIAL_ISSUANCE records
        that a server is meant to back credential issuance. Purposes describe intent and do not gate
        issuer binding, which is the tenant's own choice. WALLET_LOGIN is accepted but changes
        neither authentication routing nor issuer binding.
      enum: [GENERAL, CREDENTIAL_ISSUANCE, WALLET_LOGIN]
    AuthorizationServerUsage:
      type: string
      description: >
        What an EXTERNAL server was registered for. The two values are independent roles and a
        resource may carry neither. OID4VCI_AUTHORIZATION_SERVER records that the provider serves
        wallets itself. HOSTED_LOGIN_UPSTREAM records that it authenticates end users on behalf of a
        hosted server through a federation binding. Usages describe intent and do not restrict what
        a credential issuer may be bound to: any active server of the tenant that allows an OID4VCI
        grant can be bound, and a bound server is advertised in that issuer's metadata whatever its
        usages say. HOSTED resources declare no usages.
      enum: [OID4VCI_AUTHORIZATION_SERVER, HOSTED_LOGIN_UPSTREAM]
    HostedAuthenticationMode:
      type: string
      description: >
        Where the end user of a HOSTED server authenticates. LOCAL_ONLY keeps the accounts on this
        platform, and the tenant default server stays on it so the tenant never loses its own way
        in. FEDERATED_ONLY holds no local accounts at all: the authorization endpoint sends the user
        to an upstream server named by a federation binding, redirecting straight away when one
        binding is eligible and asking the user to choose when several are, and then exchanges the
        upstream token for a token of its own. That is the wallet proxy shape, and a wallet talking
        to such a server sees an ordinary authorization server and never learns of the upstream.
        HYBRID offers both, so the user chooses between a local account and an upstream server.
      enum: [LOCAL_ONLY, FEDERATED_ONLY, HYBRID]
    AuthorizationServerGrantType:
      type: string
      enum:
        - authorization_code
        - refresh_token
        - urn:ietf:params:oauth:grant-type:pre-authorized_code
    DiscoveryFreshness:
      type: string
      enum: [CURRENT, STALE, INVALID, UNAVAILABLE]
    AuthorizationServerDiscoverySnapshot:
      type: object
      readOnly: true
      additionalProperties: false
      required: [validatedAt, digest, sourceUrls, freshness, capabilities, grantTypes, issuer, scopesSupported, idTokenSigningAlgorithms, tokenEndpointAuthMethodsSupported]
      properties:
        validatedAt:
          type: string
          format: date-time
        digest:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 digest of the canonical reconciled metadata.
        sourceUrls:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uri
        freshness:
          $ref: '#/components/schemas/DiscoveryFreshness'
        capabilities:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AuthorizationServerCapability'
        grantTypes:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AuthorizationServerGrantType'
        issuer:
          type: string
          format: uri
          description: Issuer identifier established by canonical discovery reconciliation.
        authorizationEndpoint:
          type: string
          format: uri
          nullable: true
        tokenEndpoint:
          type: string
          format: uri
          nullable: true
        registrationEndpoint:
          type: string
          format: uri
          nullable: true
          description: RFC 7591 dynamic client registration endpoint discovered for an external authorization server.
        pushedAuthorizationRequestEndpoint:
          type: string
          format: uri
          nullable: true
        jwksUri:
          type: string
          format: uri
          nullable: true
        userinfoEndpoint:
          type: string
          format: uri
          nullable: true
          description: OIDC UserInfo endpoint retained from the reconciled provider metadata for subject-consistency validation after token exchange.
        scopesSupported:
          type: array
          uniqueItems: true
          items:
            type: string
        idTokenSigningAlgorithms:
          type: array
          uniqueItems: true
          items:
            type: string
        tokenEndpointAuthMethodsSupported:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/UpstreamClientAuthenticationMethod'
        validUntil:
          type: string
          format: date-time
          nullable: true
          description: Optional freshness limit persisted with the reconciled snapshot.
    AuthorizationServerResource:
      type: object
      additionalProperties: false
      required: [id, tenantId, displayName, issuer, deployment, lifecycle, capabilities, expectedCapabilities, purposes, usages, allowedGrantTypes, system, defaultForPurposes, revision, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenantId:
          type: string
          readOnly: true
          minLength: 1
          description: Operator-chosen non-blank tenant identifier. The reserved platform tenant is rejected for every operation on this resource collection.
        slug:
          type: string
          nullable: true
          description: Required for HOSTED resources; absent or null for EXTERNAL resources, which have no hosted route.
          pattern: '^[a-z][a-z0-9-]{0,62}$'
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        issuer:
          type: string
          format: uri
        deployment:
          $ref: '#/components/schemas/AuthorizationServerDeployment'
          description: >
            HOSTED with a FEDERATED_ONLY authentication mode is the wallet proxy shape: wallets and
            credential offers address this server while its users authenticate upstream.
        lifecycle:
          $ref: '#/components/schemas/AuthorizationServerLifecycle'
        capabilities:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AuthorizationServerCapability'
          description: Capabilities currently supported by the hosted runtime or latest validated external discovery snapshot.
        expectedCapabilities:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AuthorizationServerCapability'
          description: >
            Persisted operator expectation, distinct from discovered capabilities. EXTERNAL resources
            contain at least one value; HOSTED resources always return an empty array. OIDC alone is
            enough for a HOSTED_LOGIN_UPSTREAM provider, which only authenticates users; OAUTH2 is
            required on top of it for an OID4VCI_AUTHORIZATION_SERVER, which issues tokens to wallets.
        authenticationMode:
          $ref: '#/components/schemas/HostedAuthenticationMode'
          description: >
            Required for HOSTED resources and forbidden for EXTERNAL resources. It decides whether a
            hosted server holds its own accounts or proxies for upstream ones.
        purposes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AuthorizationServerPurpose'
        usages:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AuthorizationServerUsage'
          description: >
            The roles an EXTERNAL provider plays for this tenant. Empty for HOSTED resources, and
            empty for an external provider registered without being placed in any flow.
        allowedGrantTypes:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AuthorizationServerGrantType'
          description: >
            Operator allowlist constrained to grants supported by the hosted runtime or validated
            discovery snapshot. On a HOSTED_LOGIN_UPSTREAM provider the grants serve the federation
            exchange. A separate credential issuer binding can also expose that provider to wallets.
        system:
          type: boolean
          readOnly: true
        defaultForPurposes:
          type: array
          readOnly: true
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AuthorizationServerPurpose'
          description: >
            The purposes this server answers for when nothing else is selected. The one hosted
            server carrying GENERAL is the tenant default, of which every tenant has exactly one.
        discovery:
          $ref: '#/components/schemas/AuthorizationServerDiscoverySnapshot'
        revision:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    CreateAuthorizationServerRequest:
      oneOf:
        - $ref: '#/components/schemas/CreateHostedAuthorizationServerRequest'
        - $ref: '#/components/schemas/CreateExternalAuthorizationServerRequest'
      discriminator:
        propertyName: deployment
        mapping:
          HOSTED: '#/components/schemas/CreateHostedAuthorizationServerRequest'
          EXTERNAL: '#/components/schemas/CreateExternalAuthorizationServerRequest'
    CreateHostedAuthorizationServerRequest:
      type: object
      description: >
        Creates a server run on this platform at `<tenant origin>/as/<slug>`. With LOCAL_ONLY it
        holds the tenant's own accounts; with FEDERATED_ONLY it holds none and proxies for the
        upstream servers its federation bindings name, which is the server wallets address.
      additionalProperties: false
      required: [slug, displayName, issuer, deployment, authenticationMode, purposes]
      properties:
        slug:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,62}$'
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        issuer:
          type: string
          format: uri
          description: Hosted issuer identifier advertised by the authorization server.
        deployment:
          type: string
          enum: [HOSTED]
        authenticationMode:
          $ref: '#/components/schemas/HostedAuthenticationMode'
        purposes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AuthorizationServerPurpose'
        allowedGrantTypes:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AuthorizationServerGrantType'
    CreateExternalAuthorizationServerRequest:
      type: object
      description: >
        Registers a provider the tenant already runs. Nothing is hosted for it, and the usages
        decide what it is used for: serving wallets itself, authenticating users upstream of a
        hosted server, both, or neither.
      additionalProperties: false
      required: [displayName, issuer, deployment, expectedCapabilities, purposes]
      properties:
        slug:
          type: string
          nullable: true
          enum: [null]
          description: Must be omitted or null. Every supplied string, including an empty string, is rejected.
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        issuer:
          type: string
          format: uri
          description: The only discovery input; manual endpoint overrides are not accepted.
        deployment:
          type: string
          enum: [EXTERNAL]
        expectedCapabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AuthorizationServerCapability'
          description: >
            Persisted operator expectation validated against discovery independently of the returned
            discovered capabilities. OIDC alone is enough to authenticate users upstream of a hosted
            server; OAUTH2 is required as well to serve wallets over OID4VCI.
        purposes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AuthorizationServerPurpose'
        usages:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AuthorizationServerUsage'
        allowedGrantTypes:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AuthorizationServerGrantType'
    UpdateAuthorizationServerRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        authenticationMode:
          $ref: '#/components/schemas/HostedAuthenticationMode'
        purposes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AuthorizationServerPurpose'
        usages:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AuthorizationServerUsage'
        allowedGrantTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AuthorizationServerGrantType'
        expectedCapabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AuthorizationServerCapability'
          description: Mutable only for EXTERNAL resources and forbidden for HOSTED resources; validated against refreshed discovery.
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
    AuthorizationServerResourceList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuthorizationServerResource'
        page:
          $ref: '#/components/schemas/PlatformConfigPageMeta'
    AuthorizationServerLifecycleRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
    AuthorizationServerValidationReport:
      type: object
      additionalProperties: false
      required: [valid, checkedAt, errors, warnings]
      properties:
        valid:
          type: boolean
        checkedAt:
          type: string
          format: date-time
        errors:
          type: array
          items:
            $ref: '#/components/schemas/AuthorizationServerValidationIssue'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/AuthorizationServerValidationIssue'
        snapshot:
          $ref: '#/components/schemas/AuthorizationServerDiscoverySnapshot'
    AuthorizationServerValidationIssue:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        path:
          type: string
          nullable: true
        message:
          type: string
    DeleteAuthorizationServerResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean

    AuthorizationServerMigrationSourceType:
      type: string
      enum: [HOSTED_CONFIG, TENANT_IDP]
    AuthorizationServerMigrationStatus:
      type: string
      enum: [FAILED, APPLIED]
    AuthorizationServerMigrationFailureCode:
      type: string
      description: Sanitized failure classification. It contains no exception message, configuration value, credential locator, or secret material.
      enum:
        - INVALID_SOURCE
        - SOURCE_DIGEST_CHANGED
        - TARGET_CONFLICT
        - DISCOVERY_VALIDATION_FAILED
        - SECRET_REFERENCE_INVALID
        - MIGRATION_PLANNING_FAILED
        - MIGRATION_APPLY_FAILED
    HostedAuthorizationServerMigrationDetails:
      type: object
      additionalProperties: false
      required: [sourceType]
      properties:
        sourceType:
          type: string
          enum: [HOSTED_CONFIG]
        slug:
          type: string
          nullable: true
          pattern: '^[a-z][a-z0-9-]{0,62}$'
          description: Required after hosted source planning succeeds; null or absent when planning failed before the slug was parsed.
        issuer:
          type: string
          nullable: true
          format: uri
          description: Required after hosted source planning succeeds; null or absent when planning failed before the issuer was parsed.
        configurationKeyPrefix:
          type: string
          nullable: true
          pattern: '^oauth2\.servers\.[a-z][a-z0-9-]{0,62}$'
          description: Exact non-secret key namespace, without a trailing dot. Required after hosted source planning succeeds; null or absent when planning failed before the namespace was parsed. Configuration values are never returned.
          example: oauth2.servers.default
        default:
          type: boolean
          nullable: true
          description: Required after hosted source planning succeeds; null or absent when planning failed before the default marker was parsed.
        system:
          type: boolean
          nullable: true
          description: Required after hosted source planning succeeds; null or absent when planning failed before the system marker was parsed.
    ExternalAuthorizationServerMigrationDetails:
      type: object
      additionalProperties: false
      required: [sourceType, scopes, claimMappings]
      properties:
        sourceType:
          type: string
          enum: [TENANT_IDP]
        legacyClientId:
          type: string
          nullable: true
          description: Legacy public client identifier when present. Client secret material and secret locators are never returned.
        scopes:
          type: array
          uniqueItems: true
          items:
            type: string
        claimMappings:
          type: object
          additionalProperties:
            type: string
        previouslyEnabled:
          type: boolean
          nullable: true
          description: Required after external source planning succeeds; null or absent when planning failed before the previous enabled state was parsed.
    AuthorizationServerMigrationRemediationDetails:
      oneOf:
        - $ref: '#/components/schemas/HostedAuthorizationServerMigrationDetails'
        - $ref: '#/components/schemas/ExternalAuthorizationServerMigrationDetails'
      discriminator:
        propertyName: sourceType
        mapping:
          HOSTED_CONFIG: '#/components/schemas/HostedAuthorizationServerMigrationDetails'
          TENANT_IDP: '#/components/schemas/ExternalAuthorizationServerMigrationDetails'
    AuthorizationServerMigrationEntry:
      type: object
      additionalProperties: false
      required: [id, tenantId, migrationVersion, sourceType, sourceKey, sourceDigest, status, revision, attemptCount, lastAttemptAt, remediationDetails]
      description: The non-secret current source digest is required when failureCode is SOURCE_DIGEST_CHANGED and is null or absent for every other state.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenantId:
          type: string
          readOnly: true
          minLength: 1
          description: Always the acting operator-chosen customer tenant identifier. Platform-tenant ledger entries are never exposed.
        migrationVersion:
          type: integer
          enum: [1]
          description: Durable authorization-server migration ledger version. The only public value is integer 1.
        sourceType:
          $ref: '#/components/schemas/AuthorizationServerMigrationSourceType'
        sourceKey:
          type: string
          minLength: 1
          maxLength: 500
          description: Stable non-secret source business key.
        sourceDigest:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Required SHA-256 digest of the recorded raw source, computed before source parsing and used for compare-and-set resume.
        currentSourceDigest:
          type: string
          nullable: true
          pattern: '^[a-f0-9]{64}$'
          description: Non-secret digest of the currently observed raw source. Required and non-null exactly when failureCode is SOURCE_DIGEST_CHANGED; otherwise null or absent.
        targetAuthorizationServerId:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: '#/components/schemas/AuthorizationServerMigrationStatus'
        revision:
          type: integer
          format: int64
          minimum: 0
        attemptCount:
          type: integer
          minimum: 1
        lastAttemptAt:
          type: string
          format: date-time
        appliedAt:
          type: string
          format: date-time
          nullable: true
        failureCode:
          type: string
          nullable: true
          enum:
            - INVALID_SOURCE
            - SOURCE_DIGEST_CHANGED
            - TARGET_CONFLICT
            - DISCOVERY_VALIDATION_FAILED
            - SECRET_REFERENCE_INVALID
            - MIGRATION_PLANNING_FAILED
            - MIGRATION_APPLY_FAILED
        remediationDetails:
          $ref: '#/components/schemas/AuthorizationServerMigrationRemediationDetails'
      allOf:
        - oneOf:
            - type: object
              required: [status, failureCode, currentSourceDigest]
              properties:
                status:
                  type: string
                  enum: [FAILED]
                failureCode:
                  type: string
                  enum: [SOURCE_DIGEST_CHANGED]
                currentSourceDigest:
                  type: string
                  pattern: '^[a-f0-9]{64}$'
            - type: object
              properties:
                failureCode:
                  type: string
                  nullable: true
                  enum:
                    - INVALID_SOURCE
                    - TARGET_CONFLICT
                    - DISCOVERY_VALIDATION_FAILED
                    - SECRET_REFERENCE_INVALID
                    - MIGRATION_PLANNING_FAILED
                    - MIGRATION_APPLY_FAILED
                currentSourceDigest:
                  type: string
                  nullable: true
                  maxLength: 0
                  description: Null-only when the failure is not SOURCE_DIGEST_CHANGED. The base digest pattern makes every non-null string invalid in this branch.
    AuthorizationServerMigrationEntryList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuthorizationServerMigrationEntry'
        page:
          $ref: '#/components/schemas/PlatformConfigPageMeta'
    ResumeAuthorizationServerMigrationRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, expectedSourceDigest]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
          description: Ledger revision observed by the administrator's fresh read.
        expectedSourceDigest:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Stored source digest observed by the administrator. A changed digest fails closed and cannot be acknowledged by resume.
    AcceptAuthorizationServerMigrationSourceChangeRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, expectedRecordedSourceDigest, expectedCurrentSourceDigest, reason]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
          description: Ledger revision observed by the administrator's fresh read.
        expectedRecordedSourceDigest:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Digest currently recorded in the failed ledger entry.
        expectedCurrentSourceDigest:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Digest of the changed source explicitly reviewed by the administrator.
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '.*\S.*'
          description: Non-blank operator justification stored with the audited digest transition.

    TypedSecretReference:
      type: object
      additionalProperties: false
      required: [resourceHandle, purpose]
      properties:
        resourceHandle:
          type: string
          minLength: 1
          description: Opaque secret-management resource handle. Secret material and provider locators are never returned.
        purpose:
          type: string
          enum: [OAUTH_CLIENT_SECRET]
    TypedKmsReference:
      type: object
      additionalProperties: false
      required: [kmsResourceHandle, kmsKeyAlias, purpose]
      properties:
        kmsResourceHandle:
          type: string
          minLength: 1
        kmsKeyAlias:
          type: string
          minLength: 1
        purpose:
          type: string
          enum: [OAUTH_CLIENT_ASSERTION_SIGNING, TOKEN_SIGNING]
    UpstreamClientAuthenticationMethod:
      type: string
      enum: [none, client_secret_basic, client_secret_post, private_key_jwt]
    FederationClientAuthentication:
      type: object
      additionalProperties: false
      required: [method]
      properties:
        method:
          $ref: '#/components/schemas/UpstreamClientAuthenticationMethod'
        clientId:
          type: string
          nullable: true
        secretReference:
          $ref: '#/components/schemas/TypedSecretReference'
        secretValue:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          description: Write-once value stored immediately through secret management. It is mutually exclusive with secretReference and is never returned or logged.
        kmsReference:
          $ref: '#/components/schemas/TypedKmsReference'
    FederationBindingStatus:
      type: string
      enum: [UNVALIDATED, VALID, INVALID, DISABLED]
    FederationBinding:
      type: object
      additionalProperties: false
      required: [id, hostedAuthorizationServerId, externalAuthorizationServerId, order, enabled, scopes, claimsMapping, clientAuthentication, status, revision]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        hostedAuthorizationServerId:
          type: string
          format: uuid
          readOnly: true
          description: >
            The hosted server that owns this binding. It is the server wallets and platform clients
            address, and the one that mints the token they end up with.
        externalAuthorizationServerId:
          type: string
          format: uuid
          description: >
            The upstream provider the end user actually authenticates at. It must be an EXTERNAL
            resource with a validated OIDC capability. Through this binding it stays behind the
            hosted server and no wallet reaches it. Providers registered for this role carry the
            HOSTED_LOGIN_UPSTREAM usage. Binding the same provider to a credential issuer as well is
            a separate decision and does put it in that issuer's metadata.
        order:
          type: integer
          minimum: 0
          description: >
            Where this upstream sits when the hosted server has several and asks the user to choose.
            A hosted server with exactly one eligible binding redirects to it without asking.
        enabled:
          type: boolean
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
          description: The scopes requested from the upstream provider on the federated authorization request.
        claimsMapping:
          type: object
          additionalProperties:
            type: string
          description: >
            Upstream claim name to hosted claim name. It decides what of the upstream identity
            reaches the token the hosted server mints.
        clientAuthentication:
          $ref: '#/components/schemas/FederationClientAuthentication'
        status:
          $ref: '#/components/schemas/FederationBindingStatus'
        lastValidatedAt:
          type: string
          format: date-time
          nullable: true
        revision:
          type: integer
          format: int64
          minimum: 0
    CreateFederationBindingRequest:
      type: object
      additionalProperties: false
      required: [externalAuthorizationServerId, order, enabled, scopes, claimsMapping, clientAuthentication]
      properties:
        externalAuthorizationServerId:
          type: string
          format: uuid
          description: >
            The upstream provider to delegate authentication to. It must be an EXTERNAL resource
            with a validated OIDC capability. The hosted side of the binding comes from the path.
        order:
          type: integer
          minimum: 0
        enabled:
          type: boolean
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        claimsMapping:
          type: object
          additionalProperties:
            type: string
        clientAuthentication:
          $ref: '#/components/schemas/FederationClientAuthentication'
    UpdateFederationBindingRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      required: [expectedRevision]
      description: Updates mutable binding configuration under revision CAS. Enable and disable are distinct lifecycle operations and cannot be requested here.
      properties:
        order:
          type: integer
          minimum: 0
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        claimsMapping:
          type: object
          additionalProperties:
            type: string
        clientAuthentication:
          $ref: '#/components/schemas/FederationClientAuthentication'
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
    EnabledFederationBinding:
      allOf:
        - $ref: '#/components/schemas/FederationBinding'
        - type: object
          required: [enabled, status]
          properties:
            enabled:
              type: boolean
              enum: [true]
            status:
              type: string
              enum: [VALID]
    DisabledFederationBinding:
      allOf:
        - $ref: '#/components/schemas/FederationBinding'
        - type: object
          required: [enabled, status]
          properties:
            enabled:
              type: boolean
              enum: [false]
            status:
              type: string
              enum: [DISABLED]
    FederationBindingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FederationBinding'
    ReorderFederationBindingsRequest:
      type: object
      additionalProperties: false
      required: [bindingIds, expectedRevision]
      properties:
        bindingIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
    HostedAuthorizationServerConfig:
      type: object
      additionalProperties: false
      properties:
        publicBaseUrl:
          type: string
          format: uri
        order:
          type: integer
          minimum: 0
        enabled:
          type: boolean
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        claimsMapping:
          type: object
          additionalProperties:
            type: string
        clientAuthentication:
          $ref: '#/components/schemas/FederationClientAuthentication'
        status:
          $ref: '#/components/schemas/FederationBindingStatus'
        lastValidatedAt:
          type: string
          format: date-time
          nullable: true
        revision:
          type: integer
          format: int64
          minimum: 0
        signingAlgorithm:
          type: string
          enum: [ES256, ES384, EdDSA, PS256]
        claimMappings:
          type: object
          additionalProperties:
            type: string

    ReplaceHostedAuthorizationServerConfigurationRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, configuration]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
          description: Authorization-server resource revision observed by the administrator before replacing hosted configuration.
        configuration:
          $ref: '#/components/schemas/HostedAuthorizationServerConfig'
    HostedAuthorizationServerSigning:
      type: object
      additionalProperties: false
      required: [kmsReference]
      properties:
        kmsReference:
          $ref: '#/components/schemas/TypedKmsReference'
    Oid4vciAuthorizationServerBinding:
      type: object
      additionalProperties: false
      required: [id, issuerId, authorizationServerId, enabled, default, revision]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        issuerId:
          type: string
          format: uuid
          readOnly: true
        authorizationServerId:
          type: string
          format: uuid
        enabled:
          type: boolean
        default:
          type: boolean
          description: Exactly one enabled binding is the issuer default.
        allowedGrantTypes:
          type: array
          nullable: true
          minItems: 1
          uniqueItems: true
          description: Optional binding-level allowlist intersected with the selected authorization server's supported OID4VCI grants.
          items:
            $ref: '#/components/schemas/Oid4vciAuthorizationServerGrantType'
        revision:
          type: integer
          format: int64
          minimum: 0
    Oid4vciAuthorizationServerBindingRequest:
      type: object
      additionalProperties: false
      required: [authorizationServerId, enabled, default]
      properties:
        authorizationServerId:
          type: string
          format: uuid
        enabled:
          type: boolean
        default:
          type: boolean
        allowedGrantTypes:
          type: array
          nullable: true
          minItems: 1
          uniqueItems: true
          description: Optional binding-level allowlist. Omit it to inherit every supported OID4VCI grant from the selected authorization server.
          items:
            $ref: '#/components/schemas/Oid4vciAuthorizationServerGrantType'
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
    Oid4vciAuthorizationServerBindingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Oid4vciAuthorizationServerBinding'
    Oid4vciAuthorizationServerGrantType:
      type: string
      enum: [authorization_code, 'urn:ietf:params:oauth:grant-type:pre-authorized_code']
    Oid4vciAuthorizationServerOverride:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          description: Durable optimistic revision of this credential or template override. Zero represents no explicit override.
        authorizationServerId:
          type: string
          format: uuid
          nullable: true
          description: Stable AS resource UUID. Null clears the override and resolves through the next selection layer.
        allowedGrantTypes:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Oid4vciAuthorizationServerGrantType'
    ReplaceOid4vciAuthorizationServerOverrideRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        authorizationServerId:
          type: string
          format: uuid
          nullable: true
          description: Stable AS resource UUID. Null clears the override and resolves through the next selection layer.
        allowedGrantTypes:
          type: array
          uniqueItems: true
          minItems: 1
          items:
            $ref: '#/components/schemas/Oid4vciAuthorizationServerGrantType'
    DeleteOid4vciAuthorizationServerOverrideRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
    Oid4vciProtocolProfile:
      type: string
      enum: [OID4VCI_1_0_FINAL, OID4VCI_1_1_DRAFT_2A1F0513]
    Oid4vciIssuerProtocolProfile:
      type: object
      additionalProperties: false
      required: [issuerId, profile, revision, updatedAt]
      properties:
        issuerId:
          type: string
          format: uuid
        profile:
          $ref: '#/components/schemas/Oid4vciProtocolProfile'
        revision:
          type: integer
          format: int64
          minimum: 0
        updatedAt:
          type: string
          format: date-time
    Oid4vciProfileUpgradeRequest:
      type: object
      additionalProperties: false
      required: [targetProfile, expectedRevision]
      properties:
        targetProfile:
          $ref: '#/components/schemas/Oid4vciProtocolProfile'
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
    ApplyOid4vciProfileUpgradeRequest:
      type: object
      additionalProperties: false
      required: [targetProfile, expectedRevision, reason, idempotencyKey]
      properties:
        targetProfile:
          $ref: '#/components/schemas/Oid4vciProtocolProfile'
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Operator-supplied audit reason for applying the governed profile change.
        idempotencyKey:
          type: string
          format: uuid
          description: Stable request UUID used to make profile application and audit dispatch idempotent.
    Oid4vciProfileUpgradeIssue:
      type: object
      additionalProperties: false
      required: [code, category, message]
      properties:
        code:
          type: string
        category:
          type: string
          enum: [CREDENTIAL, METADATA, GRANT, AUTHORIZATION_SERVER_BINDING, TEMPLATE]
        resourceId:
          type: string
          nullable: true
        message:
          type: string
    Oid4vciProfileUpgradeReport:
      type: object
      additionalProperties: false
      required: [issuerId, currentProfile, targetProfile, compatible, issues, checkedAt, revision]
      properties:
        issuerId:
          type: string
          format: uuid
        currentProfile:
          $ref: '#/components/schemas/Oid4vciProtocolProfile'
        targetProfile:
          $ref: '#/components/schemas/Oid4vciProtocolProfile'
        compatible:
          type: boolean
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Oid4vciProfileUpgradeIssue'
        checkedAt:
          type: string
          format: date-time
        revision:
          type: integer
          format: int64

    # ---- Email accounts ------------------------------------------------------
    # Email accounts are tenant-owned mail sender configurations. They are represented in the
    # party model as EXTERNAL software entries with an EMAIL_SERVER capability and config rooted at
    # `vdx.service.email.accounts.<accountId>.*`. Accounts created for the platform tenant are the
    # named defaults used by tenant mail delivery unless a tenant defines its own account.

    SmtpAccountConfig:
      type: object
      additionalProperties: false
      description: Effective SMTP transport settings for a mail account. Plaintext passwords are never returned.
      required: [host]
      properties:
        host:
          type: string
          description: SMTP server host name.
          example: smtp.mail.example
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 587
          example: 587
        username:
          type: string
          nullable: true
          description: SMTP username when authentication is required.
          example: support@acme.example
        credentialState:
          $ref: '#/components/schemas/SmtpCredentialState'
        useStarttls:
          type: boolean
          default: true
          description: Use STARTTLS for the SMTP connection.
        useSsl:
          type: boolean
          default: false
          description: Use implicit SSL/TLS for the SMTP connection.
        connectionTimeoutMs:
          type: integer
          format: int64
          minimum: 1
          default: 5000
          description: Connection timeout in milliseconds.
        readTimeoutMs:
          type: integer
          format: int64
          minimum: 1
          default: 10000
          description: Read timeout in milliseconds.

    SmtpAccountWriteConfig:
      type: object
      additionalProperties: false
      description: >
        Writable SMTP transport settings. Authentication is changed only through
        the resource-specific `credential` mutation; raw secret IDs, provider
        references, paths, and environment-variable names are not accepted.
      required: [host]
      properties:
        host:
          type: string
          description: SMTP server host name.
          example: smtp.mail.example
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 587
          example: 587
        username:
          type: string
          nullable: true
          description: SMTP username when authentication is required.
          example: support@acme.example
        credential:
          $ref: '#/components/schemas/SmtpCredentialMutation'
        useStarttls:
          type: boolean
          default: true
          description: Use STARTTLS for the SMTP connection.
        useSsl:
          type: boolean
          default: false
          description: Use implicit SSL/TLS for the SMTP connection.
        connectionTimeoutMs:
          type: integer
          format: int64
          minimum: 1
          default: 5000
          description: Connection timeout in milliseconds.
        readTimeoutMs:
          type: integer
          format: int64
          minimum: 1
          default: 10000
          description: Read timeout in milliseconds.

    SmtpCredentialState:
      type: string
      description: Read-safe authentication state for this SMTP account. It never reveals a binding, locator, or secret identifier.
      enum: [NOT_REQUIRED, CONFIGURED, MISSING, DEGRADED]

    SmtpCredentialMutation:
      type: object
      additionalProperties: false
      description: >
        Resource-specific SMTP password create or rotation request. `password` is
        write-only and is stored directly in the account's immutable credential
        binding. Existing-secret attach and locator changes are unavailable until
        the typed binding writer supports them; raw secret identifiers are never accepted.
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: Plaintext SMTP password to create or rotate; never returned, logged, or retained in browser state.
        detach:
          type: boolean
          default: false
          description: Remove the account's SMTP credential binding. Cannot be combined with `password`.
      oneOf:
        - required: [password]
        - required: [detach]

    EmailAccountConfig:
      type: object
      additionalProperties: false
      description: Mail sender configuration consumed by the EDK email service.
      required: [fromAddress]
      properties:
        transportId:
          type: string
          default: smtp
          description: Transport implementation id. `smtp` is the currently supported transport.
          example: smtp
        fromAddress:
          type: string
          format: email
          description: Sender email address used by this account.
          example: support@acme.example
        fromName:
          type: string
          nullable: true
          description: Sender display name.
          example: Acme Support
        replyTo:
          type: string
          format: email
          nullable: true
          description: Optional reply-to email address.
          example: helpdesk@acme.example
        smtp:
          $ref: '#/components/schemas/SmtpAccountConfig'

    EmailAccountWriteConfig:
      type: object
      additionalProperties: false
      description: Writable mail sender configuration consumed by the EDK email service.
      required: [fromAddress]
      properties:
        transportId:
          type: string
          default: smtp
          description: Transport implementation id. `smtp` is the currently supported transport.
          example: smtp
        fromAddress:
          type: string
          format: email
          description: Sender email address used by this account.
          example: support@acme.example
        fromName:
          type: string
          nullable: true
          description: Sender display name.
          example: Acme Support
        replyTo:
          type: string
          format: email
          nullable: true
          description: Optional reply-to email address.
          example: helpdesk@acme.example
        smtp:
          $ref: '#/components/schemas/SmtpAccountWriteConfig'

    EmailAccountCreateRequest:
      type: object
      additionalProperties: false
      description: >
        Create request for a tenant email account. The account becomes an EXTERNAL / THIRD_PARTY
        EMAIL_SERVER software entry and writes config under `vdx.service.email.accounts.<accountId>.*`.
      required: [displayName, config]
      properties:
        accountId:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
          nullable: true
          description: Stable account id used in the config key prefix. If omitted, the created party id is used.
          example: support
        displayName:
          type: string
          description: Human-readable account name.
          example: Acme Support Mail
        managementMode:
          allOf:
            - $ref: './software-manager-components.yml#/components/schemas/ManagementMode'
          default: EXTERNAL
          description: Email accounts are externally managed; the server rejects non-EXTERNAL values.
        runtimeMode:
          type: string
          allOf:
            - $ref: './software-manager-components.yml#/components/schemas/RuntimeMode'
          nullable: true
          default: THIRD_PARTY
        config:
          $ref: '#/components/schemas/EmailAccountWriteConfig'

    EmailAccountUpdateRequest:
      type: object
      additionalProperties: false
      description: Partial update request for a tenant email account.
      properties:
        config:
          $ref: '#/components/schemas/EmailAccountWriteConfig'

    EmailAccountTestSendRequest:
      type: object
      description: Request to send a test message through a configured tenant email account.
      required: [to]
      properties:
        to:
          type: string
          format: email
          description: Recipient address for the test message.
          example: operator@acme.example
        subject:
          type: string
          nullable: true
          description: Optional subject. When omitted the server uses a VDX test-message subject.
          example: Test email from Acme Support
        textBody:
          type: string
          nullable: true
          description: Optional plain-text body. When omitted and `htmlBody` is also absent, a default test body is used.
        htmlBody:
          type: string
          nullable: true
          description: Optional HTML body.

    EmailAccountTestSendResponse:
      type: object
      description: Result returned after the test email has been accepted by the configured transport.
      required: [status, accountId]
      properties:
        status:
          type: string
          enum: [SENT]
          example: SENT
        accountId:
          type: string
          description: Stable email account id used for delivery.
          example: support
        deliveryId:
          type: string
          nullable: true
          description: Provider or transport message id when available.
        providerMessageId:
          type: string
          nullable: true
          description: Provider message id when available.
        transportId:
          type: string
          nullable: true
          description: Transport implementation that accepted the message.
          example: smtp

    EmailTypeId:
      type: string
      pattern: '^[a-z][a-z0-9]*(?:[.-][a-z0-9]+)*$'
      description: Immutable registered business-event id used for content selection and sender routing.
      example: identity.password-change

    EmailVariableDefinition:
      type: object
      required: [name, type, required, sensitive]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]*$'
        type:
          type: string
          enum: [STRING, NUMBER, BOOLEAN, URL, DATETIME, JSON]
        required:
          type: boolean
        sensitive:
          type: boolean
          description: Sensitive values are accepted for one render only and omitted from previews, logs, audit details, and persisted samples.
        description:
          type: string
          nullable: true
        sampleValue:
          description: Non-sensitive JSON sample used by authoring previews.

    EmailTypeDefinition:
      type: object
      required: [emailTypeId, displayName, description, origin, enabled, defaultLocale, variables]
      properties:
        emailTypeId:
          $ref: '#/components/schemas/EmailTypeId'
        displayName:
          type: string
        description:
          type: string
        origin:
          type: string
          enum: [SYSTEM, CUSTOM]
          description: System ids and their variable contracts are product-owned and immutable.
        enabled:
          type: boolean
        defaultLocale:
          type: string
          pattern: '^[A-Za-z]{2,8}(?:-[A-Za-z0-9]{1,8})*$'
        variables:
          type: array
          items:
            $ref: '#/components/schemas/EmailVariableDefinition'
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    EmailTypeCreateRequest:
      type: object
      required: [emailTypeId, displayName, description, enabled, defaultLocale, variables]
      properties:
        emailTypeId:
          $ref: '#/components/schemas/EmailTypeId'
        displayName:
          type: string
        description:
          type: string
        enabled:
          type: boolean
          default: true
        defaultLocale:
          type: string
          pattern: '^[A-Za-z]{2,8}(?:-[A-Za-z0-9]{1,8})*$'
        variables:
          type: array
          items:
            $ref: '#/components/schemas/EmailVariableDefinition'

    EmailTypeUpdateRequest:
      type: object
      description: Custom types may update metadata and variable contracts; system types accept enabled-state changes only.
      properties:
        displayName:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        defaultLocale:
          type: string
          pattern: '^[A-Za-z]{2,8}(?:-[A-Za-z0-9]{1,8})*$'
        variables:
          type: array
          items:
            $ref: '#/components/schemas/EmailVariableDefinition'

    EmailLocaleContent:
      type: object
      required: [subject, preheader, htmlFragment, textBody]
      properties:
        subject:
          type: string
        preheader:
          type: string
        htmlFragment:
          type: string
          description: Sanitized email-safe Mustache HTML fragment; the server supplies the responsive shell and live branding.
        textBody:
          type: string
          description: Mustache plain-text alternative.

    EmailTemplateRevision:
      type: object
      required: [revision, locales, createdAt]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
        locales:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: '#/components/schemas/EmailLocaleContent'
          description: Map keyed by canonical BCP-47 locale.
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          nullable: true
        note:
          type: string
          nullable: true

    EmailTemplate:
      type: object
      required: [templateId, emailTypeId, layer, defaultLocale, draftRevision, revisionHistory]
      properties:
        templateId:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,95}$'
        emailTypeId:
          $ref: '#/components/schemas/EmailTypeId'
        applicationId:
          type: string
          nullable: true
          description: Optional same-tenant application selector. Null is the tenant-wide default for the type.
        layer:
          type: string
          enum: [PRODUCT_DEFAULT, PLATFORM_OVERRIDE, TENANT_OVERRIDE]
        defaultLocale:
          type: string
          pattern: '^[A-Za-z]{2,8}(?:-[A-Za-z0-9]{1,8})*$'
        draftRevision:
          $ref: '#/components/schemas/EmailTemplateRevision'
        publishedRevision:
          $ref: '#/components/schemas/EmailTemplateRevision'
        revisionHistory:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/EmailTemplateRevision'
        inheritedFromTemplateId:
          type: string
          nullable: true

    EmailTemplateCreateRequest:
      type: object
      required: [templateId, emailTypeId, defaultLocale, locales]
      properties:
        templateId:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,95}$'
        emailTypeId:
          $ref: '#/components/schemas/EmailTypeId'
        applicationId:
          type: string
          nullable: true
        defaultLocale:
          type: string
          pattern: '^[A-Za-z]{2,8}(?:-[A-Za-z0-9]{1,8})*$'
        locales:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: '#/components/schemas/EmailLocaleContent'

    CreateEmailCatalogEntryRequest:
      type: object
      required: [type, template]
      properties:
        type:
          $ref: '#/components/schemas/EmailTypeCreateRequest'
        template:
          $ref: '#/components/schemas/EmailTemplateCreateRequest'

    CreateEmailCatalogEntryResponse:
      type: object
      required: [type, template]
      properties:
        type:
          $ref: '#/components/schemas/EmailTypeDefinition'
        template:
          $ref: '#/components/schemas/EmailTemplate'

    EmailTemplateDraftRequest:
      type: object
      required: [expectedRevision, defaultLocale, locales]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 1
        defaultLocale:
          type: string
          pattern: '^[A-Za-z]{2,8}(?:-[A-Za-z0-9]{1,8})*$'
        locales:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: '#/components/schemas/EmailLocaleContent'
        note:
          type: string
          nullable: true

    EmailTemplatePublishRequest:
      type: object
      required: [expectedDraftRevision]
      properties:
        expectedDraftRevision:
          type: integer
          format: int64
          minimum: 1
        note:
          type: string
          nullable: true

    EmailTemplatePreviewRequest:
      type: object
      required: [source, variables]
      properties:
        source:
          type: string
          enum: [DRAFT, PUBLISHED]
        locale:
          type: string
          nullable: true
        applicationId:
          type: string
          nullable: true
        content:
          description: >-
            Unsaved locale content to render instead of the stored revision. When set, the
            template is resolved for its type, layout and branding only, and `source` is ignored.
            Lets an editor preview a draft without persisting an override.
          type: object
          allOf:
            - $ref: '#/components/schemas/EmailLocaleContent'
          nullable: true
        variables:
          type: object
          additionalProperties: true

    EmailTemplatePreview:
      type: object
      required: [templateId, emailTypeId, revision, resolvedLocale, subject, preheader, html, textBody, brandingSource]
      properties:
        templateId:
          type: string
        emailTypeId:
          $ref: '#/components/schemas/EmailTypeId'
        revision:
          type: integer
          format: int64
        resolvedLocale:
          type: string
        subject:
          type: string
        preheader:
          type: string
        html:
          type: string
          description: Fully rendered and sanitized responsive HTML shell.
        textBody:
          type: string
        brandingSource:
          type: string
          enum: [APPLICATION, TENANT, PRODUCT]

    EmailTemplateRollbackRequest:
      type: object
      required: [expectedDraftRevision]
      properties:
        expectedDraftRevision:
          type: integer
          format: int64

    EmailTemplateTestSendRequest:
      type: object
      required: [to, source, variables]
      properties:
        to:
          type: string
          format: email
        source:
          type: string
          enum: [DRAFT, PUBLISHED]
        locale:
          type: string
          nullable: true
        applicationId:
          type: string
          nullable: true
        variables:
          type: object
          additionalProperties: true

    EmailTypeList:
      type: array
      items:
        $ref: '#/components/schemas/EmailTypeDefinition'

    EmailTemplateList:
      type: array
      items:
        $ref: '#/components/schemas/EmailTemplate'

    EmailAccountAssignment:
      type: object
      required: [accountId, emailTypeIds]
      properties:
        accountId:
          type: string
        emailTypeIds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EmailTypeId'

    EmailRoutingPolicy:
      type: object
      required: [accountAssignments, disabledEmailTypeIds]
      description: Atomic account-centric local routing policy. One email type may occur in at most one assignment.
      properties:
        defaultAccountId:
          type: string
          nullable: true
          description: Local default account. Null inherits the platform default.
        accountAssignments:
          type: array
          items:
            $ref: '#/components/schemas/EmailAccountAssignment'
        disabledEmailTypeIds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EmailTypeId'

    ResolvedEmailRoute:
      type: object
      required: [emailType, status]
      properties:
        emailType:
          $ref: '#/components/schemas/EmailTypeDefinition'
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE, DISABLED, INVALID]
        accountId:
          type: string
          nullable: true
        accountScope:
          type: string
          enum: [TENANT, APP]
          nullable: true
        source:
          type: string
          enum: [EXPLICIT_ASSIGNMENT, LOCAL_DEFAULT, PLATFORM_DEFAULT, EXPLICIT_TEST]
          nullable: true
        fromAddress:
          type: string
          format: email
          nullable: true
          description: Redacted inherited sender address; connection settings and credentials are omitted.
        reason:
          type: string
          nullable: true
          description: Safe resolution or validation failure reason.

    EmailRoutingView:
      type: object
      required: [tenantId, localPolicy, effectiveRoutes]
      properties:
        tenantId:
          type: string
        localPolicy:
          $ref: '#/components/schemas/EmailRoutingPolicy'
        inheritedPlatformDefault:
          $ref: '#/components/schemas/ResolvedEmailRoute'
        effectiveRoutes:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedEmailRoute'

    EmailSoftwareConfigBinding:
      type: object
      description: Binding from the email software party/capability to its config key prefix.
      required: [id, tenantId, softwarePartyId, appId, profile, configScope, configKeyPrefix, bindingType, isActive]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
        softwarePartyId:
          type: string
          format: uuid
        capabilityId:
          type: string
          format: uuid
          nullable: true
        deploymentId:
          type: string
          format: uuid
          nullable: true
        appId:
          type: string
          example: vdx-service-email
        appVersion:
          type: string
          nullable: true
        profile:
          type: string
          example: default
        serviceId:
          type: string
          nullable: true
        configScope:
          type: string
          example: TENANT
        configScopeIdentifier:
          type: string
          nullable: true
        configKeyPrefix:
          type: string
          example: vdx.service.email.accounts.support
        bindingType:
          type: string
          example: email.account.smtp.v1
        isActive:
          type: boolean

    EmailAccountDetail:
      type: object
      description: Email account software-party detail.
      required:
        - partyId
        - tenantId
        - accountId
        - displayName
        - softwareKind
        - managementMode
        - capability
        - endpoints
        - credentials
        - createdAt
        - updatedAt
      properties:
        partyId:
          type: string
          format: uuid
        tenantId:
          type: string
        accountId:
          type: string
          description: Stable account id used below `vdx.service.email.accounts`.
          example: support
        displayName:
          type: string
          example: Acme Support Mail
        origin:
          type: string
          nullable: true
        softwareKind:
          $ref: './software-manager-components.yml#/components/schemas/SoftwareKind'
        managementMode:
          $ref: './software-manager-components.yml#/components/schemas/ManagementMode'
        runtimeMode:
          type: string
          allOf:
            - $ref: './software-manager-components.yml#/components/schemas/RuntimeMode'
          nullable: true
        capability:
          type: object
          description: Software capability row for EMAIL_SERVER.
          additionalProperties: true
        config:
          type: object
          allOf:
            - $ref: '#/components/schemas/EmailAccountConfig'
          nullable: true
        configBinding:
          type: object
          allOf:
            - $ref: '#/components/schemas/EmailSoftwareConfigBinding'
          nullable: true
        endpoints:
          type: array
          items:
            type: object
            additionalProperties: true
        credentials:
          type: array
          items:
            type: object
            additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        partyId: 2e1e3ff6-6c3b-4f50-b97a-0c7ebd7c8c41
        tenantId: 7b3c2d9e-1f4a-4c8b-9e2d-5a6f7c8b9d01
        accountId: support
        displayName: Acme Support Mail
        softwareKind: SERVER
        managementMode: EXTERNAL
        runtimeMode: THIRD_PARTY
        capability:
          capabilityType: EMAIL_SERVER
          isEnabled: true
          lifecycleStatus: ACTIVE
        config:
          transportId: smtp
          fromAddress: support@acme.example
          fromName: Acme Support
          replyTo: helpdesk@acme.example
          smtp:
            host: smtp.mail.example
            port: 587
            username: support@acme.example
            useStarttls: true
            useSsl: false
        endpoints: []
        credentials: []
        createdAt: '2026-06-16T09:15:00Z'
        updatedAt: '2026-06-16T09:15:00Z'

    EmailAccountList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EmailAccountDetail'
        page:
          $ref: '#/components/schemas/PlatformConfigPageMeta'

    KmsResourceHandle:
      type: string
      pattern: '^krh_[A-Za-z0-9_-]{22,}$'
      description: >
        Opaque tenant-scoped typed KMS resource handle. It is not a provider id,
        key alias, key id, resolver, locator, or credential capability.

    KmsPlatformCredentialSecretRef:
      type: string
      pattern: '^kcr_[A-Za-z0-9_-]{20,180}_(software|aws|azure)$'
      description: Opaque platform-managed credential reference.

    KmsTenantExternalCredentialSecretRef:
      type: string
      pattern: '^sec_[A-Za-z0-9_-]{16,128}$'
      description: Opaque tenant-owned external secret reference.

    KmsCredentialSecretRef:
      oneOf:
        - $ref: '#/components/schemas/KmsPlatformCredentialSecretRef'
        - $ref: '#/components/schemas/KmsTenantExternalCredentialSecretRef'
      description: Read-safe platform-managed or tenant-owned credential reference.

    KmsResourceKind:
      type: string
      enum: [SOFTWARE, AWS_KMS, AZURE_KEY_VAULT]

    KmsResourceState:
      type: string
      enum: [CONFIGURED, DEGRADED, DETACHED, RETIRED]

    KmsResourceHealth:
      type: string
      enum: [UNKNOWN, HEALTHY, STALE, DEGRADED, FAILED]

    KmsCredentialOwnership:
      type: string
      description: >
        Who owns the credential a KMS resource authenticates with.
        PRODUCT_MANAGED resources use a product-owned credential binding.
        TENANT_SUPPLIED cloud resources retain a tenant-owned secret reference
        paired with its validated provider assignment.
        This is independent of who owns the KMS itself.
      enum: [PRODUCT_MANAGED, TENANT_SUPPLIED]

    KmsProviderId:
      type: string
      minLength: 3
      maxLength: 64
      pattern: '^[a-z][a-z0-9-]{2,63}$'
      description: >
        Operator-chosen identifier addressing this KMS on the KMS REST API. Unique within the
        owning tenant and immutable after creation, because generated keys reference it.
      example: acme-azure-vault

    SoftwareKmsStorageMode:
      type: string
      enum: [MEMORY, FILE, UPLOADED_FILE, MOUNTED_FILE]

    KmsTypedResourceAction:
      type: string
      enum: [VALIDATE, CHANGE_REFERENCE, UPDATE_CREDENTIAL, ROTATE_CREDENTIAL, DETACH, RETIRE]

    KmsOfferingSummary:
      type: object
      additionalProperties: false
      required: [kind, label, available, defaultSelected, health, supportedCredentialOwnerships]
      properties:
        kind:
          $ref: '#/components/schemas/KmsResourceKind'
        label:
          type: string
          minLength: 1
          maxLength: 160
        available:
          type: boolean
        defaultSelected:
          type: boolean
        health:
          $ref: '#/components/schemas/KmsResourceHealth'
        supportedCredentialOwnerships:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/KmsCredentialOwnership'

    KmsOfferingCollection:
      type: object
      additionalProperties: false
      required: [offerings]
      properties:
        offerings:
          type: array
          items:
            $ref: '#/components/schemas/KmsOfferingSummary'

    KmsSharingFulfillment:
      type: string
      description: >
        How enabling an offered KMS is fulfilled for a tenant.
        TEMPLATE clones the offering into a KMS the tenant owns and configures itself, keeping
        each tenant's credential binding separate.
        SHARED_INSTANCE attaches the tenant to the platform's own KMS; the tenant never sees its
        configuration or credentials, and keys are namespaced per tenant.
      enum: [TEMPLATE, SHARED_INSTANCE]
      default: TEMPLATE

    KmsResourceSharing:
      type: object
      additionalProperties: false
      required: [tenantIds]
      properties:
        fulfillment:
          $ref: '#/components/schemas/KmsSharingFulfillment'
        tenantIds:
          type: array
          uniqueItems: true
          maxItems: 5000
          description: >
            Tenants this platform-owned KMS is offered to. An empty array withdraws the offer;
            tenants that had already enabled it lose access on their next provider resolution.
          items:
            type: string
            minLength: 1
            maxLength: 160
        suggestedDefault:
          type: boolean
          description: >
            When true this provider is presented to offered tenants as the suggested default.
            At most one platform-owned KMS may carry this flag.
        expectedResourceVersion:
          type: integer
          format: int64
          minimum: 1
          description: Optimistic concurrency guard, echoed from the resource summary.

    KmsSharedProviderSummary:
      type: object
      additionalProperties: false
      required: [providerId, kind, displayName, enabled, suggestedDefault, fulfillment]
      properties:
        providerId:
          $ref: '#/components/schemas/KmsProviderId'
        fulfillment:
          $ref: '#/components/schemas/KmsSharingFulfillment'
        kind:
          $ref: '#/components/schemas/KmsResourceKind'
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        enabled:
          type: boolean
          description: True when the calling tenant has enabled this offered provider.
        suggestedDefault:
          type: boolean
          description: True when the platform marks this provider as the suggested default.
        declaredByDeployment:
          type: boolean
          default: false
          description: "Declared by deployment configuration. Coordinates, credential and lifecycle are managed by the deployment; the API refuses to change them."

    KmsSharedProviderCollection:
      type: object
      additionalProperties: false
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/KmsSharedProviderSummary'

    KmsDefaultProviderRequest:
      type: object
      additionalProperties: false
      required: [providerId]
      properties:
        providerId:
          $ref: '#/components/schemas/KmsProviderId'

    KmsDefaultProviderResponse:
      type: object
      additionalProperties: false
      description: >
        The default-provider setting. Both fields are absent for a tenant that has neither chosen a
        provider nor inherited a platform suggestion, which is the ordinary state of a tenant that
        has not configured a KMS yet. A write always answers both.
      properties:
        providerId:
          $ref: '#/components/schemas/KmsProviderId'
        source:
          type: string
          enum: [TENANT, PLATFORM_SUGGESTED]
          description: >
            TENANT when the tenant selected this provider explicitly, PLATFORM_SUGGESTED when it
            is inherited from the platform's suggested default.

    KmsResourceSummary:
      type: object
      additionalProperties: false
      required:
        - handle
        - providerId
        - kind
        - displayName
        - state
        - resourceVersion
        - credentialConfigured
        - health
        - credentialOwnership
        - availableActions
      properties:
        handle:
          $ref: '#/components/schemas/KmsResourceHandle'
        providerId:
          $ref: '#/components/schemas/KmsProviderId'
        kind:
          $ref: '#/components/schemas/KmsResourceKind'
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        state:
          $ref: '#/components/schemas/KmsResourceState'
        resourceVersion:
          type: integer
          format: int64
          minimum: 1
        credentialConfigured:
          type: boolean
        health:
          $ref: '#/components/schemas/KmsResourceHealth'
        credentialOwnership:
          $ref: '#/components/schemas/KmsCredentialOwnership'
        softwareStorageMode:
          type: string
          enum: [MEMORY, FILE, UPLOADED_FILE, MOUNTED_FILE]
          nullable: true
          description: Present only for SOFTWARE resources.
        softwareKeyStoreFileName:
          type: string
          nullable: true
          pattern: '^(?!\.)(?!.*\.\.)[A-Za-z0-9][A-Za-z0-9._-]{0,114}\.(p12|jks)$'
          description: Present only for FILE-backed SOFTWARE resources. The containing path is server-owned.
        credentialSecretRef:
          type: string
          nullable: true
          pattern: '^(kcr_[A-Za-z0-9_-]{20,180}_(software|aws|azure)|sec_[A-Za-z0-9_-]{16,128})$'
          description: >
            Read-safe credential reference. Platform-managed references are derived
            from the resource handle; tenant-managed references identify tenant-owned
            secret state. Credential material is never returned.
        providerAssignmentId:
          type: string
          nullable: true
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:@-]{0,159}$'
          description: >
            Present only for TENANT_SUPPLIED cloud resources and always paired with
            credentialSecretRef. Product-managed resources never expose an assignment id.
        availableActions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/KmsTypedResourceAction'
        declaredByDeployment:
          type: boolean
          default: false
          description: "Declared by deployment configuration. Coordinates, credential and lifecycle are managed by the deployment; the API refuses to change them."

    KmsResourceCollection:
      type: object
      additionalProperties: false
      required: [resources]
      properties:
        resources:
          type: array
          items:
            $ref: '#/components/schemas/KmsResourceSummary'

    KmsResourceDetail:
      type: object
      additionalProperties: false
      description: >-
        Browser-safe tenant-owned KMS resource detail. The configuration contains only approved
        public cloud coordinates. Product-managed secret references and platform-owned
        shared-instance configuration are never projected.
      required:
        - handle
        - providerId
        - kind
        - displayName
        - state
        - resourceVersion
        - credentialConfigured
        - health
        - credentialOwnership
        - availableActions
        - configuration
      properties:
        handle:
          $ref: '#/components/schemas/KmsResourceHandle'
        providerId:
          $ref: '#/components/schemas/KmsProviderId'
        kind:
          $ref: '#/components/schemas/KmsResourceKind'
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        state:
          $ref: '#/components/schemas/KmsResourceState'
        resourceVersion:
          type: integer
          format: int64
          minimum: 1
        credentialConfigured:
          type: boolean
        health:
          $ref: '#/components/schemas/KmsResourceHealth'
        credentialOwnership:
          $ref: '#/components/schemas/KmsCredentialOwnership'
        softwareStorageMode:
          type: string
          enum: [MEMORY, FILE, UPLOADED_FILE, MOUNTED_FILE]
          nullable: true
          description: Present only for SOFTWARE resources.
        softwareKeyStoreFileName:
          type: string
          nullable: true
          pattern: '^(?!\.)(?!.*\.\.)[A-Za-z0-9][A-Za-z0-9._-]{0,114}\.(p12|jks)$'
          description: Present only for FILE-backed SOFTWARE resources. The containing path is server-owned.
        credentialSecretRef:
          type: string
          nullable: true
          pattern: '^(kcr_[A-Za-z0-9_-]{20,180}_(software|aws|azure)|sec_[A-Za-z0-9_-]{16,128})$'
          description: >-
            Present only for TENANT_SUPPLIED resources. It identifies tenant-owned secret state;
            credential material is never returned.
        providerAssignmentId:
          type: string
          nullable: true
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:@-]{0,159}$'
          description: >-
            Present only for TENANT_SUPPLIED cloud resources and paired with credentialSecretRef.
        availableActions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/KmsTypedResourceAction'
        declaredByDeployment:
          type: boolean
          default: false
          description: "Declared by deployment configuration. Coordinates, credential and lifecycle are managed by the deployment; the API refuses to change them."
        configuration:
          $ref: '#/components/schemas/KmsResourceConfiguration'

    SoftwareKmsConfiguration:
      type: object
      additionalProperties: false
      required: [storageMode]
      properties:
        storageMode:
          $ref: '#/components/schemas/SoftwareKmsStorageMode'
        keyStoreFileName:
          type: string
          pattern: '^(?!\.)(?!.*\.\.)[A-Za-z0-9][A-Za-z0-9._-]{0,114}\.(p12|jks)$'
          description: Required for FILE storage and forbidden for MEMORY storage.
        mountedLocationId:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          description: Required for MOUNTED_FILE and resolved only through the deployment allow-list.
        mountedRelativePath:
          type: string
          pattern: '^(?!/)(?!.*(?:^|/)\.\.?/)(?!.*//)[A-Za-z0-9._/-]{1,239}\.(p12|jks)$'
          description: Required for MOUNTED_FILE; relative path below mountedLocationId.
        keyStoreType:
          type: string
          enum: [pkcs12, jks]
          description: Selects the Java keystore format for uploaded and mounted files.

    AwsKmsConfiguration:
      type: object
      additionalProperties: false
      required: [region]
      properties:
        region:
          type: string
          pattern: '^[a-z]{2}-[a-z]+-[0-9]+$'
          maxLength: 32
        endpointUrl:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
        applicationId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,160}$'
          description: Optional label forwarded to the cloud SDK as the calling application id. Defaults to the provider id.

    AzureKeyVaultConfiguration:
      type: object
      additionalProperties: false
      required: [vaultUri, tenantId, clientId, hsmType]
      properties:
        vaultUri:
          type: string
          format: uri
          pattern: '^https://[^?]+$'
          maxLength: 2048
        applicationId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,160}$'
          description: Optional label forwarded to the cloud SDK as the calling application id. Defaults to the provider id.
        tenantId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,160}$'
        clientId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,160}$'
        hsmType:
          type: string
          enum: [KEYVAULT, MANAGED_HSM]

    KmsResourceConfiguration:
      oneOf:
        - $ref: '#/components/schemas/SoftwareKmsConfiguration'
        - $ref: '#/components/schemas/AwsKmsConfiguration'
        - $ref: '#/components/schemas/AzureKeyVaultConfiguration'

    KmsCloudResourceConfiguration:
      oneOf:
        - $ref: '#/components/schemas/AwsKmsConfiguration'
        - $ref: '#/components/schemas/AzureKeyVaultConfiguration'

    CreateManagedKmsResourceRequest:
      type: object
      additionalProperties: false
      required: [providerId, kind, displayName, configuration]
      properties:
        providerId:
          $ref: '#/components/schemas/KmsProviderId'
        kind:
          $ref: '#/components/schemas/KmsResourceKind'
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        configuration:
          $ref: '#/components/schemas/KmsResourceConfiguration'

    AttachKmsResourceReferenceRequest:
      type: object
      additionalProperties: false
      required: [providerId, kind, displayName, configuration]
      properties:
        providerId:
          $ref: '#/components/schemas/KmsProviderId'
        kind:
          type: string
          enum: [AWS_KMS, AZURE_KEY_VAULT]
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        configuration:
          $ref: '#/components/schemas/KmsCloudResourceConfiguration'

    ChangeKmsResourceReferenceRequest:
      type: object
      additionalProperties: false
      required: [expectedResourceVersion, configuration]
      properties:
        expectedResourceVersion:
          type: integer
          format: int64
          minimum: 1
        configuration:
          $ref: '#/components/schemas/KmsCloudResourceConfiguration'

    KmsResourceActionRequest:
      type: object
      additionalProperties: false
      required: [expectedResourceVersion]
      properties:
        expectedResourceVersion:
          type: integer
          format: int64
          minimum: 1

    SoftwareKmsRotationCredential:
      type: object
      additionalProperties: false
      required: [passwordSecretRef, password]
      properties:
        passwordSecretRef:
          type: string
          pattern: '^kcr_[A-Za-z0-9_-]{20,180}_software$'
          description: Reference-first identity of the resource credential slot.
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096

    AwsKmsRotationCredential:
      type: object
      additionalProperties: false
      required: [secretAccessKeySecretRef, secretAccessKey]
      properties:
        secretAccessKeySecretRef:
          type: string
          pattern: '^kcr_[A-Za-z0-9_-]{20,180}_aws$'
          description: Reference-first identity of the resource credential slot.
        secretAccessKey:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096

    AzureKeyVaultRotationCredential:
      type: object
      additionalProperties: false
      required: [clientSecretRef, clientSecret]
      properties:
        clientSecretRef:
          type: string
          pattern: '^kcr_[A-Za-z0-9_-]{20,180}_azure$'
          description: Reference-first identity of the resource credential slot.
        clientSecret:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096

    KmsRotationCredential:
      oneOf:
        - $ref: '#/components/schemas/SoftwareKmsRotationCredential'
        - $ref: '#/components/schemas/AwsKmsRotationCredential'
        - $ref: '#/components/schemas/AzureKeyVaultRotationCredential'

    RotateKmsResourceRequest:
      type: object
      additionalProperties: false
      required: [expectedResourceVersion, credential]
      properties:
        expectedResourceVersion:
          type: integer
          format: int64
          minimum: 1
        credential:
          $ref: '#/components/schemas/KmsRotationCredential'

    KmsResourceValidationResult:
      type: object
      additionalProperties: false
      required: [handle, state, health]
      properties:
        handle:
          $ref: '#/components/schemas/KmsResourceHandle'
        state:
          $ref: '#/components/schemas/KmsResourceState'
        health:
          $ref: '#/components/schemas/KmsResourceHealth'
        diagnosticCode:
          type: string
          maxLength: 160

    KmsResourceRotationResult:
      type: object
      additionalProperties: false
      required: [handle, resourceVersion, state]
      properties:
        handle:
          $ref: '#/components/schemas/KmsResourceHandle'
        resourceVersion:
          type: integer
          format: int64
          minimum: 1
        state:
          $ref: '#/components/schemas/KmsResourceState'

    KmsCredentialStatus:
      type: object
      additionalProperties: false
      required: [resourceVersion, configured, health, secretRef]
      properties:
        resourceVersion:
          type: integer
          format: int64
          minimum: 1
        configured:
          type: boolean
        health:
          $ref: '#/components/schemas/KmsResourceHealth'
        secretRef:
          type: string
          pattern: '^kcr_[A-Za-z0-9_-]{20,180}_software$'
          description: Read-safe credential reference; never credential material.

    SoftwareKmsCredentialWriteRequest:
      type: object
      additionalProperties: false
      required: [expectedResourceVersion, passwordSecretRef]
      properties:
        expectedResourceVersion:
          type: integer
          format: int64
          minimum: 1
        passwordSecretRef:
          type: string
          pattern: '^kcr_[A-Za-z0-9_-]{20,180}_software$'
          description: Reference-first identity of the SOFTWARE credential slot.
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
          description: Optional write-through plaintext. Omit to retain the current platform-managed credential.

    AwsKmsProductManagedCredentialWrite:
      type: object
      additionalProperties: false
      required: [expectedResourceVersion, secretAccessKeySecretRef]
      properties:
        expectedResourceVersion:
          type: integer
          format: int64
          minimum: 1
        secretAccessKeySecretRef:
          type: string
          pattern: '^kcr_[A-Za-z0-9_-]{20,180}_aws$'
          description: Derived reference-first identity of the platform-managed AWS credential slot.
        secretAccessKey:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
          description: Optional write-through plaintext. Omit to retain the current credential.

    AwsKmsTenantSuppliedCredentialWrite:
      type: object
      additionalProperties: false
      required: [expectedResourceVersion, secretAccessKeySecretRef, providerAssignmentId]
      properties:
        expectedResourceVersion:
          type: integer
          format: int64
          minimum: 1
        secretAccessKeySecretRef:
          type: string
          pattern: '^sec_[A-Za-z0-9_-]{16,128}$'
          description: Tenant-owned secret reference; credential material is not accepted.
        providerAssignmentId:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:@-]{0,159}$'
          description: Required only for TENANT_SUPPLIED cloud resources.

    AwsKmsCredentialWriteRequest:
      oneOf:
        - $ref: '#/components/schemas/AwsKmsProductManagedCredentialWrite'
        - $ref: '#/components/schemas/AwsKmsTenantSuppliedCredentialWrite'

    AzureKeyVaultProductManagedCredentialWrite:
      type: object
      additionalProperties: false
      required: [expectedResourceVersion, clientSecretRef]
      properties:
        expectedResourceVersion:
          type: integer
          format: int64
          minimum: 1
        clientSecretRef:
          type: string
          pattern: '^kcr_[A-Za-z0-9_-]{20,180}_azure$'
          description: Derived reference-first identity of the platform-managed Azure credential slot.
        clientSecret:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
          description: Optional write-through plaintext. Omit to retain the current credential.

    AzureKeyVaultTenantSuppliedCredentialWrite:
      type: object
      additionalProperties: false
      required: [expectedResourceVersion, clientSecretRef, providerAssignmentId]
      properties:
        expectedResourceVersion:
          type: integer
          format: int64
          minimum: 1
        clientSecretRef:
          type: string
          pattern: '^sec_[A-Za-z0-9_-]{16,128}$'
          description: Tenant-owned secret reference; credential material is not accepted.
        providerAssignmentId:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:@-]{0,159}$'
          description: Required only for TENANT_SUPPLIED cloud resources.

    AzureKeyVaultCredentialWriteRequest:
      oneOf:
        - $ref: '#/components/schemas/AzureKeyVaultProductManagedCredentialWrite'
        - $ref: '#/components/schemas/AzureKeyVaultTenantSuppliedCredentialWrite'

    KmsCredentialWriteResult:
      type: object
      additionalProperties: false
      required: [handle, resourceVersion, credentialConfigured, secretRef]
      properties:
        handle:
          $ref: '#/components/schemas/KmsResourceHandle'
        resourceVersion:
          type: integer
          format: int64
          minimum: 1
        credentialConfigured:
          type: boolean
        secretRef:
          $ref: '#/components/schemas/KmsCredentialSecretRef'

    # =====================================================================
    # Secret providers
    # =====================================================================
    AsTokensConfig:
      type: object
      description: Plain write shape for token lifetimes and token behavior. PUT omits or nulls clear tenant-set values back to defaults.
      properties:
        accessTokenLifetimeSeconds:
          type: integer
          format: int64
          minimum: 1
          description: Access token lifetime in seconds.
        refreshTokenLifetimeSeconds:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: Refresh token lifetime in seconds.
        authorizationCodeLifetimeSeconds:
          type: integer
          format: int64
          minimum: 1
          description: Authorization code lifetime in seconds.
        idTokenLifetimeSeconds:
          type: integer
          format: int64
          minimum: 1
          description: ID token lifetime in seconds.
        tokenFormat:
          type: string
          enum: [JWT, OPAQUE]
          description: >-
            Access token representation emitted by the AS runtime. Canonical AS
            `TokenFormat` enum (parsed server-side via `valueOf`, case-sensitive).
          example: JWT
        refreshTokenRotation:
          type: boolean
          description: Rotates refresh tokens on use when true.
      example:
        accessTokenLifetimeSeconds: 3600
        refreshTokenLifetimeSeconds: 2592000
        authorizationCodeLifetimeSeconds: 300
        idTokenLifetimeSeconds: 3600
        tokenFormat: JWT
        refreshTokenRotation: true
    AsTokensConfigView:
      type: object
      required: [accessTokenLifetimeSeconds, refreshTokenLifetimeSeconds, authorizationCodeLifetimeSeconds, idTokenLifetimeSeconds, tokenFormat, refreshTokenRotation]
      properties:
        accessTokenLifetimeSeconds:
          $ref: '#/components/schemas/IntegerConfigField'
        refreshTokenLifetimeSeconds:
          $ref: '#/components/schemas/IntegerConfigField'
        authorizationCodeLifetimeSeconds:
          $ref: '#/components/schemas/IntegerConfigField'
        idTokenLifetimeSeconds:
          $ref: '#/components/schemas/IntegerConfigField'
        tokenFormat:
          $ref: '#/components/schemas/StringConfigField'
        refreshTokenRotation:
          $ref: '#/components/schemas/BooleanConfigField'
      example:
        accessTokenLifetimeSeconds: { value: 1800, source: tenant }
        refreshTokenLifetimeSeconds: { value: 2592000, source: default }
        authorizationCodeLifetimeSeconds: { value: 300, source: default }
        idTokenLifetimeSeconds: { value: 3600, source: default }
        tokenFormat: { value: JWT, source: tenant }
        refreshTokenRotation: { value: true, source: default }
    AsDeviceFlowConfig:
      type: object
      description: Plain write shape for RFC 8628 device authorization grant settings. PUT omits or nulls clear tenant-set values back to defaults.
      properties:
        deviceCodeLifetimeSeconds:
          type: integer
          format: int64
          minimum: 1
          description: Device code lifetime in seconds.
        userCodeLength:
          type: integer
          format: int64
          minimum: 1
          description: Number of characters in the generated user code.
        pollingIntervalSeconds:
          type: integer
          format: int64
          minimum: 1
          description: Minimum interval in seconds between device token polling requests.
        verificationUri:
          type: string
          description: End-user verification URI presented during the device flow.
      example:
        deviceCodeLifetimeSeconds: 600
        userCodeLength: 8
        pollingIntervalSeconds: 5
        verificationUri: https://example.com/device
    AsDeviceFlowConfigView:
      type: object
      required: [deviceCodeLifetimeSeconds, userCodeLength, pollingIntervalSeconds]
      properties:
        deviceCodeLifetimeSeconds:
          $ref: '#/components/schemas/IntegerConfigField'
        userCodeLength:
          $ref: '#/components/schemas/IntegerConfigField'
        pollingIntervalSeconds:
          $ref: '#/components/schemas/IntegerConfigField'
        verificationUri:
          $ref: '#/components/schemas/StringConfigField'
      example:
        deviceCodeLifetimeSeconds: { value: 600, source: default }
        userCodeLength: { value: 8, source: default }
        pollingIntervalSeconds: { value: 5, source: default }
        verificationUri: { value: 'https://example.com/device', source: tenant }
    AsTokenExchangeConfig:
      type: object
      description: Plain write shape for RFC 8693 token exchange settings. PUT omits or nulls clear tenant-set values back to defaults.
      properties:
        allowImpersonation:
          type: boolean
          description: Allows impersonation-style token exchange when true.
        allowDelegation:
          type: boolean
          description: Allows delegation-style token exchange with an actor token when true.
        requireActorToken:
          type: boolean
          description: Requires an actor token on every token exchange request when true.
      example:
        allowImpersonation: true
        allowDelegation: true
        requireActorToken: false
    AsTokenExchangeConfigView:
      type: object
      required: [allowImpersonation, allowDelegation, requireActorToken]
      properties:
        allowImpersonation:
          $ref: '#/components/schemas/BooleanConfigField'
        allowDelegation:
          $ref: '#/components/schemas/BooleanConfigField'
        requireActorToken:
          $ref: '#/components/schemas/BooleanConfigField'
      example:
        allowImpersonation: { value: true, source: default }
        allowDelegation: { value: true, source: default }
        requireActorToken: { value: false, source: default }
    AsInteractiveAuthorizationConfig:
      type: object
      description: Plain write shape for OID4VCI interactive authorization endpoint (IAE) settings. PUT omits or nulls clear tenant-set values back to defaults.
      properties:
        interactiveAuthorizationEndpoint:
          type: string
          description: Interactive authorization endpoint advertised by the authorization server.
        requirePushedAuthorizationRequests:
          type: boolean
          description: Requires pushed authorization requests (PAR) for interactive authorization when true.
      example:
        interactiveAuthorizationEndpoint: https://example.com/oauth2/iae
        requirePushedAuthorizationRequests: false
    AsInteractiveAuthorizationConfigView:
      type: object
      required: [requirePushedAuthorizationRequests]
      properties:
        interactiveAuthorizationEndpoint:
          $ref: '#/components/schemas/StringConfigField'
        requirePushedAuthorizationRequests:
          $ref: '#/components/schemas/BooleanConfigField'
      example:
        interactiveAuthorizationEndpoint: { value: 'https://example.com/oauth2/iae', source: tenant }
        requirePushedAuthorizationRequests: { value: false, source: default }
    AsWebAuthnConfig:
      type: object
      additionalProperties: false
      description: Local WebAuthn login relying-party policy. Enabling the policy requires rpId and at least one allowed origin.
      properties:
        enabled:
          type: boolean
          default: false
        rpId:
          type: string
          description: WebAuthn relying-party host name without scheme or path.
          example: platform.example.com
        allowedOrigins:
          type: array
          items:
            type: string
            format: uri
          example: [https://platform.example.com]
        attestationPolicy:
          type: string
          enum: [none, indirect, direct, enterprise]
          default: none
        userVerification:
          type: string
          enum: [required, preferred, discouraged]
          default: required
        allowedTransports:
          type: array
          items:
            type: string
            enum: [usb, nfc, ble, internal, hybrid]
        backupStatePolicy:
          type: string
          enum: [allow-any, require-backup-eligible, require-backed-up, forbid-backed-up]
          default: allow-any
        challengeTtlSeconds:
          type: integer
          format: int64
          minimum: 1
          default: 300
        level3PrfEnabled:
          type: boolean
          default: false
    AsWebAuthnConfigView:
      type: object
      additionalProperties: false
      required: [enabled, allowedOrigins, attestationPolicy, userVerification, allowedTransports, backupStatePolicy, challengeTtlSeconds, level3PrfEnabled]
      properties:
        enabled:
          $ref: '#/components/schemas/BooleanConfigField'
        rpId:
          $ref: '#/components/schemas/StringConfigField'
        allowedOrigins:
          $ref: '#/components/schemas/StringListConfigField'
        attestationPolicy:
          $ref: '#/components/schemas/StringConfigField'
        userVerification:
          $ref: '#/components/schemas/StringConfigField'
        allowedTransports:
          $ref: '#/components/schemas/StringListConfigField'
        backupStatePolicy:
          $ref: '#/components/schemas/StringConfigField'
        challengeTtlSeconds:
          $ref: '#/components/schemas/IntegerConfigField'
        level3PrfEnabled:
          $ref: '#/components/schemas/BooleanConfigField'

    AsSignedMetadataSigningAlg:
      type: string
      description: JWS algorithm supported for signed authorization-server metadata.
      enum: [ES256, ES384, ES512, ES256K, RS256, RS384, RS512, PS256, PS384, PS512, EdDSA]
      example: ES256
    AsGrantType:
      type: string
      description: OAuth2 grant type supported by the authorization server token endpoint.
      enum:
        - authorization_code
        - implicit
        - refresh_token
        - client_credentials
        - password
        - urn:ietf:params:oauth:grant-type:pre-authorized_code
        - urn:ietf:params:oauth:grant-type:token-exchange
        - urn:ietf:params:oauth:grant-type:device_code
      example: authorization_code
    AsResponseType:
      type: string
      description: OAuth2/OIDC response type advertised by the authorization server.
      enum:
        - code
        - id_token
        - token
        - code id_token
        - code token
        - id_token token
        - code id_token token
      example: code
    OidcSubjectType:
      type: string
      description: OIDC subject identifier type advertised by the authorization server.
      enum: [public]
      example: public
    PkceCodeChallengeMethod:
      type: string
      description: PKCE code challenge method advertised by the authorization server.
      enum: [S256]
      example: S256
    AsSignedMetadataConfig:
      type: object
      description: Plain write shape for signed authorization-server metadata settings. PUT omits or nulls clear tenant-set values back to defaults.
      properties:
        kmsResourceHandle:
          type: string
          description: Opaque product-managed KMS resource handle used to sign the AS metadata document.
        kmsKeyAlias:
          type: string
          description: Tenant-visible alias of the signing key inside the selected KMS resource.
        signingAlg:
          allOf:
            - $ref: '#/components/schemas/AsSignedMetadataSigningAlg'
          description: >-
            JWS algorithm used to sign the AS metadata document. One of the
            AS-supported asymmetric signature algorithms from the JwaAlgorithm
            enum (HMAC algorithms are excluded for metadata signing).
          example: ES256
      example:
        kmsResourceHandle: krh_01234567890123456789
        kmsKeyAlias: oauth2-as-default
        signingAlg: ES256
    AsSignedMetadataConfigView:
      type: object
      required: [signingAlg]
      properties:
        kmsResourceHandle:
          $ref: '#/components/schemas/StringConfigField'
        kmsKeyAlias:
          $ref: '#/components/schemas/StringConfigField'
        signingAlg:
          $ref: '#/components/schemas/StringConfigField'
      example:
        kmsResourceHandle: { value: krh_01234567890123456789, source: tenant }
        kmsKeyAlias: { value: oauth2-as-default, source: tenant }
        signingAlg: { value: ES256, source: default }
    AsGrantsConfig:
      type: object
      description: Enabled grant types, response types, and scopes. `code` responses require `authorization_code`; token response types require `implicit`.
      properties:
        grantTypesEnabled:
          type: array
          description: OAuth2 grant types enabled for the authorization server.
          items:
            $ref: '#/components/schemas/AsGrantType'
        responseTypesSupported:
          type: array
          description: OAuth2/OIDC response types advertised by the authorization server.
          items:
            $ref: '#/components/schemas/AsResponseType'
        scopesSupported:
          type: array
          description: OAuth2 scopes advertised by the authorization server.
          items:
            type: string
        subjectTypesSupported:
          type: array
          description: OIDC subject identifier types advertised by the authorization server.
          items:
            $ref: '#/components/schemas/OidcSubjectType'
        pkceMethodsSupported:
          type: array
          description: PKCE methods advertised by the authorization server.
          items:
            $ref: '#/components/schemas/PkceCodeChallengeMethod'
        tokenEndpointAuthMethodsSupported:
          type: array
          description: OAuth2 token endpoint client authentication methods advertised by the authorization server.
          items:
            $ref: '#/components/schemas/AsClientAuthMethod'
        publicClientsAllowAny:
          type: boolean
          description: Allows unregistered public clients when the AS public-client fallback is enabled.
        publicClientsPermissiveRedirectUri:
          type: boolean
          description: Allows permissive redirect URI matching for public-client fallback.
      example:
        grantTypesEnabled: [authorization_code, refresh_token, password]
        responseTypesSupported: [code]
        scopesSupported: [openid, profile, email]
        subjectTypesSupported: [public]
        pkceMethodsSupported: [S256]
        tokenEndpointAuthMethodsSupported: [client_secret_basic, client_secret_post]
        publicClientsAllowAny: true
        publicClientsPermissiveRedirectUri: true
    AsGrantsConfigView:
      type: object
      required: [grantTypesEnabled, responseTypesSupported, scopesSupported, subjectTypesSupported, pkceMethodsSupported, tokenEndpointAuthMethodsSupported, publicClientsAllowAny, publicClientsPermissiveRedirectUri]
      properties:
        grantTypesEnabled:
          $ref: '#/components/schemas/StringListConfigField'
        responseTypesSupported:
          $ref: '#/components/schemas/StringListConfigField'
        scopesSupported:
          $ref: '#/components/schemas/StringListConfigField'
        subjectTypesSupported:
          $ref: '#/components/schemas/StringListConfigField'
        pkceMethodsSupported:
          $ref: '#/components/schemas/StringListConfigField'
        tokenEndpointAuthMethodsSupported:
          $ref: '#/components/schemas/StringListConfigField'
        publicClientsAllowAny:
          $ref: '#/components/schemas/BooleanConfigField'
        publicClientsPermissiveRedirectUri:
          $ref: '#/components/schemas/BooleanConfigField'
    AsFeaturesConfig:
      type: object
      description: Typed OAuth2/OIDC feature policy for the authorization server.
      additionalProperties: false
      properties:
        oidc:
          $ref: '#/components/schemas/FeatureMode'
        logout:
          $ref: '#/components/schemas/FeatureMode'
        introspection:
          $ref: '#/components/schemas/FeatureMode'
        revocation:
          $ref: '#/components/schemas/FeatureMode'
        par:
          $ref: '#/components/schemas/FeatureMode'
        tokenExchange:
          $ref: '#/components/schemas/FeatureMode'
        deviceFlow:
          $ref: '#/components/schemas/FeatureMode'
        pkce:
          $ref: '#/components/schemas/FeatureMode'
        dpop:
          $ref: '#/components/schemas/FeatureMode'
        iae:
          $ref: '#/components/schemas/FeatureMode'
        jar:
          $ref: '#/components/schemas/FeatureMode'
        attestation:
          $ref: '#/components/schemas/FeatureMode'
        jarm:
          $ref: '#/components/schemas/FeatureMode'
        mtls:
          $ref: '#/components/schemas/FeatureMode'
        signedMetadata:
          $ref: '#/components/schemas/FeatureMode'
      example:
        oidc: supported
        logout: supported
        introspection: supported
        revocation: supported
        par: disabled
        tokenExchange: disabled
        deviceFlow: disabled
        pkce: required
        dpop: supported
        iae: disabled
        jar: supported
        attestation: disabled
        jarm: disabled
        mtls: disabled
        signedMetadata: supported
    AsFeaturesConfigView:
      type: object
      description: Effective typed OAuth2/OIDC feature policy with source markers.
      required: [oidc, logout, introspection, revocation, par, tokenExchange, deviceFlow, pkce, dpop, iae, jar, attestation, jarm, mtls, signedMetadata]
      additionalProperties: false
      properties:
        oidc:
          $ref: '#/components/schemas/FeatureConfigField'
        logout:
          $ref: '#/components/schemas/FeatureConfigField'
        introspection:
          $ref: '#/components/schemas/FeatureConfigField'
        revocation:
          $ref: '#/components/schemas/FeatureConfigField'
        par:
          $ref: '#/components/schemas/FeatureConfigField'
        tokenExchange:
          $ref: '#/components/schemas/FeatureConfigField'
        deviceFlow:
          $ref: '#/components/schemas/FeatureConfigField'
        pkce:
          $ref: '#/components/schemas/FeatureConfigField'
        dpop:
          $ref: '#/components/schemas/FeatureConfigField'
        iae:
          $ref: '#/components/schemas/FeatureConfigField'
        jar:
          $ref: '#/components/schemas/FeatureConfigField'
        attestation:
          $ref: '#/components/schemas/FeatureConfigField'
        jarm:
          $ref: '#/components/schemas/FeatureConfigField'
        mtls:
          $ref: '#/components/schemas/FeatureConfigField'
        signedMetadata:
          $ref: '#/components/schemas/FeatureConfigField'
      example:
        oidc: { value: supported, source: default }
        logout: { value: supported, source: default }
        introspection: { value: supported, source: default }
        revocation: { value: supported, source: default }
        par: { value: disabled, source: tenant }
        tokenExchange: { value: disabled, source: tenant }
        deviceFlow: { value: disabled, source: tenant }
        pkce: { value: required, source: tenant }
        dpop: { value: supported, source: tenant }
        iae: { value: disabled, source: tenant }
        jar: { value: supported, source: default }
        attestation: { value: disabled, source: tenant }
        jarm: { value: disabled, source: tenant }
        mtls: { value: disabled, source: tenant }
        signedMetadata: { value: supported, source: default }
    AsClientType:
      type: string
      description: OAuth2 client class. Confidential credentials are accepted only through typed reference or write-once secret fields.
      enum: [public, confidential]
      example: public
    AsClientAuthMethod:
      type: string
      description: Token endpoint authentication method.
      enum:
        - none
        - client_secret_basic
        - client_secret_post
        - private_key_jwt
        - attest_jwt_client_auth
      example: none
    AsClientBase:
      type: object
      additionalProperties: false
      description: >
        OAuth2 client registration consumed by the AS runtime from
        the hosted authorization server addressed by stable resource UUID. Public and confidential
        registrations share this resource; confidential credential material is write-only and every
        response contains only opaque typed secret/KMS references.
      properties: &AsClientProperties
        clientId:
          type: string
          description: Stable OAuth2 client identifier.
          example: wallet-web
        clientName:
          type: string
          nullable: true
          description: Human-readable client name.
          example: Acme web wallet
        clientType:
          $ref: '#/components/schemas/AsClientType'
        enabled:
          type: boolean
          default: true
          description: Enables the client registration for runtime use.
        grantTypes:
          type: array
          items:
            $ref: '#/components/schemas/AsGrantType'
          description: OAuth2 grant types enabled for this client.
          example: [authorization_code, refresh_token]
        responseTypes:
          type: array
          items:
            type: string
          description: OAuth2/OIDC response types allowed for this client.
          example: [code]
        redirectUris:
          type: array
          items:
            type: string
            format: uri
          description: Redirect URIs accepted for authorization responses.
          example: [https://wallet.acme.example/callback]
        allowedScopes:
          type: array
          items:
            type: string
            example: openid
          nullable: true
          description: Scopes this client may request. Null inherits the AS policy.
          example: [openid, profile, email]
        defaultAccessTokenAudience:
          type: string
          nullable: true
          description: Exact access-token audience used when this client omits an RFC 8707 resource indicator. It is never inferred from clientId.
          example: enterprise-issuer
        allowedAccessTokenAudiences:
          type: array
          items:
            type: string
          description: Explicit access-token audiences this client may request in addition to its default. A client-credentials request may name several of them at once; every requested audience must be registered here or as the default.
          example: [enterprise-tenant-kms, enterprise-wallet-interaction]
        principalRoles:
          type: array
          items:
            type: string
            example: tenant-admin
          nullable: true
          description: >
            Roles stamped as the `roles` claim on access tokens this client obtains through the
            client_credentials grant, so a confidential workload client can act with the same
            entitlements as a signed-in principal. Accepted values are the roles the hosted
            authorization server governs: `platform-admin` on the platform tenant's authorization
            server, `tenant-admin` on a tenant authorization server. Null or empty issues
            service-scoped tokens without a `roles` claim. Ignored for grants that carry a
            user subject.
          example: [tenant-admin]
        tokenEndpointAuthMethod:
          $ref: '#/components/schemas/AsClientAuthMethod'
        clientCredential:
          $ref: '#/components/schemas/FederationClientAuthentication'
        tokenEndpointAuthSigningAlg:
          type: array
          nullable: true
          items:
            type: string
          description: Explicit signing-algorithm allow-list for JWT-based client authentication.
          example: [ES256]
        jwks:
          $ref: '#/components/schemas/AsClientPublicJwkSet'
        jwksUri:
          type: string
          format: uri
          nullable: true
          description: Client JWKS URI used for private-key JWT or signed request-object validation.
          example: https://issuer.acme.example/oauth2/jwks.json
        requirePkce:
          type: boolean
          nullable: true
          description: Requires PKCE for authorization code flows.
        requirePushedAuthorizationRequests:
          type: boolean
          nullable: true
          description: Requires pushed authorization requests for this client.
        dpopBoundAccessTokens:
          type: boolean
          nullable: true
          description: Issues DPoP-bound access tokens for this client.
        accessTokenLifetime:
          type: integer
          minimum: 1
          nullable: true
          description: Client-specific access token lifetime in seconds.
        refreshTokenLifetime:
          type: integer
          minimum: 1
          nullable: true
          description: Client-specific refresh token lifetime in seconds.
        authorizationCodeLifetime:
          type: integer
          minimum: 1
          nullable: true
          description: Client-specific authorization code lifetime in seconds.
        trustedAttesterIssuers:
          type: array
          items:
            type: string
            example: https://wallet-provider.example
          nullable: true
          description: Trusted attestation issuers for wallet or client attestation.
          example: [https://wallet-provider.example]
        trustedAttesterJwks:
          $ref: '#/components/schemas/AsClientPublicJwkSet'
        trustedAttesterJwksUris:
          type: array
          items:
            type: string
            format: uri
          nullable: true
          description: JWKS URIs used to validate trusted attestation issuers.
          example: [https://wallet-provider.example/jwks.json]
        postLogoutRedirectUris:
          type: array
          items:
            type: string
            format: uri
          description: Redirect URIs accepted after RP-initiated logout.
          example: [https://wallet.acme.example/logout/callback]
        frontchannelLogoutUri:
          type: string
          format: uri
          nullable: true
          description: Front-channel logout URI registered for this client.
          example: https://wallet.acme.example/logout/frontchannel
        frontchannelLogoutSessionRequired:
          type: boolean
          nullable: true
          description: Indicates whether front-channel logout requires a session identifier.
        backchannelLogoutUri:
          type: string
          format: uri
          nullable: true
          description: Back-channel logout URI registered for this client.
          example: https://wallet.acme.example/logout/backchannel
        backchannelLogoutSessionRequired:
          type: boolean
          nullable: true
          description: Indicates whether back-channel logout requires a session identifier.
        authorizationSignedResponseAlg:
          type: string
          nullable: true
          description: JARM signing algorithm for authorization responses.
          example: ES256
        authorizationEncryptedResponseAlg:
          type: string
          nullable: true
          description: JARM key-management algorithm for encrypted authorization responses.
          example: ECDH-ES
        authorizationEncryptedResponseEnc:
          type: string
          nullable: true
          description: JARM content-encryption algorithm for encrypted authorization responses.
          example: A256GCM
        requestObjectSigningAlg:
          type: string
          nullable: true
          description: Required signing algorithm for request objects submitted by this client.
          example: ES256
        requestUris:
          type: array
          items:
            type: string
            format: uri
          description: Pre-registered request object URIs accepted for this client.
          example: [https://wallet.acme.example/oauth/request.jwt]
        tlsClientAuthSubjectDn:
          type: string
          nullable: true
          description: Subject distinguished name accepted for TLS client authentication.
          example: CN=issuer-backend,O=Acme Corp,C=NL
        tlsClientAuthSanDns:
          type: string
          nullable: true
          description: DNS SAN accepted for TLS client authentication.
          example: issuer-backend.acme.example
        tlsClientAuthSanEmail:
          type: string
          nullable: true
          description: Email SAN accepted for TLS client authentication.
          example: oauth-client@acme.example
        tlsClientAuthSanIp:
          type: string
          nullable: true
          description: IP address SAN accepted for TLS client authentication.
          example: 203.0.113.10
        tlsClientAuthSanUri:
          type: string
          nullable: true
          description: URI SAN accepted for TLS client authentication.
          example: spiffe://acme.example/oauth/issuer-backend
        tlsClientCertificateBoundAccessTokens:
          type: boolean
          nullable: true
          description: Binds issued access tokens to the client's TLS certificate.
    AsClientPublicJwk:
      type: object
      additionalProperties: false
      description: Public-only JSON Web Key. Private and symmetric key members are not accepted.
      required: [kty]
      properties:
        kty:
          type: string
          enum: [EC, RSA, OKP]
        kid:
          type: string
        alg:
          type: string
        use:
          type: string
          enum: [sig, enc]
        key_ops:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [verify, encrypt, wrapKey, deriveKey, deriveBits]
        crv:
          type: string
          enum: [P-256, P-384, P-521, secp256k1, Ed25519, Ed448, X25519, X448]
        x:
          type: string
        y:
          type: string
        n:
          type: string
        e:
          type: string
        x5c:
          type: array
          items:
            type: string
        x5t:
          type: string
        x5u:
          type: string
          format: uri
        'x5t#S256':
          type: string
    AsClientPublicJwkSet:
      type: object
      nullable: true
      description: Public-only JWK Set. Requests containing private JWK members are rejected.
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AsClientPublicJwk'
    AsClient:
      type: object
      additionalProperties: false
      required: [clientId, clientType, enabled, grantTypes, tokenEndpointAuthMethod]
      properties: *AsClientProperties
      example:
        clientId: wallet-web
        clientName: Acme web wallet
        clientType: public
        enabled: true
        grantTypes: [authorization_code, refresh_token]
        responseTypes: [code]
        redirectUris: [https://wallet.acme.example/callback]
        allowedScopes: [openid, profile, email]
        tokenEndpointAuthMethod: none
        requirePkce: true
    AsClientCreateRequest:
      type: object
      additionalProperties: false
      required: [clientId, clientType, grantTypes]
      properties: *AsClientProperties
      description: Public or confidential hosted-AS client registration. A raw secret is write-once; reads return only its opaque typed reference.
      example:
        clientId: issuer-backend
        clientName: Issuer backend
        clientType: confidential
        grantTypes: [authorization_code]
        tokenEndpointAuthMethod: private_key_jwt
        clientCredential:
          method: private_key_jwt
          clientId: issuer-backend
          kmsReference:
            kmsResourceHandle: krh_01234567890123456789
            kmsKeyAlias: issuer-client-auth
            purpose: OAUTH_CLIENT_ASSERTION_SIGNING
        allowedScopes: [openid]
    AsClientReplaceRequest:
      $ref: '#/components/schemas/AsClientCreateRequest'
    AsClientPatchRequest:
      $ref: '#/components/schemas/AsClientBase'
    AsClientList:
      type: object
      required: [clients]
      properties:
        clients:
          type: array
          items:
            $ref: '#/components/schemas/AsClient'
      example:
        clients:
          - clientId: wallet-web
            clientName: Acme web wallet
            clientType: public
            enabled: true
            grantTypes: [authorization_code, refresh_token]
            responseTypes: [code]
            redirectUris: [https://wallet.acme.example/callback]
            tokenEndpointAuthMethod: none
            requirePkce: true
    DeleteAsClientResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
          description: True when the client registration existed and was deleted.

    AsIdentityCreateRequest:
      type: object
      description: >
        Creates or reuses a real identity by protected email and adds a suspended
        AUTHENTICABLE binding to this AS instance. Passwords and activation-code
        choices are deliberately not accepted by this administrative operation.
      required: [displayName, email]
      properties:
        displayName:
          type: string
          minLength: 1
          description: Human-readable name for a newly created natural person.
          example: Sofia Almeida
        email:
          type: string
          format: email
          description: Primary email used for protected lookup and activation delivery.
          example: sofia.almeida@acme.example
        givenName:
          type: string
          nullable: true
        familyName:
          type: string
          nullable: true
        roles:
          type: array
          minItems: 1
          maxItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [tenant-admin, platform-admin]
          description: >
            Exact administrator role to issue from this authorization server.
            Tenant authorization servers accept tenant-admin; the platform
            management authorization server accepts platform-admin.
      example:
        displayName: Sofia Almeida
        email: sofia.almeida@acme.example
        givenName: Sofia
        familyName: Almeida
        roles: [tenant-admin]
    AsIdentity:
      type: object
      description: Real identity and application-binding lifecycle projection for an AS instance, returned only to authorized administrators.
      required: [identityId, applicationId, state, roles, currentUser, createdAt]
      properties:
        identityId:
          type: string
          format: uuid
          description: Stable identifier of the identity.
          example: 1d9f5c3a-2b7e-4f81-9c0d-6a8bd7f6d211
        applicationId:
          type: string
          format: uuid
          description: Service-party application to which this identity is bound.
        displayName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
          description: Revealed primary email for the authorized AS administration surface.
          example: sofia.almeida@acme.example
        state:
          type: string
          enum: [PENDING_ACTIVATION, ACTIVE, SUSPENDED, DELIVERY_FAILED, INVITATION_REQUIRED]
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [tenant-admin, platform-admin]
          description: Exact roles emitted for this identity by the addressed authorization server.
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
          description: Time of the most recent successful login, or null when the account has never logged in.
        currentUser:
          type: boolean
          description: True when this identity is the authenticated administrator making the request.
        invitationId:
          type: string
          nullable: true
        invitationExpiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      example:
        identityId: 1d9f5c3a-2b7e-4f81-9c0d-6a8bd7f6d211
        applicationId: 8d6c6f45-f3df-4ed7-b1d7-40c60696e627
        displayName: Sofia Almeida
        email: sofia.almeida@acme.example
        state: PENDING_ACTIVATION
        roles: [tenant-admin]
        lastLoginAt: null
        currentUser: false
        invitationId: 9af5f8e3-827e-454d-8fb3-62138d20ff83
        invitationExpiresAt: '2026-01-22T09:30:00Z'
        createdAt: '2026-01-15T09:30:00Z'
    AsIdentityCreateResult:
      $ref: '#/components/schemas/AsIdentityActionResult'
    AsIdentityUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        enabled:
          type: boolean
          description: Enables or suspends this identity's binding to the addressed authorization server.
        roles:
          type: array
          minItems: 1
          maxItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [tenant-admin, platform-admin]
          description: >
            Replaces the identity's roles, then revokes its active sessions and
            tokens. The role must match the addressed authorization-server
            persona.
    AsIdentityActionResult:
      type: object
      required: [identity]
      properties:
        identity:
          $ref: '#/components/schemas/AsIdentity'
        manualActivationLink:
          type: string
          format: uri
          nullable: true
          description: Returned exactly once to an authenticated operator for an explicit manual activation handoff.
    AsIdentityList:
      type: object
      required: [identities]
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/AsIdentity'
      example:
        identities:
          - identityId: 1d9f5c3a-2b7e-4f81-9c0d-6a8bd7f6d211
            applicationId: 8d6c6f45-f3df-4ed7-b1d7-40c60696e627
            displayName: Sofia Almeida
            email: sofia.almeida@acme.example
            state: PENDING_ACTIVATION
            lastLoginAt: null
            currentUser: false
            invitationId: 9af5f8e3-827e-454d-8fb3-62138d20ff83
            invitationExpiresAt: '2026-01-22T09:30:00Z'
            createdAt: '2026-01-15T09:30:00Z'
    DeleteAsIdentityResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
          description: True when the identity existed and was deleted.
    Oid4vciIssuerTrustDomainApiSettings:
      type: object
      description: >
        Write shape for the issuer's connection to the tenant Trust Domain API.
        Trust anchors, trusted issuers, relationships, and selections are managed by the Trust
        Domain API itself; this section only configures non-secret connection metadata. The internal
        workload credential is server-owned and bound through the typed system flow.
      properties:
        internalUrl:
          type: string
          format: uri
          nullable: true
          description: Internal connection URL for the authorization-server service that exposes the tenant Trust Domain API.
          example: http://tenant-as.internal:18083
        clientId:
          type: string
          nullable: true
          description: Tenant-scoped confidential OAuth client used by the issuer.
          example: issuer-trust-domain-service
        audience:
          type: string
          nullable: true
          default: enterprise-tenant-as
          description: Access-token audience required by the tenant Trust Domain API.
          example: enterprise-tenant-as
    Oid4vciIssuerTrustDomainApiSettingsView:
      type: object
      description: Effective Trust Domain API connection settings with source markers. No plaintext secret is returned.
      properties:
        internalUrl:
          $ref: '#/components/schemas/StringConfigField'
        clientId:
          $ref: '#/components/schemas/StringConfigField'
        audience:
          $ref: '#/components/schemas/StringConfigField'
      example:
        internalUrl: { value: 'http://tenant-as.internal:18083', source: tenant }
        clientId: { value: issuer-trust-domain-service, source: tenant }
        audience: { value: enterprise-tenant-as, source: tenant }

    Oid4vciIssuerMetadataSettings:
      type: object
      description: >
        Write shape for the tenant OID4VCI issuer metadata section. These fields
        map to issuer identifier, display metadata, and signed issuer metadata key descriptors.
        Authorization-server selection is owned exclusively by issuer authorization-server bindings.
      properties:
        issuerIdentifier:
          type: string
          format: uri
          nullable: true
          description: Issuer identifier advertised in OID4VCI issuer metadata.
          example: https://issuer.acme.example
        displayName:
          type: string
          nullable: true
          description: Default issuer display name for wallet metadata.
          example: Acme Workforce Issuer
        displayLocale:
          type: string
          nullable: true
          description: BCP 47 locale for the default display entry.
          example: en-US
        signedMetadataEnabled:
          type: boolean
          nullable: true
          description: Enables signed issuer metadata when an opaque KMS resource handle is configured.
        kmsResourceHandle:
          type: string
          nullable: true
          description: Opaque product-managed KMS resource handle used to sign issuer metadata.
          example: krh_01234567890123456789
        kmsKeyAlias:
          type: string
          nullable: true
          description: Tenant-visible key alias selected within the configured KMS resource.
          example: issuer-signing-default
      example:
        issuerIdentifier: https://issuer.acme.example
        displayName: Acme Workforce Issuer
        displayLocale: en-US
        signedMetadataEnabled: true
        kmsResourceHandle: krh_01234567890123456789
        kmsKeyAlias: issuer-signing-default
    Oid4vciIssuerMetadataSettingsView:
      type: object
      description: Effective OID4VCI issuer metadata settings with source markers.
      properties:
        issuerIdentifier:
          $ref: '#/components/schemas/StringConfigField'
        displayName:
          $ref: '#/components/schemas/StringConfigField'
        displayLocale:
          $ref: '#/components/schemas/StringConfigField'
        signedMetadataEnabled:
          $ref: '#/components/schemas/BooleanConfigField'
        kmsResourceHandle:
          $ref: '#/components/schemas/StringConfigField'
        kmsKeyAlias:
          $ref: '#/components/schemas/StringConfigField'
      example:
        issuerIdentifier: { value: https://issuer.acme.example, source: tenant }
        displayName: { value: Acme Workforce Issuer, source: tenant }
        displayLocale: { value: en-US, source: tenant }
        signedMetadataEnabled: { value: true, source: tenant }
        kmsResourceHandle: { value: krh_01234567890123456789, source: tenant }
        kmsKeyAlias: { value: issuer-signing-default, source: tenant }
    JweAlgorithm:
      type: string
      description: JWE key-management algorithm supported by the platform configuration API.
      enum:
        - ECDH-ES
        - ECDH-ES+A128KW
        - ECDH-ES+A192KW
        - ECDH-ES+A256KW
        - RSA-OAEP
        - RSA-OAEP-256
        - RSA-OAEP-384
        - RSA-OAEP-512
        - A128KW
        - A192KW
        - A256KW
        - A128GCMKW
        - A192GCMKW
        - A256GCMKW
        - dir
      example: ECDH-ES
    JweContentEncryptionAlgorithm:
      type: string
      description: JWE content-encryption algorithm supported by the platform configuration API.
      enum: [A128GCM, A192GCM, A256GCM, A128CBC-HS256, A192CBC-HS384, A256CBC-HS512]
      example: A256GCM
    JweCompressionAlgorithm:
      type: string
      description: JWE compression algorithm supported by the platform configuration API.
      enum: [DEF]
      example: DEF
    Oid4vciIssuerSecuritySettings:
      type: object
      description: >
        Write shape for OID4VCI credential response and request encryption
        metadata. Key aliases are descriptors only; private key material remains
        in the configured KMS/secrets backend.
      properties:
        credentialResponseEncryptionMode:
          allOf:
            - $ref: '#/components/schemas/FeatureMode'
          description: >
            Credential response encryption policy. `disabled` omits
            `credential_response_encryption` from issuer metadata, `supported`
            publishes it with `encryption_required=false`, and `required`
            publishes it with `encryption_required=true`.
        credentialResponseEncryptionAlgValuesSupported:
          type: array
          nullable: true
          description: JWE algorithms the issuer advertises for encrypted credential responses.
          items:
            $ref: '#/components/schemas/JweAlgorithm'
          example: [ECDH-ES, RSA-OAEP-256]
        credentialResponseEncryptionEncValuesSupported:
          type: array
          nullable: true
          description: JWE content-encryption algorithms the issuer advertises for encrypted credential responses.
          items:
            $ref: '#/components/schemas/JweContentEncryptionAlgorithm'
          example: [A256GCM]
        credentialResponseEncryptionZipValuesSupported:
          type: array
          nullable: true
          description: Compression algorithms the issuer advertises for encrypted credential responses.
          items:
            $ref: '#/components/schemas/JweCompressionAlgorithm'
          example: [DEF]
        credentialResponseEncryptionRequired:
          type: boolean
          nullable: true
          description: >
            Legacy compatibility flag. When `credentialResponseEncryptionMode`
            is present, the mode is authoritative. Without a mode, `true`
            is equivalent to `required`; absent or `false` is equivalent to
            `disabled`.
        credentialRequestEncryptionMode:
          allOf:
            - $ref: '#/components/schemas/FeatureMode'
          description: >
            Credential request encryption policy. `disabled` omits
            `credential_request_encryption` from issuer metadata, `supported`
            publishes it with `encryption_required=false`, and `required`
            publishes it with `encryption_required=true`.
        kmsResourceHandle:
          type: string
          nullable: true
          description: Opaque product-managed KMS resource handle used to decrypt encrypted credential requests.
          example: krh_01234567890123456789
        kmsKeyAlias:
          type: string
          nullable: true
          description: Tenant-visible decryption-key alias selected within the configured KMS resource.
          example: issuer-request-decryption-default
        credentialRequestEncryptionEncValuesSupported:
          type: array
          nullable: true
          description: JWE content-encryption algorithms accepted for encrypted credential requests.
          items:
            $ref: '#/components/schemas/JweContentEncryptionAlgorithm'
          example: [A256GCM]
        credentialRequestEncryptionZipValuesSupported:
          type: array
          nullable: true
          description: Compression algorithms accepted for encrypted credential requests.
          items:
            $ref: '#/components/schemas/JweCompressionAlgorithm'
          example: [DEF]
        credentialRequestEncryptionRequired:
          type: boolean
          nullable: true
          description: >
            Legacy compatibility flag. When `credentialRequestEncryptionMode`
            is present, the mode is authoritative. Without a mode, `true`
            is equivalent to `required`; absent or `false` is equivalent to
            `disabled`.
      example:
        credentialResponseEncryptionMode: required
        credentialResponseEncryptionAlgValuesSupported: [ECDH-ES]
        credentialResponseEncryptionEncValuesSupported: [A256GCM]
        credentialResponseEncryptionRequired: true
        credentialRequestEncryptionMode: supported
        kmsResourceHandle: krh_01234567890123456789
        kmsKeyAlias: issuer-request-decryption-default
        credentialRequestEncryptionEncValuesSupported: [A256GCM]
        credentialRequestEncryptionRequired: false
    Oid4vciIssuerSecuritySettingsView:
      type: object
      description: Effective OID4VCI issuer security settings with source markers.
      properties:
        credentialResponseEncryptionMode:
          $ref: '#/components/schemas/FeatureConfigField'
        credentialResponseEncryptionAlgValuesSupported:
          $ref: '#/components/schemas/StringListConfigField'
        credentialResponseEncryptionEncValuesSupported:
          $ref: '#/components/schemas/StringListConfigField'
        credentialResponseEncryptionZipValuesSupported:
          $ref: '#/components/schemas/StringListConfigField'
        credentialResponseEncryptionRequired:
          $ref: '#/components/schemas/BooleanConfigField'
        credentialRequestEncryptionMode:
          $ref: '#/components/schemas/FeatureConfigField'
        kmsResourceHandle:
          $ref: '#/components/schemas/StringConfigField'
        kmsKeyAlias:
          $ref: '#/components/schemas/StringConfigField'
        credentialRequestEncryptionEncValuesSupported:
          $ref: '#/components/schemas/StringListConfigField'
        credentialRequestEncryptionZipValuesSupported:
          $ref: '#/components/schemas/StringListConfigField'
        credentialRequestEncryptionRequired:
          $ref: '#/components/schemas/BooleanConfigField'
      example:
        credentialResponseEncryptionMode: { value: required, source: tenant }
        credentialResponseEncryptionAlgValuesSupported: { value: [ECDH-ES], source: tenant }
        credentialResponseEncryptionEncValuesSupported: { value: [A256GCM], source: tenant }
        credentialResponseEncryptionZipValuesSupported: { value: [DEF], source: default }
        credentialResponseEncryptionRequired: { value: true, source: tenant }
        credentialRequestEncryptionMode: { value: supported, source: tenant }
        kmsResourceHandle: { value: krh_01234567890123456789, source: tenant }
        kmsKeyAlias: { value: issuer-request-decryption-default, source: tenant }
        credentialRequestEncryptionEncValuesSupported: { value: [A256GCM], source: tenant }
        credentialRequestEncryptionZipValuesSupported: { value: [DEF], source: default }
        credentialRequestEncryptionRequired: { value: false, source: tenant }
    Oid4vciIssuerIssuanceSettings:
      type: object
      description: Issuance tuning that belongs to the issuer runtime, not to credential designs.
      properties:
        batchCredentialIssuanceMaxSize:
          type: integer
          minimum: 1
          nullable: true
          description: Maximum number of credentials the issuer accepts in a batch credential request.
          example: 10
        issuanceClockSkewInSeconds:
          type: integer
          minimum: 0
          nullable: true
          description: Clock skew accepted when validating issuance-time artifacts.
          example: 60
        walletInitiatedSubjectAttributes:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            Subject-attribute registry used for wallet-initiated issuance, keyed by the authenticated
            subject identifier. This is tenant protocol data written through the production REST API;
            it is never sourced from deployment values or environment variables.
        missingRequiredClaims:
          type: string
          nullable: true
          oneOf:
            - enum: [reject, defer]
          description: >-
            Behavior at the credential endpoint when required claims are still
            missing and the binding carries no explicit deferral policy. reject
            returns a credential-request error; defer returns the deferred
            (transaction_id) response so an operator can complete the data and
            release the session. Default reject.
      example:
        batchCredentialIssuanceMaxSize: 10
        issuanceClockSkewInSeconds: 60
        walletInitiatedSubjectAttributes:
          holder@example.com:
            EuPid: { given_name: Erika, family_name: Mustermann, birth_date: '1990-01-15' }
        missingRequiredClaims: reject
    Oid4vciIssuerIssuanceSettingsView:
      type: object
      description: Effective OID4VCI issuer issuance settings with source markers.
      properties:
        batchCredentialIssuanceMaxSize:
          $ref: '#/components/schemas/IntegerConfigField'
        issuanceClockSkewInSeconds:
          $ref: '#/components/schemas/IntegerConfigField'
        walletInitiatedSubjectAttributes:
          $ref: '#/components/schemas/JsonObjectConfigField'
        missingRequiredClaims:
          $ref: '#/components/schemas/StringConfigField'
      example:
        batchCredentialIssuanceMaxSize: { value: 10, source: tenant }
        issuanceClockSkewInSeconds: { value: 60, source: default }
        missingRequiredClaims: { value: reject, source: default }
    Oid4vciIssuerTestingConsoleSettings:
      type: object
      description: |
        Per-instance testing-console policy for external issuer testing and session diagnostics. The patch is
        validated against the resulting effective configuration. When `enabled` is true and
        `exposureMode` is `as_protected`, `authorizationServerId` and `clientId` must be
        non-empty, `scopes` must contain at least one value, and `audience` must be
        `enterprise-issuer`. Authentication fields are not required for a public surface.
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 160
          nullable: true
          description: Optional instance-scoped portal display-name override. The issuer display name is used when omitted.
        themeApplicationId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          nullable: true
          description: Optional application id resolved by the existing tenant theme service for this testing console.
        enabled:
          type: boolean
          nullable: true
        exposureMode:
          type: string
          enum: [public, as_protected, null]
          nullable: true
          default: public
          description: PUBLIC or AS_PROTECTED exposure; the wire values are lowercase config values and omission defaults to public.
        authorizationServerId:
          type: string
          format: uuid
          nullable: true
          description: Stable tenant authorization-server resource UUID used by an AS-protected testing console.
        clientId:
          type: string
          minLength: 1
          nullable: true
          description: Exact enabled public OAuth client registered on the selected authorization server.
        scopes:
          type: array
          minItems: 1
          nullable: true
          items: { type: string, minLength: 1 }
          description: Explicit OAuth scopes requested by an AS-protected testing console; no scopes are inferred.
        audience:
          type: string
          enum: [enterprise-issuer, null]
          nullable: true
          description: Access-token audience for the issuer testing console.
        resource:
          type: string
          nullable: true
          description: Optional RFC 8707 resource indicator requested by the testing console.
      example:
        displayName: Acme Workforce Issuer Playground
        themeApplicationId: oid4vci-issuer:workforce:testing
        enabled: true
        exposureMode: public
    Oid4vciIssuerTestingConsoleSettingsView:
      type: object
      required: [publicBaseUrl, displayUrl]
      properties:
        displayName:
          $ref: '#/components/schemas/StringConfigField'
        themeApplicationId:
          $ref: '#/components/schemas/StringConfigField'
        enabled:
          $ref: '#/components/schemas/BooleanConfigField'
        exposureMode:
          $ref: '#/components/schemas/StringConfigField'
        authorizationServerId:
          $ref: '#/components/schemas/UuidConfigField'
        clientId:
          $ref: '#/components/schemas/StringConfigField'
        scopes:
          $ref: '#/components/schemas/StringListConfigField'
        audience:
          $ref: '#/components/schemas/StringConfigField'
        resource:
          $ref: '#/components/schemas/StringConfigField'
        publicBaseUrl:
          type: string
          format: uri
          nullable: true
          readOnly: true
          description: Canonical public protocol base URL resolved from the active endpoint binding for this exact issuer instance.
        displayUrl:
          type: string
          format: uri
          nullable: true
          readOnly: true
          description: Canonical public testing-console page URL for this exact issuer instance.
      example:
        displayName: { value: Acme Workforce Issuer Playground, source: tenant }
        themeApplicationId: { value: oid4vci-issuer:workforce:testing, source: tenant }
        enabled: { value: true, source: tenant }
        exposureMode: { value: public, source: default }

    Oid4vciIssuerCatalogConsoleSettings:
      type: object
      description: |
        Per-instance catalog-console policy for the hosted public catalog inspect surface.
        The patch is validated against the resulting effective configuration. `catalogIds`
        lists the published catalogs this issuer instance exposes. When omitted on read,
        the effective list defaults to catalogs bound to the instance's credential configurations.
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 160
          nullable: true
          description: Optional instance-scoped portal display-name override. The issuer display name is used when omitted.
        themeApplicationId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          nullable: true
          description: Optional application id resolved by the existing tenant theme service for this catalog console. The testing-console theme is reused when omitted.
        enabled:
          type: boolean
          nullable: true
        exposureMode:
          type: string
          enum: [public, as_protected, null]
          nullable: true
          default: public
          description: PUBLIC or AS_PROTECTED exposure; the wire values are lowercase config values and omission defaults to public.
        authorizationServerId:
          type: string
          format: uuid
          nullable: true
          description: Stable tenant authorization-server resource UUID used by an AS-protected catalog console.
        clientId:
          type: string
          minLength: 1
          nullable: true
          description: Exact enabled public OAuth client registered on the selected authorization server.
        scopes:
          type: array
          minItems: 1
          nullable: true
          items: { type: string, minLength: 1 }
          description: Explicit OAuth scopes requested by an AS-protected catalog console; no scopes are inferred.
        audience:
          type: string
          enum: [enterprise-issuer, null]
          nullable: true
          description: Access-token audience for the issuer catalog console.
        resource:
          type: string
          nullable: true
          description: Optional RFC 8707 resource indicator requested by the catalog console.
        catalogIds:
          type: array
          nullable: true
          items: { type: string, minLength: 1 }
          description: Published catalog ids this instance exposes. When omitted on read, the effective list defaults to catalogs bound to the instance's credential configurations.
      example:
        displayName: Acme Workforce Catalog
        themeApplicationId: oid4vci-issuer:workforce:testing
        enabled: true
        exposureMode: public
        catalogIds: [cat-webuild-pid]
    Oid4vciIssuerCatalogConsoleSettingsView:
      type: object
      required: [publicBaseUrl, displayUrl]
      properties:
        displayName:
          $ref: '#/components/schemas/StringConfigField'
        themeApplicationId:
          $ref: '#/components/schemas/StringConfigField'
        enabled:
          $ref: '#/components/schemas/BooleanConfigField'
        exposureMode:
          $ref: '#/components/schemas/StringConfigField'
        authorizationServerId:
          $ref: '#/components/schemas/UuidConfigField'
        clientId:
          $ref: '#/components/schemas/StringConfigField'
        scopes:
          $ref: '#/components/schemas/StringListConfigField'
        audience:
          $ref: '#/components/schemas/StringConfigField'
        resource:
          $ref: '#/components/schemas/StringConfigField'
        catalogIds:
          $ref: '#/components/schemas/StringListConfigField'
        publicBaseUrl:
          type: string
          format: uri
          nullable: true
          readOnly: true
          description: Canonical public protocol base URL resolved from the active endpoint binding for this exact issuer instance.
        displayUrl:
          type: string
          format: uri
          nullable: true
          readOnly: true
          description: Canonical public catalog-console page URL for this exact issuer instance.
      example:
        displayName: { value: Acme Workforce Catalog, source: tenant }
        themeApplicationId: { value: oid4vci-issuer:workforce:testing, source: tenant }
        enabled: { value: true, source: tenant }
        exposureMode: { value: public, source: default }
        catalogIds: { value: [cat-webuild-pid], source: tenant }

    KeyAttestationsRequiredSettings:
      type: object
      description: >
        Per-proof-type key-attestation policy (OID4VCI 1.0 §11.2.3 `key_attestations_required`).
        When `enabled` is false or omitted the policy is not advertised and unattested proofs are
        accepted. The `keyStorage` / `userAuthentication` lists carry the minimum acceptable ISO
        18045 attack-potential-resistance levels.
      properties:
        enabled:
          type: boolean
          nullable: true
          description: Whether the key-attestation policy is advertised in metadata for this proof type.
          example: true
        keyStorage:
          type: array
          nullable: true
          items:
            type: string
          description: Minimum acceptable key-storage attack-potential-resistance levels.
          example: [iso_18045_moderate]
        userAuthentication:
          type: array
          nullable: true
          items:
            type: string
          description: Minimum acceptable user-authentication attack-potential-resistance levels.
          example: [iso_18045_moderate]
    ProofTypeSettings:
      type: object
      description: >
        Per-proof-type settings advertised under a credential configuration's
        `proof_types_supported.<type>` object.
      properties:
        proofSigningAlgValuesSupported:
          type: array
          nullable: true
          items:
            type: string
          description: JWA signing algorithms the issuer accepts for this proof type.
          example: [ES256, ES384]
        keyAttestationsRequired:
          $ref: '#/components/schemas/KeyAttestationsRequiredSettings'
    TxCodeSettings:
      type: object
      description: >
        Pre-authorized-code `tx_code` policy for OID4VCI 1.0. Drives both the transaction-code hint
        published to the wallet in the credential offer and issuer-side generation of the code the
        holder presents at the token endpoint.
      properties:
        enabled:
          type: boolean
          nullable: true
          description: Whether a transaction code is required for the pre-authorized-code grant.
          example: true
        inputMode:
          type: string
          nullable: true
          enum: [numeric, text]
          description: Wallet input mode hint published as `tx_code.input_mode`.
          example: numeric
        length:
          type: integer
          minimum: 1
          nullable: true
          description: Expected transaction-code length published as `tx_code.length`.
          example: 6
        description:
          type: string
          maxLength: 300
          nullable: true
          description: Guidance shown to the holder, published as `tx_code.description`.
          example: Enter the 6-digit code from your onboarding email.
    PreAuthorizedCodeGrantSettings:
      type: object
      description: Pre-authorized-code grant policy offered in OID4VCI credential offers.
      properties:
        enabled:
          type: boolean
          nullable: true
          description: Whether the issuer offers the pre-authorized-code grant.
          example: true
        txCode:
          $ref: '#/components/schemas/TxCodeSettings'
    AuthorizationCodeGrantSettings:
      type: object
      description: >
        Authorization-code grant policy offered in OID4VCI credential offers, including whether the
        issuer uses scope-based authorization or RFC 9396 `authorization_details` with the
        authorization server.
      properties:
        enabled:
          type: boolean
          nullable: true
          description: Whether the issuer offers the authorization-code grant.
          example: true
        requireIssuerState:
          type: boolean
          nullable: true
          description: Whether the offer carries and the token request requires an `issuer_state`.
          example: true
        authorizationDetailsEnabled:
          type: boolean
          nullable: true
          description: Whether the issuer uses RFC 9396 `authorization_details` instead of scope-based authorization.
          example: false
        authorizationServerIds:
          type: array
          nullable: true
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: >
            Stable authorization-server resource UUIDs already registered through the issuer's
            authorization-server bindings. Issuer URLs, slugs, and other aliases are not accepted.
            Omitted or null means every authorization server registered on the issuer is allowed.
            When more than one remains, a credential offer names the one to use via its
            `authorization_code` grant `authorization_server` parameter.
          example: [123e4567-e89b-12d3-a456-426614174004]
    OfferGrantsSettings:
      type: object
      description: OID4VCI credential-offer grant policy for the pre-authorized-code and authorization-code grants.
      properties:
        preAuthorizedCode:
          $ref: '#/components/schemas/PreAuthorizedCodeGrantSettings'
        authorizationCode:
          $ref: '#/components/schemas/AuthorizationCodeGrantSettings'
    CredentialStatusSettings:
      type: object
      description: >
        Status-list binding for issued credentials. References a status list managed by the
        status-list API and selects how the status entry is interpreted.
      properties:
        statusListId:
          type: string
          nullable: true
          description: Business key / correlationId of a status list managed by the status-list API.
          example: pid-revocation-list
        purpose:
          type: string
          nullable: true
          enum: [revocation, suspension]
          description: How the bound status entry is interpreted.
          example: revocation
        revokeAtExpiry:
          type: boolean
          nullable: true
          description: Whether the issuer revokes the status entry when the credential reaches its validity end.
          example: false
    Oid4vciIssuerCredentialDefaults:
      type: object
      description: >
        Issuer-level defaults for the OID4VCI issuance options that are overridable per credential
        configuration. These fields form the `issuer` layer of the resolution ladder: a
        per-configuration setting at the same scope overrides the matching issuer default, which in
        turn overrides the platform default. Identity fields (`scope`, `vct`, `docType`, `format`)
        are per-configuration only and are not part of this section. Inheritance is live: effective
        values are resolved at read and issuance time, never snapshotted.
      properties:
        grants:
          $ref: '#/components/schemas/OfferGrantsSettings'
        cryptographicBindingMethodsSupported:
          type: array
          nullable: true
          items:
            type: string
          description: Default OID4VCI `cryptographic_binding_methods_supported`.
          example: [jwk, cose_key]
        credentialSigningAlgValuesSupported:
          type: array
          nullable: true
          items:
            type: string
          description: Default OID4VCI `credential_signing_alg_values_supported`.
          example: [ES256]
        proofTypesSupported:
          type: object
          nullable: true
          description: Default OID4VCI `proof_types_supported`, keyed by proof type (e.g. `jwt`).
          additionalProperties:
            $ref: '#/components/schemas/ProofTypeSettings'
          example:
            jwt:
              proofSigningAlgValuesSupported: [ES256]
        kmsResourceHandle:
          type: string
          nullable: true
          description: Opaque product-managed KMS resource handle for issued credentials.
          example: krh_01234567890123456789
        kmsKeyAlias:
          type: string
          nullable: true
          description: Default tenant-visible signing-key alias selected within the configured KMS resource.
          example: issuer-signing-default
        signingKeyMode:
          type: string
          nullable: true
          description: Default signing identity type. DID modes require `signingVerificationMethodId`; `x5c` uses the selected KMS key's certificate chain.
          example: x5c
        signingVerificationMethodId:
          type: string
          nullable: true
          description: Exact assertionMethod DID URL selected for the signing key. Required when `signingKeyMode` starts with `did:`.
          example: did:web:issuer.example#issuer-assertion
        signingX5c:
          type: array
          nullable: true
          items:
            type: string
          description: Resolved X.509 certificate chain as standard-base64 DER strings in RFC 7517 x5c order.
          example: [<base64-der-leaf>, <base64-der-intermediate>]
        validityPeriod:
          type: string
          nullable: true
          description: >
            Default validity of issued credentials as an ISO-8601 duration (e.g. `P365D`, `PT12H`).
            Sets the credential `exp` relative to issuance time.
          example: P365D
        status:
          $ref: '#/components/schemas/CredentialStatusSettings'
      example:
        grants:
          preAuthorizedCode:
            enabled: true
            txCode:
              enabled: true
              inputMode: numeric
              length: 6
          authorizationCode:
            enabled: true
            authorizationDetailsEnabled: false
        cryptographicBindingMethodsSupported: [jwk]
        credentialSigningAlgValuesSupported: [ES256]
        proofTypesSupported:
          jwt:
            proofSigningAlgValuesSupported: [ES256]
        kmsResourceHandle: krh_01234567890123456789
        kmsKeyAlias: issuer-signing-default
        validityPeriod: P365D
        status:
          statusListId: pid-revocation-list
          purpose: revocation
    KeyAttestationsRequiredSettingsView:
      type: object
      description: Effective per-proof-type key-attestation policy with source markers.
      properties:
        enabled:
          $ref: '#/components/schemas/BooleanConfigField'
        keyStorage:
          $ref: '#/components/schemas/StringListConfigField'
        userAuthentication:
          $ref: '#/components/schemas/StringListConfigField'
    ProofTypeSettingsView:
      type: object
      description: Effective per-proof-type settings with source markers.
      properties:
        proofSigningAlgValuesSupported:
          $ref: '#/components/schemas/StringListConfigField'
        keyAttestationsRequired:
          $ref: '#/components/schemas/KeyAttestationsRequiredSettingsView'
    TxCodeSettingsView:
      type: object
      description: Effective `tx_code` policy with per-field source markers.
      properties:
        enabled:
          $ref: '#/components/schemas/BooleanConfigField'
        inputMode:
          $ref: '#/components/schemas/StringConfigField'
        length:
          $ref: '#/components/schemas/IntegerConfigField'
        description:
          $ref: '#/components/schemas/StringConfigField'
    PreAuthorizedCodeGrantSettingsView:
      type: object
      description: Effective pre-authorized-code grant policy with source markers.
      properties:
        enabled:
          $ref: '#/components/schemas/BooleanConfigField'
        txCode:
          $ref: '#/components/schemas/TxCodeSettingsView'
    AuthorizationCodeGrantSettingsView:
      type: object
      description: Effective authorization-code grant policy with source markers.
      properties:
        enabled:
          $ref: '#/components/schemas/BooleanConfigField'
        requireIssuerState:
          $ref: '#/components/schemas/BooleanConfigField'
        authorizationDetailsEnabled:
          $ref: '#/components/schemas/BooleanConfigField'
        authorizationServerIds:
          $ref: '#/components/schemas/UuidListConfigField'
    OfferGrantsSettingsView:
      type: object
      description: Effective credential-offer grant policy with source markers.
      properties:
        preAuthorizedCode:
          $ref: '#/components/schemas/PreAuthorizedCodeGrantSettingsView'
        authorizationCode:
          $ref: '#/components/schemas/AuthorizationCodeGrantSettingsView'
    CredentialStatusSettingsView:
      type: object
      description: Effective status-list binding with source markers.
      properties:
        statusListId:
          $ref: '#/components/schemas/StringConfigField'
        purpose:
          $ref: '#/components/schemas/StringConfigField'
        revokeAtExpiry:
          $ref: '#/components/schemas/BooleanConfigField'
    Oid4vciIssuerCredentialDefaultsView:
      type: object
      description: >
        Effective issuer-level credential defaults with per-field source markers. Each leaf carries a
        `source` of `issuer` (a default set at this issuer scope) or `default` (the platform default).
        Inheritance is live: values are resolved at read time, never snapshotted.
      properties:
        grants:
          $ref: '#/components/schemas/OfferGrantsSettingsView'
        cryptographicBindingMethodsSupported:
          $ref: '#/components/schemas/StringListConfigField'
        credentialSigningAlgValuesSupported:
          $ref: '#/components/schemas/StringListConfigField'
        proofTypesSupported:
          type: object
          description: Effective `proof_types_supported`, keyed by proof type, with per-field source markers.
          additionalProperties:
            $ref: '#/components/schemas/ProofTypeSettingsView'
        kmsResourceHandle:
          $ref: '#/components/schemas/StringConfigField'
        kmsKeyAlias:
          $ref: '#/components/schemas/StringConfigField'
        signingKeyMode:
          $ref: '#/components/schemas/StringConfigField'
        signingVerificationMethodId:
          $ref: '#/components/schemas/StringConfigField'
        signingX5c:
          $ref: '#/components/schemas/StringListConfigField'
        validityPeriod:
          $ref: '#/components/schemas/StringConfigField'
        status:
          $ref: '#/components/schemas/CredentialStatusSettingsView'
      example:
        cryptographicBindingMethodsSupported: { value: [jwk], source: issuer }
        credentialSigningAlgValuesSupported: { value: [ES256], source: issuer }
        kmsResourceHandle: { value: krh_01234567890123456789, source: issuer }
        kmsKeyAlias: { value: issuer-signing-default, source: issuer }
        validityPeriod: { value: P365D, source: issuer }
    CredentialConfigurationSettings:
      type: object
      description: >
        Editable NON-DISPLAY settings for a single OID4VCI `credential_configuration_id`. These are
        the protocol-level fields the issuer-metadata read/merge path overlays onto a credential
        design: `scope`, cryptographic binding methods, credential signing algorithms, proof types,
        format-specific identity, and issuance-only signing/lifecycle settings. The per-locale
        credential/claim DISPLAY (and claim mandatory/selective-disclosure) is owned by the
        credential-design API and is intentionally not part of this resource. Writes flow into the
        same `oid4vci.issuer.credentials.[<id>].*` configuration keys the metadata builder consumes.
      required: [resourceId, credentialConfigurationId]
      properties: &CredentialConfigurationSettingsProperties
        resourceId:
          type: string
          format: uuid
          description: Immutable trust-domain consumer resource UUID for this credential configuration.
          example: 9c0414bf-e703-4eac-95aa-e417e436e84b
        credentialConfigurationId:
          type: string
          description: The `credential_configuration_id` these settings apply to.
          example: EuPid
        format:
          allOf:
            - $ref: './wallet-credential-components.yml#/components/schemas/CredentialFormat'
          nullable: true
          description: >-
            OID4VCI credential format. This is a credential format only; presentation formats such as
            `jwt_vp_json` are not valid here. Includes VCDM 1.1 `jwt_vc_json` and VCDM 2.0
            `jwt_vc_json-ld`.
          example: jwt_vc_json
        scope:
          type: string
          nullable: true
          description: OAuth2 scope a wallet requests to obtain this credential.
          example: eu.europa.ec.eudi.pid.1
        authorizationServerId:
          type: string
          format: uuid
          nullable: true
          description: Optional stable AS resource UUID. When absent, selection resolves to the issuer default.
          example: 996d5f68-8836-4af1-b6da-1330b42a2805
        vct:
          type: string
          nullable: true
          description: SD-JWT VC type identifier (`vct`) for SD-JWT formats.
          example: https://issuer.example/credentials/eu-pid
        docType:
          type: string
          nullable: true
          description: ISO mdoc `doctype` for `mso_mdoc` formats.
          example: org.iso.18013.5.1.mDL
        credentialDefinitionTypes:
          type: array
          nullable: true
          items:
            type: string
          description: W3C VC `credentialDefinition.type` values for JSON-LD / JWT VC formats.
          example: [VerifiableCredential, EuPidCredential]
        grants:
          $ref: '#/components/schemas/OfferGrantsSettings'
        cryptographicBindingMethodsSupported:
          type: array
          nullable: true
          items:
            type: string
          description: OID4VCI `cryptographic_binding_methods_supported`.
          example: [jwk, cose_key]
        credentialSigningAlgValuesSupported:
          type: array
          nullable: true
          items:
            type: string
          description: OID4VCI `credential_signing_alg_values_supported`.
          example: [ES256]
        proofTypesSupported:
          type: object
          nullable: true
          description: OID4VCI `proof_types_supported`, keyed by proof type (e.g. `jwt`).
          additionalProperties:
            $ref: '#/components/schemas/ProofTypeSettings'
          example:
            jwt:
              proofSigningAlgValuesSupported: [ES256]
        kmsResourceHandle:
          type: string
          nullable: true
          description: Opaque product-managed KMS resource handle for this credential configuration.
          example: krh_01234567890123456789
        kmsKeyAlias:
          type: string
          nullable: true
          description: Tenant-visible signing-key alias selected within the configured KMS resource.
          example: issuer-signing-eupid
        signingKeyMode:
          type: string
          nullable: true
          description: Signing identity type. DID modes require `signingVerificationMethodId`; `x5c` uses the selected KMS key's certificate chain.
          example: x5c
        signingVerificationMethodId:
          type: string
          nullable: true
          description: Exact assertionMethod DID URL selected for this signing key. Required when `signingKeyMode` starts with `did:`.
          example: did:web:issuer.example#issuer-assertion
        signingX5c:
          type: array
          nullable: true
          items:
            type: string
          description: Resolved X.509 certificate chain as standard-base64 DER strings in RFC 7517 x5c order.
          example: [<base64-der-leaf>, <base64-der-intermediate>]
        validityPeriod:
          type: string
          nullable: true
          description: >
            Validity of issued credentials as an ISO-8601 duration (e.g. `P365D`, `PT12H`). Sets the
            credential `exp` relative to issuance time.
          example: P365D
        status:
          $ref: '#/components/schemas/CredentialStatusSettings'
      example:
        resourceId: 9c0414bf-e703-4eac-95aa-e417e436e84b
        credentialConfigurationId: EuPid
        format: dc+sd-jwt
        scope: eu.europa.ec.eudi.pid.1
        vct: https://issuer.example/credentials/eu-pid
        cryptographicBindingMethodsSupported: [jwk]
        credentialSigningAlgValuesSupported: [ES256]
        proofTypesSupported:
          jwt:
            proofSigningAlgValuesSupported: [ES256]
        kmsResourceHandle: krh_01234567890123456789
        kmsKeyAlias: issuer-signing-eupid
        validityPeriod: P365D
        status:
          statusListId: pid-revocation-list
          purpose: revocation
    CredentialConfigurationSettingsPatch:
      type: object
      description: >
        Partial credential-configuration settings with RFC 7386 merge-patch semantics. All fields
        are optional. Omit resourceId when creating settings so the server assigns the immutable
        identity; an existing resourceId cannot be changed. Omitted fields stay unchanged.
      properties: *CredentialConfigurationSettingsProperties
    CredentialConfigurationSettingsView:
      type: object
      description: >
        Effective NON-DISPLAY settings for a single `credential_configuration_id` with per-field
        source markers. For each field the effective value resolves in order: `configuration` (the
        per-configuration setting at the addressed scope) over `issuer` (the issuer credential default
        at the addressed scope) over `design` (identity and display carried by the bound credential
        design, where applicable) over `default` (the platform default). Inheritance is live: values
        are resolved at read and issuance time, never snapshotted. `credentialConfigurationId` is the
        addressing key and is returned as a plain string.
      required: [resourceId, credentialConfigurationId]
      properties:
        resourceId:
          $ref: '#/components/schemas/StringConfigField'
        credentialConfigurationId:
          type: string
          description: The `credential_configuration_id` these effective settings apply to.
          example: EuPid
        format:
          $ref: '#/components/schemas/StringConfigField'
        scope:
          $ref: '#/components/schemas/StringConfigField'
        authorizationServerId:
          $ref: '#/components/schemas/StringConfigField'
        vct:
          $ref: '#/components/schemas/StringConfigField'
        docType:
          $ref: '#/components/schemas/StringConfigField'
        credentialDefinitionTypes:
          $ref: '#/components/schemas/StringListConfigField'
        grants:
          $ref: '#/components/schemas/OfferGrantsSettingsView'
        cryptographicBindingMethodsSupported:
          $ref: '#/components/schemas/StringListConfigField'
        credentialSigningAlgValuesSupported:
          $ref: '#/components/schemas/StringListConfigField'
        proofTypesSupported:
          type: object
          description: Effective `proof_types_supported`, keyed by proof type, with per-field source markers.
          additionalProperties:
            $ref: '#/components/schemas/ProofTypeSettingsView'
        kmsResourceHandle:
          $ref: '#/components/schemas/StringConfigField'
        kmsKeyAlias:
          $ref: '#/components/schemas/StringConfigField'
        signingKeyMode:
          $ref: '#/components/schemas/StringConfigField'
        signingVerificationMethodId:
          $ref: '#/components/schemas/StringConfigField'
        signingX5c:
          $ref: '#/components/schemas/StringListConfigField'
        validityPeriod:
          $ref: '#/components/schemas/StringConfigField'
        status:
          $ref: '#/components/schemas/CredentialStatusSettingsView'
      example:
        resourceId: { value: 9c0414bf-e703-4eac-95aa-e417e436e84b, source: configuration }
        credentialConfigurationId: EuPid
        format: { value: dc+sd-jwt, source: design }
        scope: { value: eu.europa.ec.eudi.pid.1, source: configuration }
        cryptographicBindingMethodsSupported: { value: [jwk], source: issuer }
        credentialSigningAlgValuesSupported: { value: [ES256], source: issuer }
        kmsResourceHandle: { value: krh_01234567890123456789, source: configuration }
        kmsKeyAlias: { value: issuer-signing-eupid, source: configuration }
        validityPeriod: { value: P365D, source: issuer }
    CredentialConfigurationSettingsList:
      type: object
      description: List of an issuer's per-`credential_configuration_id` non-display settings.
      required: [credentialConfigurations]
      properties:
        credentialConfigurations:
          type: array
          items:
            $ref: '#/components/schemas/CredentialConfigurationSettings'
      example:
        credentialConfigurations:
          - credentialConfigurationId: EuPid
            format: dc+sd-jwt
            scope: eu.europa.ec.eudi.pid.1
            credentialSigningAlgValuesSupported: [ES256]
    CredentialConfigurationSettingsViewList:
      type: object
      description: List of an issuer's effective per-`credential_configuration_id` non-display settings.
      required: [credentialConfigurations]
      properties:
        credentialConfigurations:
          type: array
          items:
            $ref: '#/components/schemas/CredentialConfigurationSettingsView'
    CredentialConfigurationImportRequest:
      type: object
      description: >
        Request to import credential configurations from a remote OID4VCI issuer. The issuer metadata
        is fetched from `sourceUrl` and each selected `credential_configuration_id` is materialized as
        a per-configuration setting and, when `includeDesigns` is set, an accompanying credential
        design.
      required: [sourceUrl]
      properties:
        sourceUrl:
          type: string
          format: uri
          description: Issuer identifier or a full `.well-known/openid-credential-issuer` metadata URL to import from.
          example: https://issuer.example
        credentialConfigurationIds:
          type: array
          nullable: true
          items:
            type: string
          description: Specific `credential_configuration_id` values to import. Null or omitted imports every advertised configuration.
          example: [EuPid]
        includeDesigns:
          type: boolean
          default: true
          description: Whether to create or update accompanying credential designs from the imported display metadata.
        conflictPolicy:
          type: string
          enum: [skip, replace, merge]
          default: merge
          description: How to resolve an imported configuration that already exists locally.
        designAliasPrefix:
          type: string
          nullable: true
          description: Optional prefix applied to created credential-design aliases to avoid collisions.
          example: imported-
        dryRun:
          type: boolean
          default: false
          description: When true, evaluate and return the planned actions without writing any changes.
      example:
        sourceUrl: https://issuer.example
        includeDesigns: true
        conflictPolicy: merge
        dryRun: false
    CredentialConfigurationImportResultItem:
      type: object
      description: Import outcome for one credential configuration.
      required: [credentialConfigurationId, action]
      properties:
        credentialConfigurationId:
          type: string
          description: The imported `credential_configuration_id`.
          example: EuPid
        action:
          type: string
          enum: [created, updated, skipped]
          description: Action taken for the per-configuration setting.
          example: created
        designId:
          type: string
          format: uuid
          nullable: true
          description: Id of the credential design created or updated for this configuration, when designs were included.
          example: 2f8a1c9e-6b4d-4a2f-9c1e-7d3b5a8f0e21
        designAction:
          type: string
          enum: [created, updated, skipped, none]
          nullable: true
          description: Action taken for the accompanying credential design.
          example: created
        designDraft:
          type: object
          allOf:
            - $ref: './credential-design-components.yml#/components/schemas/CreateCredentialDesignInput'
          nullable: true
          description: Credential-design create body planned from the imported OID4VCI metadata.
        renderVariantDrafts:
          type: array
          description: Render variants planned from OID4VCI display colors and assets. The admin console creates these before attaching their ids to the credential design.
          items:
            $ref: './credential-design-components.yml#/components/schemas/CreateRenderVariantInput'
    CredentialConfigurationImportResult:
      type: object
      description: Result of a credential-configuration import, listing the per-configuration action taken.
      required: [sourceIssuer, fetchedAt, items]
      properties:
        sourceIssuer:
          type: string
          description: Resolved issuer identifier the configurations were imported from.
          example: https://issuer.example
        fetchedAt:
          type: string
          format: date-time
          description: Timestamp when the source issuer metadata was fetched.
          example: '2026-07-02T09:15:00Z'
        items:
          type: array
          description: Per-configuration import outcome.
          items:
            $ref: '#/components/schemas/CredentialConfigurationImportResultItem'
      example:
        sourceIssuer: https://issuer.example
        fetchedAt: '2026-07-02T09:15:00Z'
        items:
          - credentialConfigurationId: EuPid
            action: created
            designId: 2f8a1c9e-6b4d-4a2f-9c1e-7d3b5a8f0e21
            designAction: created

    Oid4vpVerifierClientSettings:
      type: object
      description: OID4VP verifier client identity and redirect settings used as defaults for authorization requests.
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 160
          nullable: true
          description: Human-readable verifier name used in public verifier and client metadata.
          example: Acme Workforce Verifier
        externalBaseUrl:
          type: string
          format: uri
          nullable: true
          description: Public base URL used to construct verifier-facing endpoints.
          example: https://verify.acme.example
        responseUri:
          type: string
          format: uri
          nullable: true
          description: Direct-post response URI advertised for wallet authorization responses.
          example: https://verify.acme.example/direct_post
        kmsResourceHandle:
          type: string
          minLength: 1
          nullable: true
          description: Opaque product-managed KMS resource handle for direct_post.jwt decryption keys.
          example: krh_01234567890123456789
        kmsKeyAlias:
          type: string
          minLength: 1
          nullable: true
          description: Tenant-visible JARM decryption-key alias selected within the configured KMS resource.
          example: jarm-encryption-default
        authBridgeClientId:
          type: string
          nullable: true
          description: OAuth2 client id used when the verifier delegates through the authorization bridge.
          example: acme-workforce-verifier
        authBridgeResponseUri:
          type: string
          format: uri
          nullable: true
          description: Redirect URI used by the authorization bridge client.
          example: https://verify.acme.example/auth/callback
      example:
        displayName: Acme Workforce Verifier
        externalBaseUrl: https://verify.acme.example
        responseUri: https://verify.acme.example/direct_post
        kmsResourceHandle: krh_01234567890123456789
        kmsKeyAlias: jarm-encryption-default
        authBridgeClientId: acme-workforce-verifier
        authBridgeResponseUri: https://verify.acme.example/auth/callback
    Oid4vpVerifierClientSettingsView:
      type: object
      description: Effective OID4VP verifier client settings with source markers.
      properties:
        displayName:
          $ref: '#/components/schemas/StringConfigField'
        externalBaseUrl:
          $ref: '#/components/schemas/StringConfigField'
        responseUri:
          $ref: '#/components/schemas/StringConfigField'
        kmsResourceHandle:
          $ref: '#/components/schemas/StringConfigField'
        kmsKeyAlias:
          $ref: '#/components/schemas/StringConfigField'
        authBridgeClientId:
          $ref: '#/components/schemas/StringConfigField'
        authBridgeResponseUri:
          $ref: '#/components/schemas/StringConfigField'
      example:
        displayName: { value: Acme Workforce Verifier, source: tenant }
        externalBaseUrl: { value: https://verify.acme.example, source: tenant }
        responseUri: { value: https://verify.acme.example/direct_post, source: tenant }
        kmsResourceHandle: { value: krh_01234567890123456789, source: tenant }
        kmsKeyAlias: { value: jarm-encryption-default, source: tenant }
        authBridgeClientId: { value: acme-workforce-verifier, source: tenant }
        authBridgeResponseUri: { value: https://verify.acme.example/auth/callback, source: tenant }
    Oid4vpRequestObjectSigningMode:
      type: string
      description: Request-object signing binding mode supported by the OID4VP verifier runtime.
      enum: [did:jwk, did:web, did:webvh, did:key, x509_san_dns, x509_hash]
      example: did:web
    Oid4vpVerifierRequestObjectSigningSettings:
      type: object
      description: >
        Request-object signing defaults for the verifier. Key fields are KMS
        descriptors; private key material is not stored in platform config.
      properties:
        enabled:
          type: boolean
          nullable: true
          description: Enables signed authorization request objects.
        mode:
          type: string
          allOf:
            - $ref: '#/components/schemas/Oid4vpRequestObjectSigningMode'
          nullable: true
          description: >-
            Request-object signing binding the verifier resolves at runtime
            (resolveSignerBinding). The config value is `did:<method>` (one of
            `did:jwk`, `did:web`, `did:webvh`, `did:key`), `x509_san_dns`, or
            `x509_hash`. From it the verifier emits the OID4VP 1.0 Client
            Identifier Prefix (§5.9.3): `decentralized_identifier:` for the DID
            modes (e.g. `decentralized_identifier:did:web:…`), and
            `x509_san_dns:` / `x509_hash:` for the X.509 modes (client_id = the
            leaf certificate's SAN dNSName / its SHA-256 hash respectively). A
            bare `did` is not accepted; the method is required.
          example: did:web
        kmsResourceHandle:
          type: string
          nullable: true
          description: Opaque product-managed KMS resource handle used for request objects.
          example: krh_01234567890123456789
        kmsKeyAlias:
          type: string
          nullable: true
          description: Tenant-visible signing-key alias selected within the configured KMS resource.
          example: oid4vp-verifier-signing-default
        includeIss:
          type: boolean
          nullable: true
          description: Includes an `iss` claim in signed request objects.
        audience:
          type: string
          nullable: true
          description: Audience value placed in signed request objects.
          example: https://wallet-provider.example
        expirationSeconds:
          type: integer
          minimum: 1
          nullable: true
          description: Lifetime of a signed request object in seconds.
          example: 300
        didWebDomain:
          type: string
          nullable: true
          description: did:web domain used when `mode` is `did:web`.
          example: verify.acme.example
        sanDnsName:
          type: string
          nullable: true
          description: DNS subject alternative name used for certificate-bound signing modes.
          example: verify.acme.example
        verificationMethodId:
          type: string
          nullable: true
          description: Fully qualified verification method id advertised for request-object signatures.
          example: did:web:verify.acme.example#request-object
        verificationMethodFragment:
          type: string
          nullable: true
          description: Verification method fragment used to build the method id when applicable.
          example: request-object
      example:
        enabled: true
        mode: did:web
        kmsResourceHandle: krh_01234567890123456789
        kmsKeyAlias: oid4vp-verifier-signing-default
        includeIss: true
        audience: https://wallet-provider.example
        expirationSeconds: 300
        didWebDomain: verify.acme.example
        verificationMethodFragment: request-object
    Oid4vpVerifierRequestObjectSigningSettingsView:
      type: object
      description: Effective OID4VP verifier request-object signing settings with source markers.
      properties:
        enabled:
          $ref: '#/components/schemas/BooleanConfigField'
        mode:
          $ref: '#/components/schemas/StringConfigField'
        kmsResourceHandle:
          $ref: '#/components/schemas/StringConfigField'
        kmsKeyAlias:
          $ref: '#/components/schemas/StringConfigField'
        includeIss:
          $ref: '#/components/schemas/BooleanConfigField'
        audience:
          $ref: '#/components/schemas/StringConfigField'
        expirationSeconds:
          $ref: '#/components/schemas/IntegerConfigField'
        didWebDomain:
          $ref: '#/components/schemas/StringConfigField'
        sanDnsName:
          $ref: '#/components/schemas/StringConfigField'
        verificationMethodId:
          $ref: '#/components/schemas/StringConfigField'
        verificationMethodFragment:
          $ref: '#/components/schemas/StringConfigField'
      example:
        enabled: { value: true, source: tenant }
        mode: { value: did:web, source: tenant }
        kmsResourceHandle: { value: krh_01234567890123456789, source: tenant }
        kmsKeyAlias: { value: oid4vp-verifier-signing-default, source: tenant }
        includeIss: { value: true, source: tenant }
        audience: { value: https://wallet-provider.example, source: tenant }
        expirationSeconds: { value: 300, source: default }
        didWebDomain: { value: verify.acme.example, source: tenant }
        verificationMethodFragment: { value: request-object, source: tenant }
    Oid4vpVerifierSessionSettings:
      type: object
      description: Authorization-session lifetime settings for the verifier runtime.
      properties:
        sessionTtlSeconds:
          type: integer
          minimum: 1
          nullable: true
          description: Authorization-session time to live in seconds.
          example: 300
      example:
        sessionTtlSeconds: 300
    Oid4vpVerifierSessionSettingsView:
      type: object
      description: Effective OID4VP verifier session settings with source markers.
      properties:
        sessionTtlSeconds:
          $ref: '#/components/schemas/IntegerConfigField'
      example:
        sessionTtlSeconds: { value: 300, source: default }
    Oid4vpVerifierTestingConsoleSettings:
      type: object
      description: |
        Per-instance testing-console policy for external verifier testing and session diagnostics. The patch is
        validated against the resulting effective configuration. When `enabled` is true and
        `exposureMode` is `as_protected`, `authorizationServerId` and `clientId` must be
        non-empty, `scopes` must contain at least one value, and `audience` must be
        `enterprise-verifier`. Authentication fields are not required for a public surface.
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 160
          nullable: true
          description: Optional instance-scoped portal display-name override. The verifier display name is used when omitted.
        themeApplicationId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          nullable: true
          description: Optional application id resolved by the existing tenant theme service for this testing console.
        enabled:
          type: boolean
          nullable: true
        exposureMode:
          type: string
          enum: [public, as_protected, null]
          nullable: true
          default: public
          description: PUBLIC or AS_PROTECTED exposure; the wire values are lowercase config values and omission defaults to public.
        authorizationServerId:
          type: string
          format: uuid
          nullable: true
          description: Stable tenant authorization-server resource UUID used by an AS-protected testing console.
        clientId:
          type: string
          minLength: 1
          nullable: true
          description: Exact enabled public OAuth client registered on the selected authorization server.
        scopes:
          type: array
          minItems: 1
          nullable: true
          items: { type: string, minLength: 1 }
          description: Explicit OAuth scopes requested by an AS-protected testing console; no scopes are inferred.
        audience:
          type: string
          enum: [enterprise-verifier, null]
          nullable: true
          description: Access-token audience for the verifier testing console.
        resource:
          type: string
          nullable: true
          description: Optional RFC 8707 resource indicator requested by the testing console.
        allowTrustAnchorManagement:
          type: boolean
          nullable: true
          description: Allow testing-console users to add DID, issuer-key, and X.509 anchors to selected domains.
        allowTrustDomainDisable:
          type: boolean
          nullable: true
          description: Allow testing-console users to disable or re-enable selected trust domains.
      example:
        displayName: Acme Workforce Verifier Playground
        themeApplicationId: oid4vp-verifier:workforce:testing
        enabled: true
        exposureMode: public
    Oid4vpVerifierTestingConsoleSettingsView:
      type: object
      required: [publicBaseUrl, displayUrl]
      properties:
        displayName:
          $ref: '#/components/schemas/StringConfigField'
        themeApplicationId:
          $ref: '#/components/schemas/StringConfigField'
        enabled:
          $ref: '#/components/schemas/BooleanConfigField'
        exposureMode:
          $ref: '#/components/schemas/StringConfigField'
        authorizationServerId:
          $ref: '#/components/schemas/UuidConfigField'
        clientId:
          $ref: '#/components/schemas/StringConfigField'
        scopes:
          $ref: '#/components/schemas/StringListConfigField'
        audience:
          $ref: '#/components/schemas/StringConfigField'
        resource:
          $ref: '#/components/schemas/StringConfigField'
        allowTrustAnchorManagement:
          $ref: '#/components/schemas/BooleanConfigField'
        allowTrustDomainDisable:
          $ref: '#/components/schemas/BooleanConfigField'
        publicBaseUrl:
          type: string
          format: uri
          nullable: true
          readOnly: true

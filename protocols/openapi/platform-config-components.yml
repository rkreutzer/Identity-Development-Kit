    # ---- Business wallets ----------------------------------------------------
    # A business wallet is a tenant-deployable browser application served at
    # `<tenant-host>/wallets/<slug>`. It is represented in the party model as a software party with
    # a WALLET capability, reserves a BUSINESS_WALLET tenant public endpoint, and stores its
    # configuration under `wallets.<slug>.*` (the same shape as `oauth2.servers.<slug>.*`).
    # A wallet binds to many OID4VCI issuer, OID4VP verifier, and authorization-server instances,
    # and each of those instances can serve many wallets in the same tenant, so the bindings are
    # n-to-m join rows that carry their own configuration.

    BusinessWalletEdition:
      type: string
      description: >
        Commercial tier of a business wallet. `standard` requires the `business-wallet.standard.v1`
        license feature, which both the standard and the enterprise edition grant. `enterprise`
        additionally requires `business-wallet.enterprise.v1`. Instance counts are bounded by the
        `business-wallet.instances.v1` cardinality quota, keyed `wallet.instances.perTenant.max`.
      enum: [standard, enterprise]
      example: standard

    BusinessWalletBindingCounts:
      type: object
      readOnly: true
      description: Number of bound instances per kind, denormalised so list views do not need a per-row fan-out.
      properties:
        issuers:
          type: integer
          minimum: 0
          example: 2
        verifiers:
          type: integer
          minimum: 0
          example: 1
        authorizationServers:
          type: integer
          minimum: 0
          example: 1

    BusinessWallet:
      type: object
      description: |
        Business wallet instance backed by `wallets.<slug>.*` tenant config keys and a WALLET
        capability on the wallet's software party.

        The binding requirement is ONE-DIRECTIONAL, and this matters when reasoning about the
        `409`s on the instance-delete operations. A wallet must bind the issuers and verifiers it
        uses: those bindings are what its issuer and verifier roles act through, and a wallet with
        none can offer nothing. An issuer or a verifier, on the other hand, is a first-class tenant
        instance in its own right and needs no wallet at all -- a tenant may run issuers and
        verifiers with no business wallet anywhere, addressed directly through their own APIs.

        So a binding constrains the WALLET, never the instance. Deleting an issuer or verifier that
        no wallet binds is unaffected by anything here; the `409` fires only where a wallet would
        be left pointing at something that no longer exists.
      required: [tenantId, partyId, slug, displayName, edition, enabled, managementMode, capability]
      properties:
        tenantId:
          type: string
          format: uuid
          example: 7b3c2d9e-1f4a-4c8b-9e2d-5a6f7c8b9d01
        partyId:
          type: string
          format: uuid
          readOnly: true
          description: Software party id of the wallet instance. Assigned by the create command and immutable afterwards.
          example: 2a19c4d5-7e3b-4f10-8c5a-9b0d1e2f3a44
        slug:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,62}$'
          description: >
            Route and config key segment. The slug is part of a permanent public URL, so it is
            supplied explicitly on create and is immutable afterwards.
          example: partners
        displayName:
          type: string
          description: Human-readable wallet name shown in the console and in the wallet shell.
          example: Acme Partner Wallet
        edition:
          $ref: '#/components/schemas/BusinessWalletEdition'
        enabled:
          type: boolean
          default: true
          description: When false the public route stays reserved but serves a disabled page.
        managementMode:
          $ref: './software-manager-components.yml#/components/schemas/ManagementMode'
        runtimeMode:
          $ref: './software-manager-components.yml#/components/schemas/RuntimeMode'
        capability:
          $ref: './software-manager-components.yml#/components/schemas/SoftwareCapability'
        host:
          type: string
          nullable: true
          description: Optional custom host, lower-case and without scheme or port, for the wallet public surface. When absent the wallet is served from the tenant host.
          example: wallet.acme.example
        pathPrefix:
          type: string
          nullable: true
          description: Optional route prefix. When absent the command derives `/wallets/<slug>`.
          example: /wallets/partners
        publicUrl:
          type: string
          format: uri
          nullable: true
          readOnly: true
          description: Canonical public URL of this wallet, projected from the tenant public endpoint reservation.
          example: https://acme.example/wallets/partners
        bindingCounts:
          $ref: '#/components/schemas/BusinessWalletBindingCounts'
        holder:
          $ref: '#/components/schemas/BusinessWalletHolderSection'
        system:
          type: boolean
          default: false
          readOnly: true
          description: True for bootstrap/internal wallets required for tenant operation. System wallets are protected from deletion and excluded from wallet instance quotas.
        createdAt:
          type: string
          format: date-time
          example: '2026-08-14T10:05:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-08-14T10:05:00Z'
      example:
        tenantId: 7b3c2d9e-1f4a-4c8b-9e2d-5a6f7c8b9d01
        partyId: 2a19c4d5-7e3b-4f10-8c5a-9b0d1e2f3a44
        slug: partners
        displayName: Acme Partner Wallet
        edition: standard
        enabled: true
        managementMode: MANAGED
        runtimeMode: VDX_MANAGED
        capability:
          id: 6a2f0b71-1c3d-4e58-9a7b-0c1d2e3f4a5b
          tenantId: 7b3c2d9e-1f4a-4c8b-9e2d-5a6f7c8b9d01
          softwarePartyId: 2a19c4d5-7e3b-4f10-8c5a-9b0d1e2f3a44
          capabilityType: WALLET
          isEnabled: true
          system: false
          lifecycleStatus: ACTIVE
          createdAt: '2026-08-14T10:05:00Z'
          updatedAt: '2026-08-14T10:05:00Z'
        host: null
        pathPrefix: /wallets/partners
        publicUrl: https://acme.example/wallets/partners
        bindingCounts:
          issuers: 2
          verifiers: 1
          authorizationServers: 1
        system: false
        createdAt: '2026-08-14T10:05:00Z'
        updatedAt: '2026-08-14T10:05:00Z'

    BusinessWalletHolderSection:
      type: object
      description: >
        Holder role section of a business wallet. Present only when the holder role has been
        enabled for the wallet. It carries the custody linkage for authenticated configuration
        consumers and is never exposed through the public bootstrap context.


        Every member below `enabled` is optional AT THE SCHEMA LEVEL and REQUIRED WHENEVER
        `enabled` IS TRUE. They are optional only because the section is also the shape a wallet
        reads back while the holder role is off, where none of them has a value to carry -- not
        because an enabled wallet may omit them. A wallet whose holder role reports `enabled: true`
        while any of them is absent is HALF PROVISIONED, and a consumer that needs one may not
        invent it: the wallet-unit passkey ceremony is refused with `409` instead, because the
        alternative is a ceremony run against custody or a policy nobody configured. Enablement is
        therefore expected to write all four together, and repair means finishing the enablement
        rather than filling a member in at the edge.
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: True when the holder role is enabled for this wallet.
        walletUnitId:
          type: string
          description: >
            Stable wallet unit identifier of the unit that provides holder custody for this wallet.
            Required whenever `enabled` is true.
          example: wu-3f8a1c
        walletAccountId:
          type: string
          description: >
            Identifier of the wallet account the custody unit is enrolled under. Required whenever
            `enabled` is true.
          example: 4c1d9e2f-7b3a-4d58-8e6f-0a1b2c3d4e5f
        activationKeyRef:
          type: string
          description: >
            Reference to the wallet unit's activation key -- the key a passkey activation decision
            is minted against. Required whenever `enabled` is true, because the wallet-unit
            activation ceremony names it in its request body and no other party holds it: it is a
            custody identifier of the same class as `walletUnitId`, so a browser client never
            receives it and a server-side consumer substitutes it on the client's behalf.
          example: activation:wu-3f8a1c
        rpPolicy:
          allOf:
            - $ref: './wallet-unit-components.yml#/components/schemas/WebAuthnRpPolicy'
          description: >
            Relying-party policy the wallet unit's passkey ceremonies for this wallet are verified
            against. Required whenever `enabled` is true. This is the wallet-unit contract's own
            `WebAuthnRpPolicy`, referenced rather than restated so the value stored here and the
            value the ceremony verifies against cannot drift apart in spelling -- note in
            particular that its `backupStatePolicy` is the wallet-unit enum
            (`ALLOW_ANY`/`REQUIRE_BACKUP_ELIGIBLE`/...), not the lower-case-hyphenated spelling
            used elsewhere in this document.


            NOT DERIVED FROM THE WALLET'S ORIGIN. `rpId` and `allowedOrigins` would be guessable
            from the wallet's public URL, but the rest of the policy -- user verification,
            attestation, allowed transports, backup state, challenge lifetime -- is a tenant
            posture decision. Defaulting the policy so a ceremony can run would silently relax a
            posture an operator deliberately tightened, and the whole policy travels together, so
            a partially guessed policy is worse than none. An absent policy is a refusal.


            `AsWebAuthnConfig` in this same document is the same SHAPE and the WRONG SCOPE: it is
            the authorization server's LOCAL LOGIN relying-party policy, describing who may sign in
            to the platform, not what authorizes a holder's custody operation. It is a plausible
            SOURCE for an operator filling this in, and it is not an authority for it: nothing
            resolves this member from it, and the two may legitimately differ.
      example:
        enabled: true
        walletUnitId: wu-3f8a1c
        walletAccountId: 4c1d9e2f-7b3a-4d58-8e6f-0a1b2c3d4e5f
        activationKeyRef: activation:wu-3f8a1c
        rpPolicy:
          rpId: acme.example
          allowedOrigins: [https://acme.example]
          userVerification: required
          backupStatePolicy: ALLOW_ANY
          challengeTtlSeconds: 300

    CreateBusinessWalletRequest:
      type: object
      additionalProperties: false
      description: >
        Create request for a business wallet. The command creates the wallet software party with a
        WALLET capability, reserves the BUSINESS_WALLET tenant public endpoint, and writes the
        initial `wallets.<slug>.*` configuration. The slug is required rather than derived from the
        display name, because it becomes a permanent public route.
      required: [slug, displayName, edition]
      properties:
        slug:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,62}$'
          description: Permanent route and config key segment. Must be unique within the tenant.
          example: partners
        displayName:
          type: string
          description: Human-readable wallet name.
          example: Acme Partner Wallet
        edition:
          $ref: '#/components/schemas/BusinessWalletEdition'
        enabled:
          type: boolean
          default: true
        managementMode:
          $ref: './software-manager-components.yml#/components/schemas/ManagementMode'
        runtimeMode:
          $ref: './software-manager-components.yml#/components/schemas/RuntimeMode'
        host:
          type: string
          nullable: true
          description: Optional custom host for the wallet public surface.
          example: wallet.acme.example
        pathPrefix:
          type: string
          nullable: true
          description: Optional route prefix. When omitted the command derives `/wallets/<slug>`.
          example: /wallets/partners
      example:
        slug: partners
        displayName: Acme Partner Wallet
        edition: standard
        enabled: true
        managementMode: MANAGED
        runtimeMode: VDX_MANAGED
        pathPrefix: /wallets/partners

    UpdateBusinessWalletRequest:
      type: object
      additionalProperties: false
      description: >
        Partial update request for a business wallet descriptor. `slug` and `partyId` are immutable:
        the slug is a permanent public route and the party id is the wallet's identity in the party
        model. Downgrading `edition` from `enterprise` to `standard` clamps enterprise-only feature
        flags on the next read of the features section; the stored values are kept.
      properties:
        displayName:
          type: string
          example: Acme Partner Wallet
        edition:
          $ref: '#/components/schemas/BusinessWalletEdition'
        enabled:
          type: boolean
        host:
          type: string
          nullable: true
        pathPrefix:
          type: string
          nullable: true
      example:
        displayName: Acme Partner Wallet
        enabled: false

    BusinessWalletList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BusinessWallet'
        page:
          $ref: '#/components/schemas/PlatformConfigPageMeta'

    DeleteBusinessWalletResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
          description: True when the business wallet existed and was deleted.
        removedBindings:
          type: integer
          minimum: 0
          description: Number of issuer, verifier, and authorization-server binding rows removed with the wallet.
          example: 4
        removedConfigKeys:
          type: integer
          minimum: 0
          description: Number of tenant config keys removed under `wallets.<slug>.`.
          example: 17
      example:
        deleted: true
        removedBindings: 4
        removedConfigKeys: 17

    # ---- Business wallet configuration sections ------------------------------

    BusinessWalletBrandingSettings:
      type: object
      description: Write shape for the business wallet branding section, stored under `wallets.<slug>.branding.*`.
      properties:
        themeApplicationId:
          type: string
          nullable: true
          description: Theme application id resolved by the theming engine for this wallet shell.
          example: business-wallet:partners:production
        logoUrl:
          type: string
          format: uri
          nullable: true
          description: Logo shown in the wallet shell header.
          example: https://cdn.acme.example/partner-wallet-logo.svg
        supportUrl:
          type: string
          format: uri
          nullable: true
          description: Support or help destination linked from the wallet shell.
          example: https://acme.example/support
        locales:
          type: array
          nullable: true
          description: BCP 47 locales offered by the wallet language switcher.
          items:
            type: string
          example: [en-US, nl-NL]
        defaultLocale:
          type: string
          nullable: true
          description: BCP 47 locale used before the visitor picks one. Must be present in `locales`.
          example: en-US
      example:
        themeApplicationId: business-wallet:partners:production
        logoUrl: https://cdn.acme.example/partner-wallet-logo.svg
        supportUrl: https://acme.example/support
        locales: [en-US, nl-NL]
        defaultLocale: en-US

    BusinessWalletBrandingSettingsView:
      type: object
      description: Effective business wallet branding settings with source markers.
      properties:
        themeApplicationId:
          $ref: '#/components/schemas/StringConfigField'
        logoUrl:
          $ref: '#/components/schemas/StringConfigField'
        supportUrl:
          $ref: '#/components/schemas/StringConfigField'
        locales:
          $ref: '#/components/schemas/StringListConfigField'
        defaultLocale:
          $ref: '#/components/schemas/StringConfigField'
      example:
        themeApplicationId: { value: 'business-wallet:partners:production', source: tenant }
        logoUrl: { value: https://cdn.acme.example/partner-wallet-logo.svg, source: tenant }
        supportUrl: { value: https://acme.example/support, source: tenant }
        locales: { value: [en-US, nl-NL], source: tenant }
        defaultLocale: { value: en-US, source: default }

    BusinessWalletFeaturesSettings:
      type: object
      description: >
        Write shape for the business wallet feature section, stored under `wallets.<slug>.features.*`.
        Writes are accepted for every flag whatever the licensed edition is; the read view clamps
        flags whose backing license feature is not granted.


        These flags gate OPERATOR surfaces inside the wallet application. They are deliberately not
        holder capabilities: a business wallet presents, requests and manages credentials on behalf
        of the organisation that runs it, and holder-side custody reaches it through an edge wallet
        carrying a business-wallet profile, not through this browser application.
      properties:
        issuanceEnabled:
          type: boolean
          nullable: true
          description: >
            Exposes the issuer role: issuing a credential directly from the wallet by QR code or
            link, against an issuer bound to this wallet.
        emailIssuanceEnabled:
          type: boolean
          nullable: true
          description: >
            Exposes issuance by email, minting `credential.issuance` invitations for one recipient
            or a recipient table. Requires `issuanceEnabled`.
        verificationEnabled:
          type: boolean
          nullable: true
          description: >
            Exposes the verifier role: requesting a presentation by QR code or link, against a
            verifier bound to this wallet, and reading the result.
        emailVerificationEnabled:
          type: boolean
          nullable: true
          description: >
            Exposes verification by email, minting `credential.verification` invitations. Requires
            `verificationEnabled`.
        contactsEnabled:
          type: boolean
          nullable: true
          description: >
            Exposes the organisation directory, so recipients can be selected from tenant parties
            rather than only from an uploaded table.
        semanticIntegrationEnabled:
          type: boolean
          nullable: true
          description: >
            Exposes integration with the enterprise information system and semantic modeling. This
            is the enterprise tier's differentiator and is clamped off unless the tenant is granted
            `business-wallet.enterprise.v1`.
        workspaceEnabled:
          type: boolean
          nullable: true
          description: >
            The Workspace product is deployed for this tenant, so the wallet's trimmed Workspace
            reads the platform Inbox instead of the wallet's own holder tasks. Clamped off unless
            the tenant is granted `business-wallet.enterprise.v1`.
      example:
        issuanceEnabled: true
        emailIssuanceEnabled: true
        verificationEnabled: true
        emailVerificationEnabled: false
        contactsEnabled: true
        semanticIntegrationEnabled: false
        workspaceEnabled: false

    BusinessWalletFeaturesSettingsView:
      type: object
      description: >
        Effective business wallet feature flags with source markers. Reads are license-clamped: a
        flag whose backing license feature is not granted to the tenant reads back `false` with
        `source: license`, whatever the stored tenant value is. Restoring the entitlement or
        upgrading the wallet edition makes the stored value visible again without a rewrite.


        `source: license` is deliberately distinct from `source: default`. A defaulted value is one
        the operator may still override; a license-clamped value is one they cannot, until the
        entitlement changes.
      properties:
        issuanceEnabled:
          $ref: '#/components/schemas/BooleanConfigField'
        emailIssuanceEnabled:
          $ref: '#/components/schemas/BooleanConfigField'
        verificationEnabled:
          $ref: '#/components/schemas/BooleanConfigField'
        emailVerificationEnabled:
          $ref: '#/components/schemas/BooleanConfigField'
        contactsEnabled:
          $ref: '#/components/schemas/BooleanConfigField'
        semanticIntegrationEnabled:
          $ref: '#/components/schemas/BooleanConfigField'
        workspaceEnabled:
          $ref: '#/components/schemas/BooleanConfigField'
      example:
        issuanceEnabled: { value: true, source: tenant }
        emailIssuanceEnabled: { value: true, source: default }
        verificationEnabled: { value: true, source: tenant }
        emailVerificationEnabled: { value: false, source: default }
        contactsEnabled: { value: true, source: default }
        semanticIntegrationEnabled: { value: false, source: license }
        workspaceEnabled: { value: false, source: license }

    BusinessWalletIssuanceDefaultsSettings:
      type: object
      description: >
        Write shape for the business wallet issuance defaults section, stored under
        `wallets.<slug>.issuance.*`. These are the values the wallet pre-fills when a user starts an
        issuance flow; they do not replace the bound issuer instance's own configuration.
      properties:
        defaultIssuerId:
          type: string
          format: uuid
          nullable: true
          description: Issuer instance id pre-selected for new issuance flows. Must match an issuer binding on this wallet.
          example: 4ca2a7cc-f5ef-4e13-8c0d-6a8bd7f6d211
        credentialConfigurationIds:
          type: array
          nullable: true
          description: OID4VCI `credential_configuration_id` values offered by default. When null the wallet offers everything the default issuer binding allows.
          items:
            type: string
          example: [EmployeeBadgeSdJwt]
        invitationTtl:
          type: string
          nullable: true
          description: ISO-8601 duration an issuance invitation stays valid.
          example: PT24H
        landingUrlTemplate:
          type: string
          nullable: true
          description: Template for the invitation landing URL. Supports the `{walletSlug}` and `{invitationId}` placeholders.
          example: https://acme.example/wallets/partners/invite/{invitationId}
        emailSubject:
          type: string
          nullable: true
          description: Default subject line for invitation mail sent from this wallet.
          example: Your Acme partner credential is ready
      example:
        defaultIssuerId: 4ca2a7cc-f5ef-4e13-8c0d-6a8bd7f6d211
        credentialConfigurationIds: [EmployeeBadgeSdJwt]
        invitationTtl: PT24H
        landingUrlTemplate: https://acme.example/wallets/partners/invite/{invitationId}
        emailSubject: Your Acme partner credential is ready

    BusinessWalletIssuanceDefaultsSettingsView:
      type: object
      description: Effective business wallet issuance defaults with source markers.
      properties:
        defaultIssuerId:
          $ref: '#/components/schemas/StringConfigField'
        credentialConfigurationIds:
          $ref: '#/components/schemas/StringListConfigField'
        invitationTtl:
          $ref: '#/components/schemas/StringConfigField'
        landingUrlTemplate:
          $ref: '#/components/schemas/StringConfigField'
        emailSubject:
          $ref: '#/components/schemas/StringConfigField'
      example:
        defaultIssuerId: { value: 4ca2a7cc-f5ef-4e13-8c0d-6a8bd7f6d211, source: tenant }
        credentialConfigurationIds: { value: [EmployeeBadgeSdJwt], source: tenant }
        invitationTtl: { value: PT24H, source: default }
        landingUrlTemplate: { value: 'https://acme.example/wallets/partners/invite/{invitationId}', source: default }
        emailSubject: { value: Your Acme partner credential is ready, source: tenant }

    BusinessWalletVerificationDefaultsSettings:
      type: object
      description: >
        Write shape for the business wallet verification defaults section, stored under
        `wallets.<slug>.verification.*`. DCQL queries stay in the DCQL store; this section only
        records which of them the wallet pre-selects.
      properties:
        defaultVerifierId:
          type: string
          format: uuid
          nullable: true
          description: Verifier instance id pre-selected for new presentation flows. Must match a verifier binding on this wallet.
          example: b12f86b9-fab4-48c7-9e14-e0a930a64182
        queryIds:
          type: array
          nullable: true
          description: DCQL query ids offered by default. When null the wallet offers everything the default verifier binding allows.
          items:
            type: string
          example: [employee-badge-check]
        responseMode:
          type: string
          nullable: true
          description: OID4VP response mode requested by default.
          example: direct_post.jwt
        invitationTtl:
          type: string
          nullable: true
          description: ISO-8601 duration a verification invitation stays valid.
          example: PT15M
      example:
        defaultVerifierId: b12f86b9-fab4-48c7-9e14-e0a930a64182
        queryIds: [employee-badge-check]
        responseMode: direct_post.jwt
        invitationTtl: PT15M

    BusinessWalletVerificationDefaultsSettingsView:
      type: object
      description: Effective business wallet verification defaults with source markers.
      properties:
        defaultVerifierId:
          $ref: '#/components/schemas/StringConfigField'
        queryIds:
          $ref: '#/components/schemas/StringListConfigField'
        responseMode:
          $ref: '#/components/schemas/StringConfigField'
        invitationTtl:
          $ref: '#/components/schemas/StringConfigField'
      example:
        defaultVerifierId: { value: b12f86b9-fab4-48c7-9e14-e0a930a64182, source: tenant }
        queryIds: { value: [employee-badge-check], source: tenant }
        responseMode: { value: direct_post.jwt, source: default }
        invitationTtl: { value: PT15M, source: default }

    BusinessWalletSessionSettings:
      type: object
      description: >
        Write shape for the business wallet session section, stored under `wallets.<slug>.session.*`.
        The wallet is a browser application that logs its users in against one of its bound
        authorization servers.
      properties:
        redirectPath:
          type: string
          nullable: true
          description: Path, relative to the wallet route, the authorization server redirects to after login. Combined with the wallet public URL it forms the registered redirect URI.
          example: /auth/callback
        postLogoutRedirectPath:
          type: string
          nullable: true
          description: Path, relative to the wallet route, the authorization server redirects to after logout.
          example: /signed-out
        defaultAuthorizationServerId:
          type: string
          format: uuid
          nullable: true
          description: Stable AS resource UUID used when the wallet does not show an IdP picker. Must match the authorization-server binding marked default.
          example: 996d5f68-8836-4af1-b6da-1330b42a2805
        sessionTtlSeconds:
          type: integer
          format: int64
          nullable: true
          minimum: 60
          description: Wallet browser session lifetime in seconds.
          example: 3600
        federatedAuthorizationServersAllowed:
          type: boolean
          nullable: true
          description: >
            Widens sign-in to authorization servers that are not served from the wallet's own host.


            By default the wallet advertises only bound authorization servers on its own host, so a
            browser session is established against an origin the tenant already serves. Turning this
            on lets the wallet advertise a bound authorization server on another host, which is what
            federating with a customer's own identity provider requires. It is off unless set,
            because it is a widening of the origins the wallet will send its users to and that is a
            decision to take deliberately rather than to inherit.


            It widens authorization servers only. Issuer and verifier URLs are protocol metadata the
            browser fetches as the tenant, and are unaffected.
          example: false
      example:
        redirectPath: /auth/callback
        postLogoutRedirectPath: /signed-out
        defaultAuthorizationServerId: 996d5f68-8836-4af1-b6da-1330b42a2805
        sessionTtlSeconds: 3600
        federatedAuthorizationServersAllowed: false

    BusinessWalletSessionSettingsView:
      type: object
      description: Effective business wallet session settings with source markers.
      properties:
        redirectPath:
          $ref: '#/components/schemas/StringConfigField'
        postLogoutRedirectPath:
          $ref: '#/components/schemas/StringConfigField'
        defaultAuthorizationServerId:
          $ref: '#/components/schemas/StringConfigField'
        sessionTtlSeconds:
          $ref: '#/components/schemas/IntegerConfigField'
        federatedAuthorizationServersAllowed:
          $ref: '#/components/schemas/BooleanConfigField'
      example:
        redirectPath: { value: /auth/callback, source: default }
        postLogoutRedirectPath: { value: /signed-out, source: default }
        defaultAuthorizationServerId: { value: 996d5f68-8836-4af1-b6da-1330b42a2805, source: tenant }
        sessionTtlSeconds: { value: 3600, source: default }
        federatedAuthorizationServersAllowed: { value: false, source: default }

    # ---- Business wallet bindings --------------------------------------------
    # Binding rows are the n-to-m join between one wallet and the issuer, verifier, and
    # authorization-server instances it uses. A wallet binds many instances and an instance serves
    # many wallets in the same tenant. Unlike the DID key-mapping join, these rows carry mutable
    # configuration, so each kind exposes PATCH alongside add and remove.

    BusinessWalletBindingCommon:
      type: object
      description: Fields shared by every business-wallet binding row, whatever the bound instance kind is.
      required: [bindingId, instanceId]
      properties:
        bindingId:
          type: string
          format: uuid
          readOnly: true
          description: Identifier of this binding row.
          example: 3f6a1c22-8a5b-4a0e-9a6c-2b1d4e7f8a90
        instanceId:
          type: string
          description: >
            Stable resource UUID of the bound issuer, verifier, or authorization server.
            Immutable; rebinding means removing the row and adding another.
          example: 4ca2a7cc-f5ef-4e13-8c0d-6a8bd7f6d211
        partyId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: Software party id of the bound instance.
          example: 4ca2a7cc-f5ef-4e13-8c0d-6a8bd7f6d211
        displayName:
          type: string
          nullable: true
          readOnly: true
          description: Display name denormalised from the bound instance so binding lists render without a second lookup.
          example: Acme Workforce Issuer
        lifecycleStatus:
          allOf:
            - $ref: './software-manager-components.yml#/components/schemas/LifecycleStatus'
          readOnly: true
          description: Lifecycle status denormalised from the bound instance's capability. A binding to a suspended instance stays listed and is skipped at runtime.
        enabled:
          type: boolean
          default: true
          description: When false the binding is retained but the wallet does not offer the bound instance.
        default:
          type: boolean
          default: false
          description: Marks the wallet default for this binding kind. At most one binding per wallet per kind is default; setting it on a second row clears the previous one.
        displayOrder:
          type: integer
          default: 0
          description: Sort key for the wallet's picker. Ties break on `displayName`.
          example: 0
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: '2026-08-14T10:07:00Z'
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: '2026-08-14T10:07:00Z'

    BusinessWalletIssuerBinding:
      allOf:
        - $ref: '#/components/schemas/BusinessWalletBindingCommon'
        - type: object
          description: Binding between a business wallet and one OID4VCI issuer instance.
          properties:
            credentialConfigurationIds:
              type: array
              nullable: true
              description: Subset of the issuer's `credential_configuration_id` values this wallet may request. `null` means every configuration the issuer offers, including ones added later.
              items:
                type: string
              example: [EmployeeBadgeSdJwt]
      example:
        bindingId: 3f6a1c22-8a5b-4a0e-9a6c-2b1d4e7f8a90
        instanceId: 4ca2a7cc-f5ef-4e13-8c0d-6a8bd7f6d211
        partyId: 4ca2a7cc-f5ef-4e13-8c0d-6a8bd7f6d211
        displayName: Acme Workforce Issuer
        lifecycleStatus: ACTIVE
        enabled: true
        default: true
        displayOrder: 0
        credentialConfigurationIds: [EmployeeBadgeSdJwt]
        createdAt: '2026-08-14T10:07:00Z'
        updatedAt: '2026-08-14T10:07:00Z'

    AddBusinessWalletIssuerBindingRequest:
      type: object
      additionalProperties: false
      description: Binds one OID4VCI issuer instance to this business wallet.
      required: [instanceId]
      properties:
        instanceId:
          type: string
          minLength: 1
          description: Issuer instance identifier to bind. Accepts the stable instance slug or software party id of an OID4VCI issuer in the same tenant.
          example: workforce-issuer
        enabled:
          type: boolean
          default: true
        default:
          type: boolean
          default: false
          description: Makes this the wallet's default issuer, clearing the flag on any other issuer binding of this wallet.
        displayOrder:
          type: integer
          default: 0
        credentialConfigurationIds:
          type: array
          nullable: true
          description: Subset of the issuer's credential configurations this wallet may request. Omit or send `null` for all of them.
          items:
            type: string
          example: [EmployeeBadgeSdJwt]
      example:
        instanceId: 4ca2a7cc-f5ef-4e13-8c0d-6a8bd7f6d211
        default: true
        credentialConfigurationIds: [EmployeeBadgeSdJwt]

    UpdateBusinessWalletIssuerBindingRequest:
      type: object
      additionalProperties: false
      description: Partial update of an issuer binding row. `instanceId` is immutable.
      properties:
        enabled:
          type: boolean
        default:
          type: boolean
        displayOrder:
          type: integer
        credentialConfigurationIds:
          type: array
          nullable: true
          items:
            type: string
      example:
        displayOrder: 1
        credentialConfigurationIds: [EmployeeBadgeSdJwt, ContractorBadgeSdJwt]

    BusinessWalletIssuerBindingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BusinessWalletIssuerBinding'
        page:
          $ref: '#/components/schemas/PlatformConfigPageMeta'

    BusinessWalletVerifierBinding:
      allOf:
        - $ref: '#/components/schemas/BusinessWalletBindingCommon'
        - type: object
          description: Binding between a business wallet and one OID4VP verifier instance.
          properties:
            queryIds:
              type: array
              nullable: true
              description: Subset of the verifier's DCQL query ids this wallet may run. `null` means every query the verifier offers, including ones added later.
              items:
                type: string
              example: [employee-badge-check]
      example:
        bindingId: 8c4d2e11-5b7a-4c93-8f21-0d6e3a5b7c14
        instanceId: b12f86b9-fab4-48c7-9e14-e0a930a64182
        partyId: b12f86b9-fab4-48c7-9e14-e0a930a64182
        displayName: Acme Workforce Verifier
        lifecycleStatus: ACTIVE
        enabled: true
        default: true
        displayOrder: 0
        queryIds: [employee-badge-check]
        createdAt: '2026-08-14T10:08:00Z'
        updatedAt: '2026-08-14T10:08:00Z'

    AddBusinessWalletVerifierBindingRequest:
      type: object
      additionalProperties: false
      description: Binds one OID4VP verifier instance to this business wallet.
      required: [instanceId]
      properties:
        instanceId:
          type: string
          minLength: 1
          description: Verifier instance identifier to bind. Accepts the stable instance slug or software party id of an OID4VP verifier in the same tenant.
          example: workforce-verifier
        enabled:
          type: boolean
          default: true
        default:
          type: boolean
          default: false
          description: Makes this the wallet's default verifier, clearing the flag on any other verifier binding of this wallet.
        displayOrder:
          type: integer
          default: 0
        queryIds:
          type: array
          nullable: true
          description: Subset of the verifier's DCQL query ids this wallet may run. Omit or send `null` for all of them.
          items:
            type: string
          example: [employee-badge-check]
      example:
        instanceId: b12f86b9-fab4-48c7-9e14-e0a930a64182
        default: true
        queryIds: [employee-badge-check]

    UpdateBusinessWalletVerifierBindingRequest:
      type: object
      additionalProperties: false
      description: Partial update of a verifier binding row. `instanceId` is immutable.
      properties:
        enabled:
          type: boolean
        default:
          type: boolean
        displayOrder:
          type: integer
        queryIds:
          type: array
          nullable: true
          items:
            type: string
      example:
        enabled: false

    BusinessWalletVerifierBindingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BusinessWalletVerifierBinding'
        page:
          $ref: '#/components/schemas/PlatformConfigPageMeta'

    BusinessWalletAuthorizationServerBinding:
      allOf:
        - $ref: '#/components/schemas/BusinessWalletBindingCommon'
        - type: object
          description: >
            Binding between a business wallet and one authorization-server instance. The wallet logs
            its users in through the bound AS, so a wallet with no authorization-server binding
            cannot bootstrap a session.
          properties:
            instanceId:
              type: string
              format: uuid
              description: Stable authorization-server resource UUID.
            clientId:
              type: string
              description: >
                OAuth2 client id the wallet uses on this authorization server. It is a public PKCE
                client, auto-registered by the add operation against the bound AS using the wallet's
                derived redirect URI, and readable afterwards through the AS client registry. No
                client secret exists for it.
              example: wallet-partners
            scope:
              type: string
              default: openid profile email
              description: Space-delimited scope string requested by the wallet on this authorization server.
              example: openid profile email
            issuerDisplayName:
              type: string
              nullable: true
              description: Label shown for this authorization server on the wallet's IdP picker. Falls back to the AS instance display name when null.
              example: Acme Corporate Login
      example:
        bindingId: d1e5f907-3a2b-4c6d-8e90-1f2a3b4c5d6e
        instanceId: 996d5f68-8836-4af1-b6da-1330b42a2805
        partyId: 996d5f68-8836-4af1-b6da-1330b42a2805
        displayName: Acme Authorization Server
        lifecycleStatus: ACTIVE
        enabled: true
        default: true
        displayOrder: 0
        clientId: wallet-partners
        scope: openid profile email
        issuerDisplayName: Acme Corporate Login
        createdAt: '2026-08-14T10:09:00Z'
        updatedAt: '2026-08-14T10:09:00Z'

    AddBusinessWalletAuthorizationServerBindingRequest:
      type: object
      additionalProperties: false
      description: >
        Binds one authorization-server instance to this business wallet. The command registers a
        public PKCE client on the bound AS using the wallet's derived redirect URI
        (`<wallet public URL><session redirect path>`); no client secret is created or accepted.
        Supplying `clientId` adopts that id for the registration, otherwise the command derives one
        from the wallet slug.
      required: [instanceId]
      properties:
        instanceId:
          type: string
          format: uuid
          description: Stable authorization-server resource UUID in the same tenant.
          example: 996d5f68-8836-4af1-b6da-1330b42a2805
        enabled:
          type: boolean
          default: true
        default:
          type: boolean
          default: false
          description: >
            Makes this the wallet's default authorization server, clearing the flag on any other
            authorization-server binding of this wallet. The first authorization-server binding of a
            wallet becomes the default automatically.
        displayOrder:
          type: integer
          default: 0
        clientId:
          type: string
          nullable: true
          description: Preferred public client id for the auto-registration. When omitted the command derives one from the wallet slug.
          example: wallet-partners
        scope:
          type: string
          default: openid profile email
          description: Space-delimited scope string requested by the wallet on this authorization server.
          example: openid profile email
        issuerDisplayName:
          type: string
          nullable: true
          description: Label shown for this authorization server on the wallet's IdP picker.
          example: Acme Corporate Login
      example:
        instanceId: 996d5f68-8836-4af1-b6da-1330b42a2805
        default: true
        clientId: wallet-partners
        scope: openid profile email
        issuerDisplayName: Acme Corporate Login

    UpdateBusinessWalletAuthorizationServerBindingRequest:
      type: object
      additionalProperties: false
      description: >
        Partial update of an authorization-server binding row. `instanceId` and `clientId` are
        immutable: the client id names a live public client registration on the bound AS.
      properties:
        enabled:
          type: boolean
        default:
          type: boolean
        displayOrder:
          type: integer
        scope:
          type: string
        issuerDisplayName:
          type: string
          nullable: true
      example:
        scope: openid profile email offline_access
        issuerDisplayName: Acme Corporate Login

    BusinessWalletAuthorizationServerBindingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BusinessWalletAuthorizationServerBinding'
        page:
          $ref: '#/components/schemas/PlatformConfigPageMeta'

    BusinessWalletRole:
      type: string
      description: A role granted only within the addressed business wallet.
      enum: [admin, issuer, verifier, holder]

    BusinessWalletMembership:
      type: object
      additionalProperties: false
      required: [identityId, roles, activatedAt, createdAt, updatedAt]
      properties:
        identityId:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BusinessWalletRole'
        activatedAt:
          type: string
          format: date-time
          nullable: true
          description: Null means the grant exists but is not yet effective and does not authorize.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        identityId: 5de7c2cf-53e4-4be7-97a9-3e1eef873881
        displayName: Alice Operator
        email: alice@example.com
        roles: [admin, issuer]
        activatedAt: '2026-08-23T12:00:00Z'
        createdAt: '2026-08-23T12:00:00Z'
        updatedAt: '2026-08-23T12:00:00Z'

    BusinessWalletMembershipList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BusinessWalletMembership'
        page:
          $ref: '#/components/schemas/PlatformConfigPageMeta'

    AddBusinessWalletMembershipRequest:
      type: object
      additionalProperties: false
      required: [identityId, roles, activatedAt]
      properties:
        identityId:
          type: string
          format: uuid
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BusinessWalletRole'
        activatedAt:
          type: string
          format: date-time
          nullable: true
          description: Send the grant time to activate it, or null to create a pending grant.

    UpdateBusinessWalletMembershipRequest:
      type: object
      additionalProperties: false
      required: [roles, activatedAt]
      properties:
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BusinessWalletRole'
        activatedAt:
          type: string
          format: date-time
          nullable: true
          description: Null makes the membership ineffective without revoking it.

    DeveloperConsoleExposureMode:
      type: string
      enum: [PUBLIC, AS_PROTECTED]
      description: Tenant-wide parent exposure policy.

    DeveloperToolExposureMode:
      type: string
      enum: [INHERIT, PUBLIC, AS_PROTECTED]
      description: Per-tool exposure override. INHERIT uses the parent policy.

    DeveloperToolPolicy:
      type: object
      additionalProperties: false
      required: [enabled, exposureMode]
      properties:
        enabled:
          type: boolean
        exposureMode:
          $ref: '#/components/schemas/DeveloperToolExposureMode'

    DeveloperConsoleConfig:
      type: object
      additionalProperties: false
      required: [enabled, exposureMode, tools, revision]
      properties:
        enabled:
          type: boolean
          default: true
        exposureMode:
          $ref: '#/components/schemas/DeveloperConsoleExposureMode'
        tools:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DeveloperToolPolicy'
          description: Known tool ids are api-catalog, openapi, and postman.
        revision:
          type: integer
          format: int64
          minimum: 0
          description: Optimistic-concurrency revision. PUT must supply the current revision.
        displayUrl:
          type: string
          format: uri
          nullable: true
          readOnly: true
          description: >-
            Absolute URL of the tenant Developer Console, resolved from
            tenant.developer-console.public-origin and tenant.developer-console.path
            (default /developer-console). Null while no https public origin is configured.
            Ignored when echoed back on PUT.

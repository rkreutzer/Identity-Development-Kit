    PlatformBootstrapConfigMetadata:
      type: object
      description: Cache, revision, and diagnostic metadata for an internal bootstrap response.
      required: [consumerId, revision, generatedAtEpochMs, ttlSeconds, sourceId]
      properties:
        consumerId:
          type: string
          description: Consumer id the response was generated for.
        revision:
          type: string
          description: Stable revision for the effective bootstrap projection.
        generatedAtEpochMs:
          type: integer
          format: int64
        ttlSeconds:
          type: integer
          format: int64
          minimum: 0
        unchanged:
          type: boolean
          default: false
        sourceId:
          type: string
          example: platform-bootstrap-config
        warnings:
          type: array
          items:
            type: string
          default: []

    PlatformBootstrapConsumerType:
      type: string
      enum: [SATELLITE, FRONTEND_SERVER, OPERATOR_TOOL]

    PlatformBootstrapRequestContext:
      type: object
      description: Normalized bootstrap selector used to resolve tenant, workload, and site scoped wiring.
      required: [consumerType, consumerId]
      properties:
        consumerType:
          $ref: '#/components/schemas/PlatformBootstrapConsumerType'
        consumerId:
          type: string
        tenantId:
          type: string
          nullable: true
        workloadInstanceId:
          type: string
          nullable: true
        deploymentSiteId:
          type: string
          nullable: true
        requestedDomains:
          type: array
          items:
            type: string
          default: []
        requestBaseUrl:
          type: string
          format: uri-reference
          nullable: true
          description: Public request base URL observed by the bootstrap API.

    PlatformRuntimeMetadata:
      type: object
      description: Public platform metadata shared with internal consumers.
      required: [publicBaseUrl, issuer, jwksUri, tokenUrl, authorizationUrl]
      properties:
        publicBaseUrl:
          type: string
          format: uri-reference
        issuer:
          type: string
          format: uri-reference
        jwksUri:
          type: string
          format: uri-reference
        tokenUrl:
          type: string
          format: uri-reference
        authorizationUrl:
          type: string
          format: uri-reference
        endSessionUrl:
          type: string
          format: uri-reference
          nullable: true

    ConsumerIdentityMetadata:
      type: object
      description: Internal service identity allocated to the requesting consumer.
      properties:
        serviceId:
          type: string
          nullable: true
        clientId:
          type: string
          nullable: true
        audience:
          type: string
          nullable: true

    ServiceBootstrapMetadata:
      type: object
      description: Internal service definition and endpoint set.
      required: [serviceId, endpoints]
      properties:
        serviceId:
          type: string
        audience:
          type: string
          nullable: true
        scopes:
          type: array
          uniqueItems: true
          items:
            type: string
          description: Exact workload scopes required for this service endpoint.
          default: []
        trustDomain:
          type: string
          format: uri-reference
          nullable: true
        endpoints:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ServiceEndpointMetadata'
          default: {}

    ServiceEndpointMetadata:
      type: object
      description: Concrete internal endpoint for a protocol exposed by a service.
      required: [protocol, url, visibility]
      properties:
        protocol:
          type: string
          enum: [HTTP, GRPC]
        url:
          type: string
          format: uri-reference
          description: Concrete callable internal URL for this endpoint.
        visibility:
          type: string
          enum: [INTERNAL, PUBLIC]
        network:
          $ref: '#/components/schemas/ServiceNetworkAddress'

    ServiceNetworkAddress:
      type: object
      description: Optional structured network address for Kubernetes, Docker, or external runtimes.
      required: [runtime, host]
      properties:
        runtime:
          type: string
          enum: [KUBERNETES, DOCKER, EXTERNAL]
        scheme:
          type: string
          nullable: true
          example: grpc
        host:
          type: string
          description: Kubernetes service DNS name, Docker service alias, or external hostname.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          nullable: true
        basePath:
          type: string
          nullable: true
        namespace:
          type: string
          nullable: true
          description: Kubernetes namespace when runtime is KUBERNETES.
        serviceName:
          type: string
          nullable: true
          description: Kubernetes Service name or Docker Compose service name.
        containerName:
          type: string
          nullable: true
          description: Docker container name when runtime is DOCKER.

    TenantResolutionMetadata:
      type: object
      required: [remote]
      properties:
        remote:
          type: boolean
          default: true
        baseDomain:
          type: string
          nullable: true

    LicenseCapabilityProjection:
      type: object
      properties:
        deploymentRole:
          type: string
          nullable: true
        installationId:
          type: string
          nullable: true
        capabilities:
          allOf:
            - $ref: '#/components/schemas/StringMap'
          default: {}

    TelemetryBootstrapMetadata:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        endpoint:
          type: string
          nullable: true
        protocol:
          type: string
          nullable: true

    BootstrapDiagnostics:
      type: object
      required: [sourceId]
      properties:
        sourceId:
          type: string
        localOverridesInEffect:
          type: boolean
          default: false
        warnings:
          type: array
          items:
            type: string
          default: []

    StringMap:
      type: object
      description: String key/value map.
      additionalProperties:
        type: string

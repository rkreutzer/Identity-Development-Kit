        content:
          application/json:
            schema:
              $ref: './trust-domain-components.yml#/components/schemas/EnsureEuTrustSourceRequest'
      responses:
        '200':
          description: Successful ensureEuTrustSource response.
          content:
            application/json:
              schema:

  /domains/{domainId}/lote-sources/{sourceId}/refresh:
    post:
      operationId: refreshLoTERemoteSource
      summary: Refresh LoTE Remote Source
      description: |
        Fetches the active revision's list again and stores a new snapshot. Only REMOTE sources
        can be refreshed; an INLINE source answers 409 with code
        LOTE_SOURCE_INLINE_NOT_REFRESHABLE, because its list changes only through a new revision.
      tags: [LoTESources]
      parameters:
        - $ref: './trust-domain-components.yml#/components/parameters/DomainId'
        - $ref: './trust-domain-components.yml#/components/parameters/SourceId'
        - $ref: './trust-domain-components.yml#/components/parameters/LoTEIfMatch'
      responses:
        '200':
          description: Successful refreshLoTERemoteSource response.
          content:
            application/json:
              schema:
                $ref: './trust-domain-components.yml#/components/schemas/LoTERemoteSourceRefreshResult'
        '400':
          $ref: './trust-domain-components.yml#/components/responses/BadRequest'
        '401':
          $ref: './trust-domain-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './trust-domain-components.yml#/components/responses/NotFound'
        '412':
          $ref: './trust-domain-components.yml#/components/responses/PreconditionFailed'
        '428':
          $ref: './trust-domain-components.yml#/components/responses/PreconditionRequired'
        '403':
          $ref: './trust-domain-components.yml#/components/responses/Forbidden'
        '409':
          description: |
            The source is not in a state that allows a refresh: it has no active revision, or it
            is an INLINE source (code LOTE_SOURCE_INLINE_NOT_REFRESHABLE).
          content:
            application/json:
              schema:
                $ref: './trust-domain-components.yml#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: LOTE_SOURCE_INLINE_NOT_REFRESHABLE
                  message: Inline sources carry their artifact by value and cannot be refreshed; put a new revision instead.
        '422':
          $ref: './trust-domain-components.yml#/components/responses/UnprocessableEntity'

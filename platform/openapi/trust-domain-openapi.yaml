        '412':
          $ref: './trust-domain-components.yml#/components/responses/PreconditionFailed'
        '403':
          $ref: './trust-domain-components.yml#/components/responses/Forbidden'
    put:
      operationId: putLoTERemoteSource
      summary: Put LoTE Source
      description: |
        Creates the next candidate revision of a source. The body is discriminated by sourceKind:
        REMOTE registers a published list that is fetched on validation and refresh, INLINE
        supplies the signed list by value. A source keeps its kind across revisions.
      tags: [LoTESources]
      parameters:
        - $ref: './trust-domain-components.yml#/components/parameters/DomainId'
        - $ref: './trust-domain-components.yml#/components/parameters/SourceId'
        - $ref: './trust-domain-components.yml#/components/parameters/LoTEIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './trust-domain-components.yml#/components/schemas/PutLoTESourceRequest'
            examples:
              remoteSource:
                summary: Register a remote PID provider list
                value:
                  sourceKind: REMOTE
                  profile: PID_PROVIDER
                  url: "https://lote.example.eu/pid-providers.jws"
                  verificationTrustAnchorIds: ["anchor-lote-signer"]
                  allowedHosts: ["lote.example.eu"]
                  maxArtifactBytes: 1048576
                  enabled: true
              inlineSource:
                summary: Register a list supplied by value
                value:
                  sourceKind: INLINE
                  profile: PID_PROVIDER
                  artifact: "eyJhbGciOiJFUzI1NiIsInR5cCI6Impvc2UranNvbiIsIng1YyI6WyJNSUlC..."
                  verificationTrustAnchorIds: ["anchor-lote-signer"]
                  maxArtifactBytes: 1048576
                  enabled: true
      responses:
        '200':
          description: Successful putLoTERemoteSource response.
          content:
            application/json:
              schema:
                $ref: './trust-domain-components.yml#/components/schemas/LoTERemoteSourceRevision'
        '201':
          description: Successful putLoTERemoteSource response for a source registered by this call.
          content:
            application/json:
              schema:
                $ref: './trust-domain-components.yml#/components/schemas/LoTERemoteSourceRevision'
        '400':
          $ref: './trust-domain-components.yml#/components/responses/BadRequest'
        '401':
          $ref: './trust-domain-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './trust-domain-components.yml#/components/responses/NotFound'
        '412':
          $ref: './trust-domain-components.yml#/components/responses/PreconditionFailed'
        '428':
          $ref: './trust-domain-components.yml#/components/responses/PreconditionRequired'
        '403':
          $ref: './trust-domain-components.yml#/components/responses/Forbidden'
        '409':
          $ref: './trust-domain-components.yml#/components/responses/Conflict'
        '422':
          $ref: './trust-domain-components.yml#/components/responses/UnprocessableEntity'
    delete:
      operationId: deleteLoTERemoteSource
      summary: Delete LoTE Remote Source
      tags: [LoTESources]
      parameters:
        - $ref: './trust-domain-components.yml#/components/parameters/DomainId'
        - $ref: './trust-domain-components.yml#/components/parameters/SourceId'
        - $ref: './trust-domain-components.yml#/components/parameters/LoTEIfMatch'
      responses:
        '200':
          description: Successful deleteLoTERemoteSource response.
          content:
            application/json:
              schema:
                $ref: './trust-domain-components.yml#/components/schemas/LoTERemoteSource'
        '400':

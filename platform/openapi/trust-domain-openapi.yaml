      summary: List Trust Anchors
      tags: [TrustAnchors]
      parameters:
        - $ref: './trust-domain-components.yml#/components/parameters/DomainId'
      responses:
        '200':
          description: Successful listTrustAnchors response.
          content:
            application/json:
              schema:
                $ref: './trust-domain-components.yml#/components/schemas/TrustAnchorList'
        '400':
          $ref: './trust-domain-components.yml#/components/responses/BadRequest'
        '401':
          $ref: './trust-domain-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './trust-domain-components.yml#/components/responses/NotFound'
        '412':
          $ref: './trust-domain-components.yml#/components/responses/PreconditionFailed'
    post:
      operationId: createTrustAnchor
      summary: Create Trust Anchor
      tags: [TrustAnchors]
      parameters:
        - $ref: './trust-domain-components.yml#/components/parameters/DomainId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './trust-domain-components.yml#/components/schemas/CreateTrustAnchorRequest'
      responses:
        '201':
          description: Successful createTrustAnchor response.
          content:
            application/json:
              schema:
                $ref: './trust-domain-components.yml#/components/schemas/TrustAnchor'
        '400':
          $ref: './trust-domain-components.yml#/components/responses/BadRequest'
        '401':
          $ref: './trust-domain-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './trust-domain-components.yml#/components/responses/NotFound'
        '412':
          $ref: './trust-domain-components.yml#/components/responses/PreconditionFailed'
  /domains/{domainId}/anchors/{anchorId}:
    put:
      operationId: putTrustAnchor
      summary: Put Trust Anchor
      tags: [TrustAnchors]
      parameters:
        - $ref: './trust-domain-components.yml#/components/parameters/DomainId'
        - $ref: './trust-domain-components.yml#/components/parameters/AnchorId'
        - $ref: './trust-domain-components.yml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './trust-domain-components.yml#/components/schemas/PutTrustAnchorRequest'
      responses:
        '200':
          description: Successful putTrustAnchor response.
          content:
            application/json:
              schema:
                $ref: './trust-domain-components.yml#/components/schemas/TrustAnchor'
        '400':
          $ref: './trust-domain-components.yml#/components/responses/BadRequest'
        '401':
          $ref: './trust-domain-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './trust-domain-components.yml#/components/responses/NotFound'
        '412':
          $ref: './trust-domain-components.yml#/components/responses/PreconditionFailed'
    delete:
      operationId: deleteTrustAnchor
      summary: Delete Trust Anchor
      tags: [TrustAnchors]
      parameters:
        - $ref: './trust-domain-components.yml#/components/parameters/DomainId'
        - $ref: './trust-domain-components.yml#/components/parameters/AnchorId'
        - $ref: './trust-domain-components.yml#/components/parameters/IfMatch'
      responses:
        '200':
          description: Successful deleteTrustAnchor response.
          content:
            application/json:
              schema:
                $ref: './trust-domain-components.yml#/components/schemas/DeleteResult'
        '400':
          $ref: './trust-domain-components.yml#/components/responses/BadRequest'
        '401':
          $ref: './trust-domain-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './trust-domain-components.yml#/components/responses/NotFound'
        '412':
          $ref: './trust-domain-components.yml#/components/responses/PreconditionFailed'
  /domains/{domainId}/anchors/{anchorId}/admissions:
    get:
      operationId: listTrustAnchorAdmissions
      summary: List Trust Anchor Admissions
      tags: [TrustAnchors]
      parameters:
        - $ref: './trust-domain-components.yml#/components/parameters/DomainId'
        - $ref: './trust-domain-components.yml#/components/parameters/AnchorId'
      responses:
        '200':
          description: Successful listTrustAnchorAdmissions response.
          content:
            application/json:
              schema:
                $ref: './trust-domain-components.yml#/components/schemas/TrustAnchorAdmissionList'
        '400':
          $ref: './trust-domain-components.yml#/components/responses/BadRequest'
        '401':
          $ref: './trust-domain-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './trust-domain-components.yml#/components/responses/NotFound'
        '412':
          $ref: './trust-domain-components.yml#/components/responses/PreconditionFailed'
  /domains/{domainId}/anchors/{anchorId}/admissions/{admissionClass}:
    put:
      operationId: putTrustAnchorAdmission
      summary: Put Trust Anchor Admission
      tags: [TrustAnchors]
      parameters:
        - $ref: './trust-domain-components.yml#/components/parameters/DomainId'
        - $ref: './trust-domain-components.yml#/components/parameters/AnchorId'
        - $ref: './trust-domain-components.yml#/components/parameters/AdmissionClass'
        - $ref: './trust-domain-components.yml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './trust-domain-components.yml#/components/schemas/PutTrustAnchorAdmissionRequest'
      responses:
        '200':
          description: Successful putTrustAnchorAdmission response.
          content:
            application/json:
              schema:
                $ref: './trust-domain-components.yml#/components/schemas/TrustAnchorAdmission'
        '400':
          $ref: './trust-domain-components.yml#/components/responses/BadRequest'
        '401':
          $ref: './trust-domain-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './trust-domain-components.yml#/components/responses/NotFound'
        '412':
          $ref: './trust-domain-components.yml#/components/responses/PreconditionFailed'
    delete:
      operationId: deleteTrustAnchorAdmission
      summary: Delete Trust Anchor Admission
      tags: [TrustAnchors]
      parameters:
        - $ref: './trust-domain-components.yml#/components/parameters/DomainId'
        - $ref: './trust-domain-components.yml#/components/parameters/AnchorId'
        - $ref: './trust-domain-components.yml#/components/parameters/AdmissionClass'
        - $ref: './trust-domain-components.yml#/components/parameters/IfMatch'
      responses:
        '200':
          description: Successful deleteTrustAnchorAdmission response.
          content:
            application/json:
              schema:
                $ref: './trust-domain-components.yml#/components/schemas/DeleteResult'
        '400':
          $ref: './trust-domain-components.yml#/components/responses/BadRequest'
        '401':
          $ref: './trust-domain-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './trust-domain-components.yml#/components/responses/NotFound'
        '412':
          $ref: './trust-domain-components.yml#/components/responses/PreconditionFailed'
  /domains/{domainId}/anchors/{anchorId}/mdoc-vical:
    get:
      operationId: describeMdocVicalConfiguration
      summary: Describe Mdoc Vical Configuration
      description: >-
        Returns the ISO 18013-5 Annex C VICAL configured on this anchor. An anchor with no VICAL
        yet returns an unconfigured configuration rather than 404, so a client can render the empty
        form without a special case.
      tags: [MdocVical]
      parameters:
        - $ref: './trust-domain-components.yml#/components/parameters/DomainId'
        - $ref: './trust-domain-components.yml#/components/parameters/AnchorId'
      responses:
        '200':
          description: Successful describeMdocVicalConfiguration response.
          content:
            application/json:
              schema:
                $ref: './trust-domain-components.yml#/components/schemas/MdocVicalConfiguration'
        '400':
          $ref: './trust-domain-components.yml#/components/responses/BadRequest'
        '401':
          $ref: './trust-domain-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './trust-domain-components.yml#/components/responses/NotFound'
    put:
      operationId: configureMdocVicalConfiguration
      summary: Configure Mdoc Vical Configuration
      description: >-
        Sets the VICAL source for this anchor. Every referenced anchor must already exist in the
        same trust domain, be ACTIVE, and hold the admission class for its job: MDOC_VICAL_SIGNER
        for the anchors that verify the artifact signature, CREDENTIAL_ISSUER for the issuing
        authorities the artifact admits. At least one signer anchor is required, because an
        unverified VICAL would admit every authority it happens to contain.
      tags: [MdocVical]
      parameters:
        - $ref: './trust-domain-components.yml#/components/parameters/DomainId'
        - $ref: './trust-domain-components.yml#/components/parameters/AnchorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './trust-domain-components.yml#/components/schemas/MdocVicalSourceConfiguration'
            examples:
              configureMdocVical:
                summary: Configure an mdoc VICAL source
                value:
                  url: "https://issuer.example.com/mdoc/vical"
                  signerAnchorIds: ["anchor-vical-signer"]
                  issuerAnchorIds: ["anchor-iaca-example"]
                  requiredCertificateProfiles: []
                  enabled: true
      responses:
        '200':
          description: Successful configureMdocVicalConfiguration response.
          content:
            application/json:
              schema:
                $ref: './trust-domain-components.yml#/components/schemas/MdocVicalConfiguration'
              example:
                domainId: "mdoc-production"
                anchorId: "vical-provider"
                source:
                  url: "https://issuer.example.com/mdoc/vical"
                  signerAnchorIds: ["anchor-vical-signer"]
                  issuerAnchorIds: ["anchor-iaca-example"]
                  requiredCertificateProfiles: []
                  enabled: true
        '400':
          $ref: './trust-domain-components.yml#/components/responses/BadRequest'
        '401':
          $ref: './trust-domain-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './trust-domain-components.yml#/components/responses/NotFound'
    delete:
      operationId: removeMdocVicalConfiguration
      summary: Remove Mdoc Vical Configuration
      tags: [MdocVical]
      parameters:
        - $ref: './trust-domain-components.yml#/components/parameters/DomainId'
        - $ref: './trust-domain-components.yml#/components/parameters/AnchorId'
      responses:
        '200':
          description: Successful removeMdocVicalConfiguration response.
          content:
            application/json:
              schema:
                $ref: './trust-domain-components.yml#/components/schemas/MdocVicalConfiguration'
        '400':
          $ref: './trust-domain-components.yml#/components/responses/BadRequest'
        '401':
          $ref: './trust-domain-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './trust-domain-components.yml#/components/responses/NotFound'

openapi: 3.0.4
info:
  title: Trust Domain API
  version: 0.1.0
  description: |
    Typed V2 administration and fail-closed internal resolution for tenant trust domains.
    Trust anchors retain enforcement-safe identifier summaries, including optional certificate PEM
    needed by the existing QR and PEM export actions. Attachment administration is generic across
    consumer kinds; the authorization-server consumer is represented on the wire as AS.
  contact:
    name: Product Engineering
    email: support@example.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://api.example.com/api/trust-domain/v1
  - url: http://localhost:8080/api/trust-domain/v1
tags:
  - name: TrustDomains
  - name: TrustAnchors
  - name: TrustSources
  - name: LoTESources
  - name: TrustCatalogs
  - name: MdocVical
  - name: TrustAttachments
  - name: TrustEligibility
  - name: InternalTrustResolution
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /domains:
    get:
      operationId: listTrustDomains
      summary: List Trust Domains
      tags: [TrustDomains]
      responses:
        '200':
          description: Successful listTrustDomains response.
          content:
            application/json:
              schema:
                $ref: './trust-domain-components.yml#/components/schemas/TrustDomainList'
        '400':
          $ref: './trust-domain-components.yml#/components/responses/BadRequest'
        '401':
          $ref: './trust-domain-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './trust-domain-components.yml#/components/responses/NotFound'
        '412':
          $ref: './trust-domain-components.yml#/components/responses/PreconditionFailed'
    post:
      operationId: createTrustDomain
      summary: Create Trust Domain
      tags: [TrustDomains]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './trust-domain-components.yml#/components/schemas/CreateTrustDomainRequest'
      responses:
        '201':
          description: Successful createTrustDomain response.
          content:
            application/json:
              schema:
                $ref: './trust-domain-components.yml#/components/schemas/TrustDomain'
        '400':
          $ref: './trust-domain-components.yml#/components/responses/BadRequest'
        '401':
          $ref: './trust-domain-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './trust-domain-components.yml#/components/responses/NotFound'
        '412':
          $ref: './trust-domain-components.yml#/components/responses/PreconditionFailed'
  /domains/{domainId}:
    get:
      operationId: getTrustDomain
      summary: Get Trust Domain
      tags: [TrustDomains]
      parameters:
        - $ref: './trust-domain-components.yml#/components/parameters/DomainId'
      responses:
        '200':
          description: Successful getTrustDomain response.
          content:
            application/json:
              schema:
                $ref: './trust-domain-components.yml#/components/schemas/TrustDomain'
        '400':
          $ref: './trust-domain-components.yml#/components/responses/BadRequest'
        '401':
          $ref: './trust-domain-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './trust-domain-components.yml#/components/responses/NotFound'
        '412':
          $ref: './trust-domain-components.yml#/components/responses/PreconditionFailed'
    put:
      operationId: putTrustDomain
      summary: Put Trust Domain
      tags: [TrustDomains]
      parameters:
        - $ref: './trust-domain-components.yml#/components/parameters/DomainId'
        - $ref: './trust-domain-components.yml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './trust-domain-components.yml#/components/schemas/PutTrustDomainRequest'
      responses:
        '200':
          description: Successful putTrustDomain response.
          content:
            application/json:
              schema:
                $ref: './trust-domain-components.yml#/components/schemas/TrustDomain'
        '400':
          $ref: './trust-domain-components.yml#/components/responses/BadRequest'
        '401':
          $ref: './trust-domain-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './trust-domain-components.yml#/components/responses/NotFound'
        '412':
          $ref: './trust-domain-components.yml#/components/responses/PreconditionFailed'
    delete:
      operationId: deleteTrustDomain
      summary: Delete Trust Domain
      tags: [TrustDomains]
      parameters:
        - $ref: './trust-domain-components.yml#/components/parameters/DomainId'
        - $ref: './trust-domain-components.yml#/components/parameters/IfMatch'
      responses:
        '200':
          description: Successful deleteTrustDomain response.
          content:
            application/json:
              schema:
                $ref: './trust-domain-components.yml#/components/schemas/DeleteResult'
        '400':
          $ref: './trust-domain-components.yml#/components/responses/BadRequest'
        '401':
          $ref: './trust-domain-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './trust-domain-components.yml#/components/responses/NotFound'
        '412':
          $ref: './trust-domain-components.yml#/components/responses/PreconditionFailed'
  /domains/{domainId}/consumers:
    get:
      operationId: listTrustDomainConsumers
      summary: List Trust Domain Consumers
      tags: [TrustDomains]
      parameters:
        - $ref: './trust-domain-components.yml#/components/parameters/DomainId'
      responses:
        '200':
          description: Successful listTrustDomainConsumers response.
          content:
            application/json:
              schema:
                $ref: './trust-domain-components.yml#/components/schemas/TrustDomainConsumerList'
        '400':
          $ref: './trust-domain-components.yml#/components/responses/BadRequest'
        '401':
          $ref: './trust-domain-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './trust-domain-components.yml#/components/responses/NotFound'
        '412':
          $ref: './trust-domain-components.yml#/components/responses/PreconditionFailed'

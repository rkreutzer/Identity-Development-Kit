  /domains/{domainId}/trust-sources/{sourceId}/revisions/{revision}/validate:
    post:
      operationId: validateTrustSource
      summary: Validate Trust Source
      tags: [TrustSources]
      parameters:
        - $ref: './trust-domain-components.yml#/components/parameters/DomainId'

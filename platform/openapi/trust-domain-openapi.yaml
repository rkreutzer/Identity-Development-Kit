                $ref: './trust-domain-components.yml#/components/schemas/TrustSource'
        '400':
          $ref: './trust-domain-components.yml#/components/responses/BadRequest'
        '401':
          $ref: './trust-domain-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './trust-domain-components.yml#/components/responses/NotFound'
        '412':
          $ref: './trust-domain-components.yml#/components/responses/PreconditionFailed'
    delete:
      operationId: deleteTrustSource
      summary: Delete Trust Source
      tags: [TrustSources]
      parameters:
        - $ref: './trust-domain-components.yml#/components/parameters/DomainId'
        - $ref: './trust-domain-components.yml#/components/parameters/SourceId'
        - $ref: './trust-domain-components.yml#/components/parameters/IfMatch'
      responses:
        '200':
          description: Successful deleteTrustSource response.
          content:
            application/json:
              schema:
                $ref: './trust-domain-components.yml#/components/schemas/DeleteResult'
        '400':
          $ref: './trust-domain-components.yml#/components/responses/BadRequest'
        '401':
          $ref: './trust-domain-components.yml#/components/responses/Unauthorized'
        '404':
          $ref: './trust-domain-components.yml#/components/responses/NotFound'
        '412':
          $ref: './trust-domain-components.yml#/components/responses/PreconditionFailed'
    put:
      operationId: upsertCustomTrustSource
      summary: Upsert Custom Trust Source
      tags: [TrustSources]
      parameters:
        - $ref: './trust-domain-components.yml#/components/parameters/DomainId'
        - $ref: './trust-domain-components.yml#/components/parameters/SourceId'
        - $ref: './trust-domain-components.yml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:

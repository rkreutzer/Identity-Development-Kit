openapi: 3.0.4
info:
  title: OID4VP Universal Verifier Session API Components
  version: 0.1.0
  description: Entity schemas, value objects, and enums for the OID4VP Universal Verifier Session API.
paths: {}
components:
  schemas:
    VerifiedDataOpts:
      type: object
      properties:
        modes:
          type: array
          items:
            $ref: '#/components/schemas/VerifiedDataMode'
      description: >-
        Selects which verified data representations a callback carries. Verified data is only ever included when the
        status is 'authorization_response_verified'. When 'modes' is absent or empty, no verified data is included.
        'credential_claims_deserialized' adds 'credential_claims'. 'authorization_response' and 'vp_token' both add
        'authorization_response', because the vp_token is part of the authorization response.
      example:
        modes:
          - authorization_response
          - vp_token
          - credential_claims_deserialized

    RequestUriMethod:
      type: string
      description: Determines whether the request_uri should be access by a GET or by a POST by the wallet
      enum: [get, post]

    AuthorizationRequestMethod:
      type: string
      description: Determines whether authorization request parameters are delivered inline or through request_uri.
      enum: [url_query, request_uri]
      default: get

    ResponseType:
      type: string
      enum: [vp_token, id_token]
      default: vp_token
      description: The OID4VP response type to use. FIXME Needs to be changed since response_type is a whitespace delimited strung and thus enums are not the correct approach

    ResponseMode:
      type: string
      description: Whether to use regular authorization responses or encrypted (direct_post.jwt) authorization responses
      enum: [direct_post, direct_post.jwt]
      default: direct_post

    AuthorizationStatus:
      type: string
      enum:
        - authorization_request_created
        - authorization_request_retrieved
        - authorization_response_received
        - authorization_response_verified
        - error

    VerifiedDataMode:
      type: string
      description: The way verified data will be represented. Either the full Authorization Response, vp_tokens, or claims from digital credentials deserialized into JSON objects. The latter is the most easy representation for external apps integrating with this API as thye do not have to perform additional actions, nor have knowledge about the internal of vp_tokens and auth responses.
      enum:
        - authorization_response
        - vp_token
        - credential_claims_deserialized

    VerifiedData:
      type: object
      description: This object is only included in case the authorization status is 'authorization_response_verified'
      properties:
        authorization_response:
          $ref: '#/components/schemas/AuthorizationResponsePayload'
        credential_claims:
          type: array
          items:
            $ref: '#/components/schemas/VerifiedClaimsValue'

    VerifiedClaimsValue:
      type: object
      description: Represents a single credential with its claims and type
      required: [id, type]
      properties:
        id:
          type: string
          description: The id of the query. Can be a presentation exchange id, a DCQL query or query set Id. Used by the RP to match the credential against the query
        type:
          type: string
          description: The digital credential type. Can be a vct value, or for instance a json-ld type
        claims:
          type: object
          additionalProperties: {}
          description: The claims returned and deserialized in the form of a map, where the keys represent the claim names. Values keep their JSON type, including nested objects, arrays and null.

        presentation:
          type: string
        verificationEvidence:
          $ref: '#/components/schemas/VerifiedCredentialEvidence'

    VerifiedCredentialEvidence:
      type: object
      readOnly: true
      required: [presentationSha256, verifiedAtEpochMillis, status]
      properties:
        temporalFacts:
          $ref: '#/components/schemas/VerifiedCredentialTemporalFacts'
        presentationSha256:
          type: string
          description: SHA-256 of the verified presentation bytes, unpadded base64url.
        verifiedAtEpochMillis:
          type: integer
          format: int64
        issuer:
          type: object
          properties:
            issuer: {type: string}
            method: {type: string}
            did: {type: string}
            oidfedEntityId: {type: string}
            kid: {type: string}
            docType: {type: string}
            x5c:
              type: array
              items: {type: string}
        trust:
          type: object
          required: [enabled]
          properties:
            enabled: {type: boolean}
            trusted: {type: boolean}
            mode:
              type: string
              enum: [DEFAULT_ENFORCE, AUDIT, DISABLED]
            method: {type: string}
            trustDomainIds:
              type: array
              items: {type: string}
            matchedTrustDomainId: {type: string}
            matchedAnchorId: {type: string}
            status: {type: string}
        status:
          type: object
          required: [evaluation, required, rejectOnUnresolvable]
          properties:
            evaluation:
              type: string
              enum: [ACCEPT, REJECT, SKIPPED]
            resolvedValues:
              type: array
              items: {type: integer}
            required: {type: boolean}
            rejectOnUnresolvable: {type: boolean}

    VpToken:
      oneOf:
        - $ref: '#/components/schemas/SingleObjectVpTokenPE'
        - $ref: '#/components/schemas/SingleStringVpTokenPE'
        - $ref: '#/components/schemas/MultipleVpTokens'
        - $ref: '#/components/schemas/MultipleVpTokenDCQL'

    SingleObjectVpTokenPE:
      type: object

    SingleStringVpTokenPE:
      type: string

    MultipleVpTokens:
      type: array
      items:
        oneOf:
          - $ref: '#/components/schemas/SingleObjectVpTokenPE'
          - $ref: '#/components/schemas/SingleStringVpTokenPE'

    MultipleVpTokenDCQL:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/MultipleVpTokens'

    AuthorizationResponsePayload:
      type: object
      properties:
        presentation_submission:
          type: object
          description: Object containing information about how the presented credentials fulfill the presentation definition requirements. Only if PE is used!
        vp_token:
          $ref: '#/components/schemas/VpToken'

    CallbackOpts:
      type: object
      properties:
        status:
          type: array
          items:
            $ref: '#/components/schemas/AuthorizationStatus'
          description: Limit the callbacks to certain statuses. If not provided or an empty array is provided, all statuses will be assumed
        verified_data:
          $ref: '#/components/schemas/VerifiedDataOpts'
        url:
          type: string
          description: The callback url for status updates
          example: https://example.com/callback/status
        secret_ref:
          type: string
          pattern: '^sec_[A-Za-z0-9_-]{16,128}$'
          description: |
            Per-session override of the webhook registry: reference of the secret used to sign
            this session's callbacks. When absent, callbacks are signed with the secret of the
            matching registered webhook endpoint, or sent unsigned when there is none.
          example: sec_01JZZZZZZZZZZZZZZZZZZZZZZZ
        signing:
          type: string
          enum: [HMAC_SHA256]
          description: Signature scheme for this session's callbacks. Callbacks carry the same Webhook-Id, Webhook-Timestamp, Webhook-Event-Type, Webhook-Attempt, and Webhook-Signature headers as registry deliveries.
      required:
        - url

    QRCodeOpts:
      type: object
      description: >
        As soon as you include this object the OID4VP agent has to generate a QR code. Every RP implementation needs to support this, as we want to make it easy on the integration side. The integration side can choose whether they create their own QR codes, or whether they want to use the QR code from the RP. Thus every RP conforming to this spec should support generating a QR code in data-uri format. No property is mandatory, so a "qrCodeOpts": {} is already valid and generates a QR with the default properties applied. A RP implementation is free to implement additional properties like logo's etc. This API only mandates a few common properties to not make it too complex for RPs. If the integrating app wants to use their own QR codes they simply need to omit the qr_code param from the request. The agent should not generate a QT code in this case
      properties:
        size:
          type: number
          description: "Size of the QR code in pixels."
          default: 400
        color_dark:
          type: string
          description: >-
            Color of the blocks on the QR code.
            Accepts a CSS <color>.
            For more information about CSS <color>, please refer to [https://developer.mozilla.org/en-US/docs/Web/CSS/color_value](https://developer.mozilla.org/en-US/docs/Web/CSS/color_value).
          default: "#000000"
        color_light:
          type: string
          description: >-
            Color of the empty areas on the QR code.
            Accepts a CSS <color>.
            For more information about CSS <color>, please refer to [https://developer.mozilla.org/en-US/docs/Web/CSS/color_value](https://developer.mozilla.org/en-US/docs/Web/CSS/color_value).
          default: "#ffffff"

    DcqlQuery:
      $ref: './dcql-components.yml#/components/schemas/DcqlQuery'

    AuthorizationRequestDefaults:
      type: object
      additionalProperties: true
      description: |
        Stable partial authorization-request defaults. Same field semantics as
        CreateAuthorizationRequest; merged under any execution-time overrides before
        authorization-request creation.
      properties:
        request_uri_base:
          type: string
          description: The base URI to be used for request URIs. Defaults to "oid4vp://". It is mainly useful for web/organizational wallets that have an https:// URI for OID4VP
          example: https://example.wallet.com
          default: oid4vp://
        request_uri_method:
          $ref: '#/components/schemas/RequestUriMethod'
        authorization_request_method:
          $ref: '#/components/schemas/AuthorizationRequestMethod'
        client_id:
          type: string
          description: The client id and schema as defined in RFC6749 (client_id) and OID4VP (scheme)
          example: redirect_uri%3Ahttps%3A%2F%2Fexample.com%2Fcb
        client_id_scheme:
          type: string
          description: The client id scheme as defined in OID4VP, when not encoded into `client_id`.
        response_type:
          $ref: '#/components/schemas/ResponseType'
        response_mode:
          $ref: '#/components/schemas/ResponseMode'
        response_uri:
          type: string
          description: The response URI the wallet posts the authorization response to.
        wallet_uri_scheme:
          type: string
          description: Override for the wallet deep-link URI scheme used to build the request URI.
        qr_code:
          $ref: '#/components/schemas/QRCodeOpts'
        direct_post_response_redirect_uri:
          type: string
          description: Optional URI where the user agent on the wallet device should redirect when completing the interaction successfully
          example: 'https://example.com/callback/success/my-unique-value-here'
        callback:
          $ref: '#/components/schemas/CallbackOpts'
        client_metadata_id:
          type: string
          description: Identifier of a stored client metadata configuration to apply to this request.
        ttl_seconds:
          type: integer
          description: Time-to-live for the authorization request session, in seconds.

    VerificationSessionBinding:
      type: object
      readOnly: true
      required: [instanceId, createdAtEpochMillis, expiresAtEpochMillis]
      properties:
        instanceId: { type: string }
        templateId: { type: string }
        templateRevision: { type: string }
        queryId: { type: string }
        queryVersion: { type: integer }
        createdAtEpochMillis: { type: integer, format: int64 }
        expiresAtEpochMillis: { type: integer, format: int64 }

    VerifiedCredentialTemporalFacts:
      type: object
      readOnly: true
      description: Absent object means unsupported or uninterpretable temporal facts. Absent properties mean claims were absent from the authenticated credential envelope.
      properties:
        issuedAtEpochMillis: { type: integer, format: int64 }
        notBeforeEpochMillis: { type: integer, format: int64 }
        expiresAtEpochMillis: { type: integer, format: int64 }

    AuthorizationValidationSummary:
      type: object
      readOnly: true
      description: >-
        Outcome of validating an authorization response. Present whenever a validation has run,
        valid or not, so that a session that was rejected can be told apart from one that has not
        been validated yet. Carries no claims, presentation or issuer.
      required: [valid]
      properties:
        valid:
          type: boolean
        rejections:
          type: array
          description: Credentials the verifier discarded on credential-status grounds. Empty on a valid session, and empty on an invalid one whose failure had nothing to do with credential status.
          items:
            $ref: '#/components/schemas/CredentialValidationRejection'

    CredentialValidationRejection:
      type: object
      readOnly: true
      description: >-
        A credential the verifier discarded on credential-status grounds, reported beside - never
        instead of - the session error. Deliberately omits the status list URI, the resolved index
        and every technical diagnostic, and records no credential content.
      required: [credential_query_id, reason, checked_at_epoch_millis]
      properties:
        credential_query_id:
          type: string
          description: The DCQL credential query the discarded credential was submitted for. A credential nested inside a submitted VCDM presentation is reported under that same parent query identity, so more than one entry may share a query id.
        reason:
          $ref: '#/components/schemas/CredentialValidationRejectionReason'
        checked_at_epoch_millis:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds at which the credential status was evaluated.
        status_value:
          type: integer
          description: The raw multi-bit status value. Not a locator, and absent when nothing resolved.

    CredentialValidationRejectionReason:
      type: string
      description: >-
        Credential-status ground on which a submitted credential was discarded. Status grounds only:
        credential expiry is a temporal fact of a credential that did verify and is reported on
        VerifiedCredentialEvidence instead. status_not_accepted asserts neither revocation nor
        suspension and must never be reported as a revocation.
      enum:
        - revoked
        - suspended
        - status_not_accepted
        - status_unresolvable
        - status_required_but_absent
